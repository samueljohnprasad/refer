[[entry]]
id = 3
type = "story"
title = "StarterPath progress persists and switches without loss"
description = "Adds the Journey-owned versioned StarterPath progress and active-path mutation so completing a step, resuming later, or switching paths cannot overwrite another path's progress."
verify = "With two available paths, a reviewer completes a step on path A, switches to path B, restarts, and returns to path A to see its earlier progress and next action intact while path B has its own state."
covers = ["CAP-1", "CAP-5"]
after = [2]
hitl = false
risk = "high"
unknown = "The migration and backfill boundary between current Redux active-course state, v5 progress, and the new StarterPath rows must be confirmed during implementation."
references = [
  "_bmad-output/initiative-happy-product-direction/architecture-happy-product-direction/architecture-happy-product-direction.md#AD-4",
