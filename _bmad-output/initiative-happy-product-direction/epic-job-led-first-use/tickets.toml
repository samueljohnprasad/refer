[[entry]]
id = 7
type = "story"
title = "Activation and paywall boundaries are observable without blocking the first loop"
description = "Defines metadata-only activation events and moves subscription exposure behind activation so the anonymous first lesson-to-practice-to-reflection loop remains free while post-activation premium selection can still open the paywall."
verify = "A clean session completes the first meaningful loop without a paywall; metadata events record goal, lesson, handoff, save, Home, and readiness states without user text; selecting a premium item after activation can show the paywall, and the release checklist records iOS 26 and hosted-environment evidence."
