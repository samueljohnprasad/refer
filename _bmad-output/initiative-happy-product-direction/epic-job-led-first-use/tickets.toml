# Epic 1 breakdown. Table order is the recommended build order.

[[entry]]
id = 1
type = "story"
title = "Anonymous starter path reaches a reusable next action"
description = "Runs one new user through anonymous continuity, the Understand anxious thoughts goal, one authored lesson, a linked practice handoff, and a focused Home return using the shared StarterPath contract."
verify = "On a clean local session, a reviewer starts anonymously, selects Understand anxious thoughts, completes the authored lesson, sees Thought Catcher as the linked next action with boundary copy, and reaches Home without seeing the full catalog first."
covers = ["CAP-1", "CAP-5", "CAP-6"]
after = []
hitl = true
risk = "medium"
unknown = "The local tracer must use the existing Expo route and synthetic data until hosted anonymous-auth and the released route are verified."
references = [
  "_bmad-output/initiative-happy-product-direction/spec-happy-product-direction/experience-flow.md#first-time-user",
  "_bmad-output/initiative-happy-product-direction/architecture-happy-product-direction/architecture-happy-product-direction.md#AD-1",
  "_bmad-output/initiative-happy-product-direction/architecture-happy-product-direction/architecture-happy-product-direction.md#AD-4",
  "app/index.tsx",
  "app/tabs/screens/(onboarding)/premium-onboarding.tsx",
  "src/screens/OnboardingScreen/OnboardingScreen.tsx",
]

[[entry]]
id = 2
type = "story"
title = "Anonymous progress stays with the same user when identity is linked"
description = "Makes anonymous-to-identified continuity explicit so optional Apple or Google signup after activation preserves the same Supabase-owned starter progress and pauses safely on an identity conflict."
verify = "After completing the tracer, a reviewer links an identity and restarts the app to find the same user-owned path state; a conflicting provider identity leaves the anonymous data attached to its original user and presents a recovery outcome."
