  :root{--font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  body{font-family:var(--font);font-size:17px;line-height:25px;font-weight:500;color:#142414;background:#F7F7F7;padding:32px 24px}
  .page{font-size:20px;line-height:26px;font-weight:700}

  .phone{width:410px;height:864px;border:10px solid #142414;border-radius:48px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column;position:relative}

  .pill-help{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid #767676;border-radius:9999px;font-size:15px;line-height:21px;font-weight:700;color:#142414}

  .bub{background:#F8FBF6;color:#142414;border-radius:20px;padding:12px;max-width:80%}

  .me p{max-width:80%;background:#5F7F58;color:#FFFFFF;border-radius:20px;padding:12px}
  /* tactile-button (base): 56px face + 6px rim; the rim is a border */

  /* one pill for quick-reply, check-in and DistortionChips; .s = starter/stem pill at 36px */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:9999px;background:#F7F7F7;border:1px solid #F7F7F7;color:#142414}
  .chip.b{font-weight:700}
  .chip.sel{background:#F8FBF6;border-color:#5F7F58}
  .chip.s{min-height:36px}
  .chips.col{flex-direction:column}
  .chips.col .chip{width:100%}
  .sub{font-size:15px;line-height:21px;color:#4B4B4B}
  .cap{font-size:13px;line-height:18px;color:#4B4B4B}
  .link{color:#44633F;font-weight:700}
  .g8{margin-top:8px}.g12{margin-top:12px}.g16{margin-top:16px}.g24{margin-top:24px}
  /* SavedCard + ProgressPair (base) */
  .card{background:#F7F7F7;border-radius:24px;padding:16px}
  .savedrow{display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;color:#44633F}
  .savedrow svg{width:14px;height:14px;fill:none;stroke:#44633F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .move{margin-top:8px;font-size:24px;line-height:29px;font-weight:600}
  .hardline{margin-top:8px;font-size:17px;line-height:25px;font-weight:700;color:#142414}
  .r{margin-top:12px;padding-top:12px;border-top:1px solid #E5E5E5}
  .r .cap{display:flex;justify-content:space-between}
  .thought{color:#4B4B4B}
  .other{color:#44633F;font-weight:700}
  .pp{display:flex;align-items:center;justify-content:space-between}
  .pp .n{font-size:34px;line-height:40px;font-weight:600}
  .pp.home .n{font-size:28px;line-height:34px}
  .pp .ring{display:flex;align-items:center;gap:8px}
  .pp svg{width:34px;height:34px}

  /* flow chrome (.agents/thought-catcher.html): back, 3-part progress, Get help text button, close */
  .fh{flex:none;display:flex;align-items:center;gap:12px;padding:0 12px}
  .fh .ib{color:#142414}
  .bar{flex:1;display:flex;gap:4px}
  .bar i{flex:1;height:8px;border-radius:9999px;background:#E5E5E5}
  .bar i.f{background:#5F7F58}
  .fh .gh{font-size:15px;line-height:21px;font-weight:700;color:#142414}
  main{flex:1;min-height:0;padding:16px}
  footer{flex:none;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .ask{display:flex;align-items:flex-end;gap:8px;margin-bottom:16px}
  .ask .happi{flex:none;width:84px}
  .ask.small .happi{width:64px}
  .ask .bub{flex:1;align-self:center;font-size:20px;line-height:26px;font-weight:700}
  /* recall-chip */
  .recall{background:#F8FBF6;border:1px solid #D3E0CD;border-radius:18px;padding:12px}
  .field{display:flex;align-items:center;min-height:56px;padding:0 16px;border-radius:9999px;background:#F7F7F7}
  .field i{width:2px;height:24px;background:#5F7F58}
  /* step-up-row options */
  .opt{display:flex;align-items:center;min-height:56px;padding:0 16px;background:#F7F7F7;border-radius:18px;font-weight:700}
  .stack{display:flex;flex-direction:column;gap:8px}
  /* why-sheet over a scrim */
  .scrim{position:absolute;inset:0;background:#142414;opacity:.4}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:24px 24px 0 0;padding:16px 16px 32px}
  .sheet h3{font-size:20px;line-height:26px;font-weight:700;padding-right:44px}
  .sheet .x{position:absolute;top:8px;right:8px;color:#4B4B4B}
  .sheet .src{background:#F7F7F7;border-radius:20px;padding:16px}
  .sheet .acts{display:flex;gap:24px}
  .sheet .acts span{display:flex;align-items:center;min-height:44px}
