    are replaced by what the spines specify.
  Fonts: the product faces are Fredoka (display) and Nunito (text). No network is allowed in a mock,
  so this file uses a system rounded/sans stack; sizes, weights and line heights are the spines'.
  Rules checked: no shadow anywhere (fill and 1px hairline only), no emoji, no streak/XP/coins/confetti,
  moods and traps colourless, every hex from one of the two DESIGN.md files. Static: no script, no network.
  Placeholder copy (spines supply none yet) is listed in the hand-off summary.

  :root{--font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  body{font-family:var(--font);font-size:17px;line-height:25px;font-weight:500;color:#142414;background:#F7F7F7;padding:32px 24px}
  .page{font-size:20px;line-height:26px;font-weight:700}
  .pnote{font-size:15px;line-height:21px;color:#4B4B4B;margin:4px 0 24px;max-width:90ch}
  .frames{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
  figure{width:410px}
  figcaption{margin-top:12px;font-size:15px;line-height:21px;color:#4B4B4B}
  figcaption b{display:block;font-size:17px;line-height:25px;font-weight:700;color:#142414}
  /* device frame: 390x844 screen inside a 10px bezel (a border, not a shadow) */
  .phone{width:410px;height:864px;border:10px solid #142414;border-radius:48px;overflow:hidden;background:#FFFFFF;display:flex;flex-direction:column;position:relative}
  .status{flex:none;height:44px;display:flex;align-items:center;padding:0 28px;font-size:15px;font-weight:700}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ib{width:44px;height:44px;display:grid;place-items:center;color:#44633F}
  /* help-pill (base): outlined, never filled */
  .pill-help{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid #767676;border-radius:9999px;font-size:15px;line-height:21px;font-weight:700;color:#142414}
  /* chat bubbles (base): body text, sage-50 / sage-500 */
  .bub{background:#F8FBF6;color:#142414;border-radius:20px;padding:12px;max-width:80%}
  .me{display:flex;justify-content:flex-end;margin-bottom:16px}
  .me p{max-width:80%;background:#5F7F58;color:#FFFFFF;border-radius:20px;padding:12px}
  /* tactile-button (base): 56px face + 6px rim; the rim is a border */
  .tactile{display:flex;align-items:center;justify-content:center;width:100%;height:62px;border-radius:9999px;background:#5F7F58;border-bottom:6px solid #44633F;color:#FFFFFF;font-size:17px;font-weight:700}
  /* outline-button (base) */
  .outline{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:9999px;background:#FFFFFF;border:1px solid #767676;color:#142414;font-size:17px;font-weight:700}
  /* one pill for quick-reply, check-in and DistortionChips; .s = starter/stem pill at 36px */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:9999px;background:#F7F7F7;border:1px solid #F7F7F7;color:#142414}
  .chip.b{font-weight:700}
  .chip.sel{background:#F8FBF6;border-color:#5F7F58}
  .chip.s{min-height:36px}
  .chips.col{flex-direction:column}
  .chips.col .chip{width:100%}
  .sub{font-size:15px;line-height:21px;color:#4B4B4B}
  .cap{font-size:13px;line-height:18px;color:#4B4B4B}
  .link{color:#44633F;font-weight:700}
  .g8{margin-top:8px}.g12{margin-top:12px}.g16{margin-top:16px}.g24{margin-top:24px}
  /* SavedCard + ProgressPair (base) */
  .card{background:#F7F7F7;border-radius:24px;padding:16px}
  .savedrow{display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;color:#44633F}
  .savedrow svg{width:14px;height:14px;fill:none;stroke:#44633F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .move{margin-top:8px;font-size:24px;line-height:29px;font-weight:600}
  .hardline{margin-top:8px;font-size:17px;line-height:25px;font-weight:700;color:#142414}
  .r{margin-top:12px;padding-top:12px;border-top:1px solid #E5E5E5}
  .r .cap{display:flex;justify-content:space-between}
  .thought{color:#4B4B4B}
  .other{color:#44633F;font-weight:700}
  .pp{display:flex;align-items:center;justify-content:space-between}
  .pp .n{font-size:34px;line-height:40px;font-weight:600}
  .pp.home .n{font-size:28px;line-height:34px}
  .pp .ring{display:flex;align-items:center;gap:8px}
  .pp svg{width:34px;height:34px}

  /* Home: base composition (key-home-first60s): header row, greeting + Happi, check-in, one filled button, the rest, tabs */
  .hdr{flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 8px 0 16px}
  .hero{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0}
  .hero h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em}
  .pond{width:84px;height:84px;border-radius:50%;background:#E5EDE1;display:grid;place-items:center}
  .pond svg{width:68px}
  .say{flex:none;display:flex;justify-content:flex-end;padding:8px 16px 0}
  .body{flex:1;min-height:0;padding:24px 16px 0}
  .tabs{flex:none;display:flex;height:64px;border-top:1px solid #E5E5E5}
  .tabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:16px;font-weight:700;color:#4B4B4B}
  .tabs .on{color:#44633F}
  .quote{border-left:2px solid #D3E0CD;padding-left:12px;color:#4B4B4B}
  .big{margin-top:12px;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em;color:#44633F}
</style>
