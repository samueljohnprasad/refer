# Engagement and logging stories. Table order is the recommended build order.

[[entry]]
id = 1
type = "story"
title = "One sitting, one row, one count on Home"
description = "Thought Catcher generates its entry id at the start of a sitting and passes it on every write with a fixed selected_date; the new rules entryRung and countsAsPractice and the usePracticeCounts hook (lifetime and this-week counts) feed Home's ring and lifetime count from Supabase rows, with the first co-located domain tests."
verify = "Finish a Thought Catcher sitting on a device: exactly one new exercise_entries row exists, Home's ring and count rise by one without restarting the app, and the two rule table tests pass."
covers = ["R1", "R6"]
after = []
hitl = true
risk = "high"
plan_checkpoint = true
unknown = "Whether an anonymous user can write exercise_entries on the hosted project; a person checks the hosted access policy before this starts."
references = ["architecture-engagement-logging/architecture-engagement-logging.md#ad-13", "architecture-engagement-logging/architecture-engagement-logging.md#ad-14", "architecture-engagement-logging/architecture-engagement-logging.md#ad-16", "architecture-engagement-logging/architecture-engagement-logging.md#ad-25", "src/domains/thoughtCatcher/ui/containers/ThoughtCatcherContainer.tsx", "src/hooks/useExerciseMutation.ts", "src/domains/home/ui/containers/HomeContainer.tsx"]

