[[entry]]
id = 6
type = "story"
title = "Queue a failed save and show it as unsynced"
description = "Keeps a failed Thought Catcher write in an outbox keyed by entry id, replays it when the app next comes to the foreground with a user, and passes synced or queued to the saved card so a queued entry shows the unsynced line and moves no count; a queued entry is still in the local reflection cache, so Home treats it as saved today."
