<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Screen: Step 5 — Milestone Celebration</title>
<style>
:root {
  --canvas: #F8FAF7;
  --surface: #FFFFFF;
  --sage-50: #F8FBF6;
  --sage-100: #E5EDE1;
  --sage-200: #D3E0CD;
  --sage-500: #5F7F58;
  --sage-600: #44633F;
  --sage-700: #29452A;
  --sage-800: #152714;
  --ink: #142414;
  --ink-soft: #767676;
  --amber: #FF9600;
  --gold: #FFD900;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #E8ECE6;
  font-family: -apple-system, BlinkMacSystemFont, "Nunito", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
}
.phone-frame {
  width: 393px;
  height: 852px;
  background: var(--canvas);
  border-radius: 54px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.18), 0 0 0 12px #222;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 35px;
  background: #000;
  border-radius: 20px;
  z-index: 10;
}
.header {
  padding: 60px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.progress-bar {
  height: 8px;
  background: var(--sage-200);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  width: 71%; /* Step 5 of 7 */
  height: 100%;
  background: var(--sage-500);
  border-radius: 999px;
}
.celebrate-pill {
  align-self: flex-start;
  background: #FFF7ED;
  color: #C2410C;
  border: 1px solid #FFEDD5;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.screen-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
}
.content {
  flex: 1;
  padding: 12px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.mascot-area {
  width: 110px;
  height: 110px;
  background: var(--sage-100);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 52px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
}
.habit-strip-card {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--sage-200);
  border-radius: 24px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.habit-strip-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.habit-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.streak-badge {
  background: #FFF7ED;
  border: 1.5px solid #FDBA74;
  color: #EA580C;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 4px;
}
.days-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 4px;
}
.day-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.day-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.day-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--sage-50);
  border: 1.5px dashed var(--sage-300);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 14px;
}
.day-dot.active {
  background: var(--sage-100);
  border: 2px solid var(--sage-500);
}
.pledge-card {
  width: 100%;
  background: var(--sage-50);
  border: 1.5px solid var(--sage-300);
  border-radius: 20px;
  padding: 16px 18px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.pledge-icon { font-size: 20px; }
.pledge-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--sage-800);
  line-height: 1.45;
}
.pledge-text strong {
  font-weight: 800;
  color: var(--ink);
}
.footer {
  padding: 16px 24px 36px;
  width: 100%;
}
.tactile-button {
  background: var(--sage-600);
  border-radius: 999px;
  padding-bottom: 6px;
  cursor: pointer;
}
.tactile-face {
  background: var(--sage-500);
  color: #FFF;
  height: 56px;
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="dynamic-island"></div>
  <div class="header">
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="celebrate-pill">✦ Milestone Reached</div>
    <div class="screen-title">Day 1 Streak Ignited! 🔥</div>
  </div>
  <div class="content">
    <div class="mascot-area">🐼</div>
    
    <div class="habit-strip-card">
      <div class="habit-strip-header">
        <span class="habit-title">Weekly Habit Momentum</span>
        <span class="streak-badge">🔥 1 Day Streak</span>
      </div>
      <div class="days-row">
        <div class="day-col"><span class="day-label">M</span><div class="day-dot active">🔥</div></div>
        <div class="day-col"><span class="day-label">T</span><div class="day-dot"></div></div>
        <div class="day-col"><span class="day-label">W</span><div class="day-dot"></div></div>
        <div class="day-col"><span class="day-label">T</span><div class="day-dot"></div></div>
        <div class="day-col"><span class="day-label">F</span><div class="day-dot"></div></div>
        <div class="day-col"><span class="day-label">S</span><div class="day-dot"></div></div>
        <div class="day-col"><span class="day-label">S</span><div class="day-dot"></div></div>
      </div>
    </div>

    <div class="pledge-card">
      <span class="pledge-icon">🌱</span>
      <div class="pledge-text">
        <strong>My Daily Micro-Pledge:</strong><br>
        "I commit to taking just 5 minutes a day to check in with myself. Small daily steps rewire my mind."
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="tactile-button">
      <div class="tactile-face">LOCK IN DAY 1 STREAK</div>
    </div>
  </div>
</div>
</body>
</html>
