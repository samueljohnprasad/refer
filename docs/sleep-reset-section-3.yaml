                  - "health, caregiving, or safety needs make the full routine impractical"
                actions:
                  - "protect the need first, then use one familiar two-minute transition if it still fits"
                  - "skip the experiment and keep only a safe, familiar cue if it still fits"
                  - "choose no routine tonight and preserve necessary time in bed"
                feedbackTitle: "The fallback still counts"
                feedback: "A short-night plan removes pressure. It never asks you to ignore care needs, compress necessary sleep opportunity, or treat one unusual night as experiment evidence."
            - sourceId: u3_3_clear_test_personalize-n4-e5
              category: course_checkpoint
              phase: apply
              concept: evening_blueprint
              durationSeconds: 200
              scaffoldLevel: 6
              difficulty: 0.36
              isScored: true
              content:
                title: "Clear, test, personalize"
                instruction: "A cumulative review of the choices that keep an evening plan flexible."
                introTitle: "Four decisions, no sleep grade"
                intro: "Retrieve the principles, apply them to realistic evenings, and use any misses as pointers for review."
                items:
                  - concept: "Stimulus control"
                    context: "After a long wakeful stretch, bed is starting to feel like a place for effort and planning."
                    prompt: "Which response best protects the bed–sleep association?"
                    clue: "Recall what to do when wakeful struggle has taken over the bed."
                    worked: "Leave the bed, choose a quiet activity, and return when sleepy, while still protecting health and mobility needs."
                    options:
                      - label: "Leave the bed for a quiet activity and return when sleepy, if safe and feasible."
                        feedback: "This interrupts wakeful struggle in bed and preserves flexibility for safety, mobility, and health needs."
                        isCorrect: true
                      - label: "Stay in bed and work harder at making sleep happen."
                        feedback: "Effort can strengthen the link between bed and wakeful struggle; the reset changes context rather than forcing sleep."
                        isCorrect: false
                      - label: "Use the time to solve tomorrow’s hardest problem."
                        feedback: "Problem-solving keeps the bed paired with alert effort instead of offering a quiet reset."
                        isCorrect: false
                  - concept: "Worry capture"
                    context: "A repeated task comes to mind during wind-down, and writing usually feels neutral."
                    prompt: "What makes a capture different from late-night solving?"
                    clue: "Keep it brief and give daytime one next step."
                    worked: "Use a few fragments plus one next step for tomorrow, then stop; writing remains optional."
                    options:
                      - label: "A few fragments and one daytime next step, followed by stopping."
                        feedback: "This parks the concern without demanding a solution or certainty tonight."
                        isCorrect: true
                      - label: "A complete analysis of causes, risks, and every possible outcome."
                        feedback: "That turns capture into an alert problem-solving session rather than a brief parking place."
                        isCorrect: false
                      - label: "Continuing to write even when it becomes activating."
                        feedback: "Writing is optional; activation is a cue to stop and choose quiet reading, familiar relaxation, or no writing."
                        isCorrect: false
                  - concept: "One-change experiment"
                    context: "A learner dims one lamp, reads longer, changes bedtime, and tries a new relaxation method all on the same night."
                    prompt: "What is the strongest evaluation?"
                    clue: "Ask whether one safe lever changed across enough comparable nights."
                    worked: "Return to one safe change, keep other levers as stable as practical, and review several comparable nights."
                    options:
                      - label: "The result is hard to interpret; retest one safe lever across several comparable nights."
                        feedback: "Changing one lever and widening the observation window creates a clearer, less pressurized experiment."
                        isCorrect: true
                      - label: "If sleep was better, all four changes are proven to work."
                        feedback: "One night cannot identify which change mattered or establish a reliable pattern."
                        isCorrect: false
                      - label: "Restrict time in bed next time to make the result clearer."
                        feedback: "Time-in-bed restriction is outside this course and must not be used to strengthen an evening experiment."
                        isCorrect: false
                  - concept: "Flexible blueprint"
                    context: "After one difficult night, Priya says, ‘My blueprint failed, so I need a stricter one.’"
                    prompt: "Which response best evaluates the plan?"
                    clue: "Separate actions under her control from sleep as an automatic outcome."
                    worked: "Check whether the cue and chosen actions were usable, then review a pattern across comparable nights without grading sleep."
                    options:
                      - label: "Review whether the actions were usable and wait for a pattern across comparable nights."
                        feedback: "A blueprint is evaluated by whether its actions are safe and workable, not by commanding sleep on one night."
                        isCorrect: true
                      - label: "Add more rules until every night produces quick sleep."
                        feedback: "More rules can turn a guide into a performance test, and no routine can guarantee sleep on command."
                        isCorrect: false
                      - label: "Ignore symptoms or care needs so the plan stays consistent."
                        feedback: "Health and care needs always outrank consistency; unusual nights can be marked as not comparable."
                        isCorrect: false
                solidMessage: "You can build an evening plan around choices you control and evaluate it without grading sleep."
                revisitMessage: "A short revisit can strengthen any principle that still feels effortful; no single response lowers your path."

concepts:
  - id: "evening_transition"
    objective: "Distinguish an abrupt jump into bed from a gradual change in pace and conditions."
    prerequisites: ["stress_response_basics"]
    misconceptions:
      - "Completing a calming routine should force sleep."
    mastery_evidence:
      - "Selects a transition that prepares conditions without promising sleep."
  - id: "wind_down_range"
    objective: "Choose a flexible wind-down range or sequence that survives a changing evening."
    prerequisites: ["evening_transition"]
    misconceptions:
      - "Wind-down must start at one exact time and last 90 minutes."
    mastery_evidence:
      - "Adapts the same sequence to both a crowded and spacious evening."
  - id: "transition_cue"
    objective: "Select an event-based cue that reliably starts a lower-stimulation sequence."
    prerequisites: ["wind_down_range"]
    misconceptions:
      - "A cue works only when it happens at the same clock time."
    mastery_evidence:
      - "Pairs one movable cue with one realistic first action."
  - id: "evening_light"
    objective: "Evaluate evening light using timing, brightness, duration, distance, and spectrum."
    prerequisites: ["circadian_rhythm"]
    misconceptions:
      - "Blue light is the only light variable that matters."
      - "A warm screen makes any bright late-night exposure neutral."
    mastery_evidence:
      - "Chooses the change that reduces unnecessary exposure without overstating certainty."
  - id: "flexible_screen_use"
    objective: "Make a realistic screen choice that reduces stimulation without all-or-nothing rules."
    prerequisites: ["evening_light", "wind_down_range"]
    misconceptions:
      - "Any necessary evening screen use ruins the night."
    mastery_evidence:
      - "Adapts brightness, duration, distance, or task while preserving necessary use."
  - id: "sleep_environment"
    objective: "Inspect light, sound, temperature, airflow, comfort, and interruptions for repeatable friction."
    prerequisites: ["evening_light"]
    misconceptions:
      - "One universal bedroom setup works for everyone."
    mastery_evidence:
      - "Identifies the largest changeable friction without diagnosing its cause."
  - id: "smallest_useful_change"
    objective: "Select one affordable, accessible change instead of optimizing every bedroom variable."
    prerequisites: ["sleep_environment"]
    misconceptions:
      - "Good sleep requires a perfect bedroom."
    mastery_evidence:
      - "Chooses one high-friction, low-burden adjustment and leaves other variables alone."
  - id: "bed_sleep_association"
    objective: "Classify repeated bed behaviours as cues for sleepiness or alertness."
    prerequisites: ["sleep_pressure", "smallest_useful_change"]
    misconceptions:
      - "More time in bed always creates more sleep."
    mastery_evidence:
      - "Explains how repeated work, scrolling, frustration, or clock-watching can train alertness in bed."
  - id: "stimulus_control"
    objective: "Apply a safe, sleepiness-led response when wakefulness in bed becomes frustrating."
    prerequisites: ["bed_sleep_association"]
    misconceptions:
      - "The rule requires leaving bed after an exact number of minutes."
    mastery_evidence:
      - "Chooses a safe quiet context change and returns when sleepy, with accessibility adaptation."
  - id: "sleep_window_clinician_guidance"
    objective: "Distinguish self-guided stimulus control from clinician-guided sleep-window treatment."
    prerequisites: ["stimulus_control"]
    misconceptions:
      - "Restricting time in bed is a generic challenge anyone should try alone."
    mastery_evidence:
      - "Refers sleep restriction, compression, or a prescribed window to qualified clinical care."
  - id: "worry_capture"
    objective: "Capture an unfinished task or concern briefly without solving every uncertainty."
    prerequisites: ["wind_down_range"]
    misconceptions:
      - "A worry dump must empty the mind or solve the problem."
    mastery_evidence:
      - "Writes or selects a short fragment, one obvious next step, and a stopping point."
  - id: "mind_clearing_choice"
    objective: "Choose or skip a mind-clearing tool according to whether it feels settling."
    prerequisites: ["worry_capture", "stress_response_basics"]
    misconceptions:
      - "Journaling is required for good sleep."
    mastery_evidence:
      - "Switches from activating writing to a suitable quiet alternative without treating it as failure."
  - id: "evening_experiment"
    objective: "Design one safe change and evaluate practicality across several comparable nights."
    prerequisites: ["smallest_useful_change", "mind_clearing_choice"]
    misconceptions:
      - "One good or bad night proves the change worked or failed."
    mastery_evidence:
      - "Keeps one variable clear, observes repeated signals, and makes a keep/change/drop decision."
  - id: "evening_blueprint"
    objective: "Assemble a flexible start cue, transition, bed cue, safe response, and one experiment."
    prerequisites: ["transition_cue", "stimulus_control", "evening_experiment"]
    misconceptions:
      - "A completed blueprint must be followed perfectly every night."
    mastery_evidence:
      - "Builds a full and short version of the plan and adapts it to a disrupted evening."

