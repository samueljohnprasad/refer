adaptation_rules:
  - signal: "repeated_scored_error"
    condition: "Two incorrect attempts on the same misconception"
    action: "Reveal the clue or worked contrast, then offer another attempt."
    safeguard: "Do not remove progress, reduce rewards, or label the learner as poor at sleep."
  - signal: "fast_stable_success"
    condition: "Two correct retrievals plus one correct transfer response"
    action: "Remove optional clue text on the next retrieval and vary the scenario."
    safeguard: "Do not skip safety content or the clinician boundary."
  - signal: "slow_correct_response"
    condition: "Correct answer after extended reading or interaction time"
    action: "Keep the concept on schedule and remove all time pressure."
    safeguard: "Reading speed is not treated as lower mastery."
  - signal: "reflection_skipped"
    condition: "Learner skips writing, private planning, or personal disclosure"
    action: "Continue with progress preserved and offer a non-writing choice."
    safeguard: "Unscored reflection never lowers mastery or blocks completion."
  - signal: "accessibility_conflict"
    condition: "Movement, vision, hearing, or interaction needs conflict with an exercise"
    action: "Offer an equivalent tap-based or verbal-choice version with the same concept."
    safeguard: "Change the interaction, not the mastery standard."
  - signal: "safety_or_clinical_boundary"
    condition: "Scenario includes dangerous sleepiness, suspected sleep apnea, acute symptoms, or self-directed sleep-window treatment"
    action: "Show the professional-care boundary and stop self-guided prescription."
    safeguard: "Do not score help-seeking, symptoms, or medical context."

mastery:
  section_capability: "Design and adapt a safe, flexible evening blueprint."
  required_evidence:
    - "Two successful delayed retrievals from earlier units"
    - "One correct stimulus-control transfer scenario"
    - "One correct clinician-boundary discrimination"
    - "One unscored private blueprint with a short-night fallback"
  excluded_evidence:
    - "Mood improvement"
    - "One night of sleep"
    - "Writing or disclosure volume"
    - "Streak length"
  recovery:
    repeated_error: "restore_support_and_retry"
    isolated_error: "explain_and_continue"
    pause_or_missed_day: "preserve_progress"

