artifact:
  title: "Sleep Reset Unit 1 Verification and Definition of Done"
  type: "test"
  date: "2026-07-29"
  implementation_plan: "docs/plans/2026-07-29-001-feat-sleep-reset-unit-1/implementation-plan.yaml"

verification_contract:
  execution_order:
    - "content_contract"
    - "feedback_unit"
    - "interaction_unit"
    - "analytics_privacy"
    - "typescript"
    - "diff_integrity"
    - "ios_simulator"
    - "graph_refresh"

  automated_gates:
    - id: "V1"
      name: "Content contract"
      command: "npx jest --runInBand src/data/mock/sleep-reset-flat.test.ts"
      proves:
        - "Four lessons contain 7, 7, 7, and 8 exercises."
        - "Order indexes are contiguous."
        - "Exercise types are registered."
        - "Lesson arcs, variety, reflection, teaser, feedback, safety wording, and duration rules hold."
    - id: "V2"
      name: "Feedback resolver"
      command: "npx jest --runInBand src/components/node/exerciseFeedback.test.ts"
      proves:
        - "Option, correctness-specific, explanation, and fallback feedback resolve in priority order."
        - "Malformed content does not crash."
    - id: "V3"
      name: "Correction loop and matching"
      command: "npx jest --runInBand src/components/node/NodeEngine.test.tsx src/components/exercise/MatchingExercise.test.tsx"
      proves:
        - "Wrong answers cannot advance."
        - "Retry and success transitions work."
        - "Matching completion reports success."
        - "Unscored exercises still advance."
    - id: "V4"
      name: "Analytics privacy"
      command: "npx jest --runInBand src/domains/journey/analytics/useJourneyAnalytics.test.ts"
      proves:
        - "Expected events and allowed properties are emitted."
        - "Sensitive response content is absent."
        - "Missing PostHog does not break lessons."
    - id: "V5"
      name: "TypeScript"
      command: "npx tsc --noEmit --pretty false"
      proves:
        - "New data, feedback, analytics, and component contracts compile under strict TypeScript."
    - id: "V6"
      name: "Diff integrity"
      command: "git diff --check"
      proves:
        - "No whitespace errors or malformed patch artifacts."
    - id: "V7"
      name: "Graph refresh"
      command: "graphify update ."
      proves:
        - "Repository dependency graph reflects final files and imports."

  content_checks:
    structure:
      - id: "C1"
        check: "Only u1_1_sleep_mechanics lesson exercises are replaced."
      - id: "C2"
        check: "Course, section, unit, and node IDs remain unchanged."
      - id: "C3"
        check: "Unit 1 exercise count is 29 with lesson counts 7, 7, 7, and 8."
      - id: "C4"
        check: "Every lesson orderIndex starts at 0 and has no gaps or duplicates."
      - id: "C5"
        check: "Node estimatedMins values are 4, 5, 6, and 6."
      - id: "C6"
        check: "Lesson passThreshold values are 0.8."
    learning_design:
      - id: "C7"
        check: "Each lesson uses at least four distinct exercise types."
      - id: "C8"
        check: "Phase order never moves backward: warmup, introduce, challenge, peak, consolidate, cooldown."
      - id: "C9"
        check: "Each lesson has one non-scored reflection, rating, or action-planning exercise."
      - id: "C10"
        check: "Each final exercise is low effort and contains the next-lesson teaser."
      - id: "C11"
        check: "Lesson 2 and Lesson 3 weave prior concepts into at least two exercises."
      - id: "C12"
        check: "Lesson 4 tests stages, cycles, and uncertainty together."
      - id: "C13"
        check: "Every scored exercise requires recall, ordering, matching, discrimination, prediction, correction, comparison, or scenario application."
      - id: "C14"
        check: "No answer can be found only because the correct option is much longer or more clinical."
    feedback:
      - id: "C15"
        check: "Every scored exercise resolves a non-empty correct message."
      - id: "C16"
        check: "Every scored exercise resolves a non-empty incorrect message."
      - id: "C17"
        check: "Incorrect feedback states the relevant rule, not only 'try again.'"
      - id: "C18"
        check: "Correct feedback explains why when the exercise tests a misconception."
    safety:
      - id: "C19"
        check: "No exact sleep stage is inferred from clock time alone."
      - id: "C20"
        check: "No waking is described as proof of illness, brokenness, or safety."
      - id: "C21"
        check: "No course copy diagnoses insomnia or replaces professional care."
      - id: "C22"
        check: "Personal responses have no correct answer and are never scored."
      - id: "C23"
        check: "Copy avoids absolute phrases: 'always in REM,' 'pure REM,' '100% normal,' 'exactly as it should,' 'recovery complete,' and 'completely abnormal.'"
    timing:
      - id: "C24"
        check: "Summed durationSeconds is within 60 seconds of node estimatedMins."
      - id: "C25"
        check: "Lesson 1 stays under five estimated minutes."
      - id: "C26"
        check: "No lesson exceeds seven estimated minutes."

  interaction_checks:
    - id: "I1"
      setup: "Open Lesson 1 and choose an incorrect scored answer."
      action: "Tap Check."
      expected:
        - "Footer title says 'Not quite yet.'"
        - "Specific correction appears."
        - "Exercise index and progress do not advance."
        - "Primary action says 'Try again.'"
    - id: "I2"
      setup: "Remain on the incorrect answer."
      action: "Tap Try again, choose another answer, and Check."
      expected:
        - "Error feedback clears before re-check."
        - "Correct feedback appears after correct Check."
        - "Continue advances exactly one exercise."
    - id: "I3"
      setup: "Complete a matching exercise."
      action: "Match the final pair and Check."
      expected:
        - "Success state appears."
        - "No false error appears."
    - id: "I4"
      setup: "Complete a guided response with the keyboard open."
      action: "Dismiss keyboard and continue."
      expected:
        - "Input remains the primary object."
        - "Footer is reachable and not covered."
        - "Text is preserved during the lesson."
    - id: "I5"
      setup: "Reach the last exercise in Lesson 4."
      action: "Answer correctly and Continue."
      expected:
        - "Specific cumulative feedback includes the next-unit teaser."
        - "Node completes once."
        - "Journey returns without crash."
    - id: "I6"
      setup: "Open any Unit 1 lesson."
      action: "Inspect the first rendered state."
      expected:
        - "Progress is visibly above zero."
        - "Progress then increases after each completed exercise."

  analytics_checks:
    - id: "AN1"
      event: "journey_lesson_started"
      expected_count: 1
      forbidden_data: "all response content"
    - id: "AN2"
      event: "journey_exercise_checked"
      expected_behavior: "one event per scored Check, including retries"
      allowed_data:
        - "course_id"
        - "node_id"
        - "exercise_id"
        - "exercise_type"
        - "concept"
        - "is_correct"
        - "attempt_number"
        - "elapsed_ms"
    - id: "AN3"
      event: "journey_lesson_completed"
      expected_behavior: "one event after final completion"
      allowed_data:
        - "course_id"
        - "node_id"
        - "exercise_count"
        - "checks_count"
        - "first_try_correct_count"
        - "duration_ms"
    - id: "AN4"
      event: "journey_lesson_closed"
      expected_behavior: "one event only when closed before completion"
      allowed_data:
        - "course_id"
        - "node_id"
        - "current_exercise_index"
        - "exercise_count"
        - "duration_ms"
    - id: "AN5"
      forbidden_properties:
        - "prompt"
        - "option_text"
        - "response"
        - "reflection_text"
        - "note"
        - "mood_before"
        - "mood_after"
        - "rating_value"
      expected: "No captured event includes these keys or their values."

  manual_review:
    required_platform: "iOS simulator or dev app"
    checklist:
      - "Run all four Unit 1 lessons from first exercise to completion."
      - "Trigger at least one incorrect answer and successful retry in each scored mechanic."
      - "Check footer with the longest correct and incorrect feedback."
      - "Check small-screen layout and keyboard state for guided responses."
      - "Confirm no harsh red full-screen state or punitive copy."
      - "Confirm Cormorant is not used for feedback labels or body copy."
      - "Confirm Unit 2 still opens and its first lesson content is unchanged."
    fallback_if_unavailable: "Report automated verification only and list every simulator item as unverified."

  regression_boundaries:
    must_not_change:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "bun.lock"
      - "Supabase migrations"
      - "Supabase Edge Functions"
      - "journeySlice reducers"
      - "Unit 2 exercise content"
      - "Journey map layout"
    allowed_files:
      - "src/data/mock/sleep-reset-flat.ts"
      - "src/data/mock/sleep-reset-flat.test.ts"
      - "src/components/node/NodeEngine.tsx"
      - "src/components/node/NodeEngine.test.tsx"
      - "src/components/node/exerciseFeedback.ts"
      - "src/components/node/exerciseFeedback.test.ts"
      - "src/components/ui/LessonScreen.tsx"
      - "src/components/exercise/MatchingExercise.tsx"
      - "src/components/exercise/MatchingExercise.test.tsx"
      - "src/domains/journey/analytics/useJourneyAnalytics.ts"
      - "src/domains/journey/analytics/useJourneyAnalytics.test.ts"
      - "app/tabs/screens/(journey)/journey-flow.tsx"

definition_of_done:
  global:
    - id: "D1"
      done_when: "All product-spec acceptance criteria AC1 through AC12 have file or test evidence."
    - id: "D2"
      done_when: "Automated gates V1 through V7 pass."
    - id: "D3"
      done_when: "Manual iOS checklist passes, or unverified items are explicitly reported."
    - id: "D4"
      done_when: "No analytics event contains personal response, mood, rating, note, prompt, or option text."
    - id: "D5"
      done_when: "No database, API, dependency, Unit 2, or journey-map change is present."
    - id: "D6"
      done_when: "No abandoned helper, dead experiment, unused import, debug log, or commented-out approach remains."
    - id: "D7"
      done_when: "Final graphify update completes after all edits."
  per_unit:
    U1:
      - "Feedback resolver handles all supported feedback locations and fallback."
      - "Resolver tests pass."
    U2:
      - "Wrong answer cannot advance."
      - "Retry and success paths pass tests."
      - "Feedback footer remains backward compatible."
    U3:
      - "Matching returns isCorrect true only when complete."
      - "Matching tests pass."
    U4:
      - "Unit 1 exactly matches approved lesson blueprints."
      - "Content contract tests and safety checks pass."
    U5:
      - "Four journey events use allowlisted properties only."
      - "Analytics tests pass."
    U6:
      - "Integrated automated and simulator checks are complete."
      - "Final diff contains only allowed files."

release_decision:
  ship_when:
    - "All automated gates pass."
    - "No safety wording failure remains."
    - "Incorrect answers cannot advance."
    - "Analytics privacy allowlist passes."
  do_not_ship_when:
    - "Any lesson infers exact stage or cause from clock time."
    - "Any scored exercise lacks corrective feedback."
    - "Matching reports false failure."
    - "Unit 2 content changes."
    - "Simulator is unavailable and a keyboard, footer, or navigation regression is suspected."
