<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
  /* Journeys tab, built to docs/design/journey-and-reward-spec.md.
     The reward is arriving: one quiet completion screen, then the path answers (node fills, the ring moves on).
     Keepsakes hold the user's own words; unit, section and course ends get one calm sheet, ≤1 full celebration per 7 days. */
  :root{
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-12:48px;
    --r-pill:999px;--tap:44px;
    --t-cap:13px;--t-sub:15px;--t-body:17px;--t-h3:18px;--t-h2:22px;--t-h1:28px;
    --ease:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.77,0,.175,1);--in:cubic-bezier(.55,0,1,.45);
    --font:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;--display:var(--font);
    --bg:#fff;--surface:#fff;--surface-2:#f7f7f7;--soft:#f8fbf6;
    --label:#142414;--label-2:#4b4b4b;--label-3:#6b6b6b;--sep:#e5e5e5;
    --accent:#44633f;--s100:#e5ede1;--s200:#d3e0cd;--s300:#abc0a2;--s400:#7e9874;--s500:#5f7f58;--s600:#44633f;--s700:#29452a;
    --low:0 2px 8px rgba(0,0,0,.05);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{font-size:17px}
  body{font-family:var(--font);background:var(--bg);color:var(--label);min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;line-height:1.35}
  #app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
  @media (min-width:600px){body{align-items:center;background:#d9d8d3}#app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;box-shadow:0 0 0 10px #142414}}
  button,a{font:inherit;color:inherit;cursor:pointer}
  a{text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .snap,.snap *{transition:none!important;animation:none!important}

  /* ===== header: courses, practice count, then the unit you are in ===== */
  header{position:absolute;inset:0 0 auto;z-index:3;padding:calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-4) var(--sp-3);
    background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(var(--sp-6)) saturate(1.4);backdrop-filter:blur(var(--sp-6)) saturate(1.4)}
  .top{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap)}
  .pillbtn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 var(--sp-3) 0 var(--sp-2);border:0;border-radius:var(--r-pill);background:none;color:var(--accent);font-size:var(--t-sub);font-weight:700}
  .pillbtn:active{background:var(--soft)}
  .count{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--sp-3);border-radius:var(--r-pill);background:var(--soft);color:var(--accent);font-size:var(--t-cap);font-weight:700}
  .count .rg{width:18px;height:18px;transform:rotate(-90deg)}
  .count .rg circle{fill:none;stroke-width:3.5}
  .count .rg .trk{stroke:var(--s100)}.count .rg .val{stroke:var(--accent);stroke-linecap:round}
  /* the unit banner: sage for every unit (one accent); identity is the title */
  .banner{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:76px;margin-top:var(--sp-1);margin-bottom:4px;padding:var(--sp-3) var(--sp-4);border:0;border-radius:16px;text-align:left;
    background:var(--s600);box-shadow:0 4px 0 var(--s700);color:#fff;transition:transform .12s var(--ease)}
  .banner:active{transform:translateY(3px);box-shadow:0 1px 0 var(--s700)}
  .bt{flex:1;min-width:0}
  .bt.swap{animation:fade .2s var(--ease)}
  .bt small{display:block;font-size:var(--t-cap);font-weight:700;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .bt .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--font);font-size:var(--t-h3);font-weight:700;line-height:1.33}
  .well{flex:none;align-self:stretch;margin:-12px -16px -12px 0;width:60px;display:grid;place-items:center;border-left:2px solid rgba(255,255,255,.25);color:#fff}

  /* ===== the path: nodes 120 pt apart, the callout sits on the current ring ===== */
  main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-top:var(--hh,160px)}
  main::-webkit-scrollbar{display:none}
  #path{position:relative}
  /* 88 pt hit target; the current node's reaches up over its callout */
  .node{position:absolute;width:88px;height:88px;padding:0;border:0;background:none;--f:#e5e5e5;--r:#d4d4d4;--c:#afafaf;--b1:#cfcfcf;--b2:#afafaf}
  .node .pk{position:absolute;left:8px;bottom:9px;width:72px;height:64px;overflow:visible;color:var(--c);transition:color .3s var(--ease),transform .12s var(--ease)}
  .node:active .pk{transform:scale(.97)}
  .pk .f{fill:var(--f);stroke:var(--f);transition:fill .3s var(--ease),stroke .3s var(--ease)}
  .pk .r{fill:var(--r);stroke:var(--r);transition:fill .3s var(--ease),stroke .3s var(--ease)}
  .pk .b1{fill:var(--b1)}.pk .b2{fill:var(--b2)}
  .pk .open{opacity:0;transition:opacity .2s var(--ease)}.pk .closed{transition:opacity .2s var(--ease)}
  .s-completed .pk .open{opacity:1}.s-completed .pk .closed{opacity:0}
  .s-current{--f:var(--s500);--r:var(--s600);--c:#fff;--b1:var(--s300);--b2:var(--s200)}
  .s-completed{--f:var(--s500);--r:var(--s600);--c:#fff;--b1:var(--s300);--b2:var(--s200)}
  .node.pop .pk{animation:pop .3s var(--ease)}
  @keyframes pop{40%{transform:scale(1.04)}}
  .node.jig .pk{transform-origin:50% 100%;animation:jig .6s var(--io)}
  @keyframes jig{25%{transform:translateX(-.7px) scale(1.015,.975)}50%{transform:none}75%{transform:translateX(.7px) scale(1.015,.975)}}
  .lockb{position:absolute;z-index:1;right:4px;bottom:52px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--label-3);box-shadow:var(--low)}
  /* ring and callout around the current node: static, one pulse per arrival */
  .ring{position:absolute;width:96px;height:96px;pointer-events:none}
  .ring circle{fill:none;stroke:var(--s300);stroke-width:6}
  .tip{position:absolute;z-index:2;height:32px;padding:0 14px;display:flex;align-items:center;border:2px solid var(--sep);border-radius:var(--r-pill);background:#fff;box-shadow:0 2px 0 var(--sep);
    font-size:var(--t-body);font-weight:700;color:var(--accent);transform:translateX(-50%);pointer-events:none;white-space:nowrap}
  .tip::before{content:"";position:absolute;left:calc(50% - 10px);top:100%;border:10px solid transparent;border-top-color:var(--sep);border-bottom:0}
  .tip::after{content:"";position:absolute;left:calc(50% - 7px);top:100%;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
  .ring.arrive{animation:ringin .25s var(--ease) both}
  .tip.arrive{animation:tipin .25s .12s var(--ease) both}
  @keyframes ringin{from{opacity:0;transform:scale(.94)}}
  @keyframes tipin{from{opacity:0;transform:translate(-50%,6px)}}
  .ring.leave{animation:ringout .15s var(--in) forwards}.tip.leave{animation:out .15s var(--in) forwards}
  @keyframes ringout{to{opacity:0;transform:scale(.97)}}@keyframes out{to{opacity:0}}
  .divider{position:absolute;left:var(--sp-5);right:var(--sp-5);height:20px;display:flex;align-items:center;gap:var(--sp-3)}
  .divider i{flex:1;height:1px;background:var(--sep)}
  .divider span{max-width:75%;font-size:var(--t-cap);font-weight:600;color:var(--label-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seccard{position:absolute;left:var(--sp-5);right:var(--sp-5);height:96px;padding:var(--sp-4);border-radius:16px;background:var(--s600);color:#fff}
  .seccard small{display:block;font-size:var(--t-cap);font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.04em}
  .seccard b{display:block;font-size:var(--t-h3);font-weight:700;line-height:1.33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seccard span{display:block;font-size:var(--t-cap);font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Happi beside the path: no bubble, nothing to tap; looks at where you are */
  .mas{position:absolute;width:108px;aspect-ratio:220/246;pointer-events:none}

  /* back to where you are */
  .fab{position:absolute;right:var(--sp-5);bottom:calc(var(--tb,64px) + 16px);z-index:3;width:52px;height:52px;display:grid;place-items:center;border:2px solid var(--sep);border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--sep);color:var(--accent)}
  .fab:active{transform:translateY(3px);box-shadow:none}
  .toast.out{animation:unfade .15s var(--in) forwards}
  .toast{position:absolute;left:var(--sp-4);right:var(--sp-4);top:calc(var(--hh,160px) + var(--sp-2));z-index:4;padding:var(--sp-3) var(--sp-4);border-radius:16px;background:var(--s100);font-size:var(--t-sub);font-weight:700;text-align:center;animation:fade .15s}

  /* ===== empty course ===== */
  .empty{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-8) var(--sp-5);text-align:center}
  .empty .hp{width:150px;aspect-ratio:220/246}
  .empty h2{font-size:var(--t-h2);font-weight:700}
  .empty p{font-size:var(--t-sub);font-weight:500;color:var(--label-2)}

  /* ===== sheets ===== */
  .scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.4);animation:fade .2s}
  .scrim.out{animation:unfade .15s var(--in) forwards}
  @keyframes fade{from{opacity:0}}@keyframes unfade{to{opacity:0}}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;overflow-y:auto;padding:var(--sp-6) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom));background:var(--bg);border-radius:24px 24px 0 0;animation:up .3s var(--ease)}
  .sheet.out{animation:down .22s var(--in) forwards}
  @keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
  .sheet h2{font-size:var(--t-h2);font-weight:700;line-height:1.27;padding-right:var(--tap)}
  .sheet .x{position:absolute;top:var(--sp-3);right:var(--sp-3);width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface-2);color:var(--label-2)}
  .sub{margin-top:var(--sp-1);font-size:var(--t-sub);font-weight:500;color:var(--label-3)}
  .acts{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-6)}
  .btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);width:100%;min-height:52px;padding:0 var(--sp-4);border:0;border-radius:var(--r-pill);
    background:var(--s500);color:#fff;box-shadow:0 4px 0 var(--s700);margin-bottom:4px;font-size:var(--t-body);font-weight:700;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
  .btn:active{transform:scale(.97)}
  .btn.alt{background:var(--surface);color:var(--label);border:2px solid var(--sep);box-shadow:0 4px 0 var(--sep)}
  .link{align-self:center;min-height:var(--tap);padding:0 var(--sp-4);border:0;background:none;font-size:var(--t-sub);font-weight:600;color:var(--label-3)}
  .cards{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-4)}
  .pick{display:block;width:100%;padding:var(--sp-4);text-align:left;border:2px solid var(--sep);border-radius:20px;background:var(--surface);box-shadow:0 3px 0 var(--sep);transition:transform .12s var(--ease)}
  .pick:active{transform:scale(.98)}
  .pick.on{border-color:var(--s500);box-shadow:0 3px 0 var(--s500);background:var(--soft)}
  .pick .h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
  .pick b{font-size:var(--t-body);font-weight:700;line-height:1.3}
  .pick small{display:block;margin-top:2px;font-size:var(--t-cap);font-weight:600;color:var(--label-3)}
  .pick .cur{flex:none;padding:2px var(--sp-2);border-radius:var(--r-pill);background:var(--s500);color:#fff;font-size:var(--t-cap);font-weight:700}
  .bar{height:8px;margin-top:var(--sp-3);border-radius:var(--r-pill);background:var(--sep);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
  .pick .go{display:block;margin-top:var(--sp-2);font-size:var(--t-cap);font-weight:700;color:var(--accent)}
  .get{list-style:none;padding:0;margin:var(--sp-4) 0 0;display:flex;flex-direction:column;gap:var(--sp-3)}
  .get li{display:flex;gap:var(--sp-3);align-items:flex-start;font-weight:600}
  .get li::before{content:"";flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--s500)}

  /* shared beat: rise 8 pt + fade, ease-out; delays come from the spec's beat sheets */
  @keyframes rise{from{opacity:0;transform:translateY(var(--rise,8px))}}
  @keyframes appear{from{opacity:0;transform:scale(var(--from,.96))}}
  .skip :not(.rays,.cloud,.star,.float,.spk){animation:none!important}
  @media (prefers-reduced-motion:no-preference){.skip .spk{animation:twinkle 2.4s ease-in-out infinite!important}.skip .rays{animation:spin 60s linear infinite!important}}

  /* ===== reward screens: staged, not laid out (docs/research/reward-screens-craft.md) =====
     Split palette: sage is the only colour for controls; illustration gets warm art tones (cream, honey, sky, blush).
     Escalation: lesson = day sky, keepsake = warm paper, unit = day + rays, section = dusk, course = night. */
  .scene{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .scene .sky{position:absolute;inset:0;width:100%;height:100%;animation:skyin .45s var(--ease) both}
  @keyframes skyin{from{opacity:0;transform:scale(1.04)}}
  .scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:120px}
  .scene .hills path{animation:rise .5s var(--ease) both;--rise:24px}
  .scene .hills .h2{animation-delay:.06s}.scene .hills .h3{animation-delay:.12s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scene .cloud{animation:drift 9s ease-in-out infinite alternate}.scene .cloud.c2{animation-duration:12s;animation-direction:alternate-reverse}
  @keyframes drift{to{transform:translateX(14px)}}
  .scene .star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
  .spk{position:absolute;width:var(--s,16px);height:var(--s,16px);color:var(--c,#fff);pointer-events:none;animation:sparkin .35s var(--d,.35s) var(--ease) both,twinkle 2.4s calc(var(--d,.35s) + .35s) ease-in-out infinite}
  @keyframes sparkin{from{opacity:0;transform:scale(0) rotate(-40deg)}60%{transform:scale(1.25)}}
  .ttl,.sheet h2.ttl{font-family:var(--display);font-weight:600;font-size:var(--t-h1);line-height:1.18;letter-spacing:-.01em}
  /* Happi drops onto the ground: fall, squash on landing, settle */
  @keyframes drop{0%{opacity:0;transform:translateY(-36px)}55%{opacity:1;transform:translateY(0) scale(1.04,.94)}75%{transform:translateY(-4px) scale(.98,1.02)}100%{transform:none}}

  /* ===== lesson completion (§4): Happi on a hill, your words on paper, what you put in ===== */
  .done{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;background:#fff;text-align:center;overflow-y:auto;animation:enter .28s var(--ease)}
  @keyframes enter{from{opacity:0;transform:translateY(24px)}}
  .done.leave{animation:out .15s var(--in) forwards}
  .dstage{position:relative;flex:1 0 auto;min-height:320px;padding-top:env(safe-area-inset-top)}
  .bub{position:absolute;z-index:1;left:0;right:0;bottom:calc(32px + min(56%,280px));width:fit-content;max-width:min(300px,calc(100% - 40px));margin-inline:auto;padding:var(--sp-3) var(--sp-4);border-radius:20px;background:#fff;box-shadow:0 4px 0 rgba(20,36,20,.06);
    font-size:var(--t-body);font-weight:600;line-height:1.3;text-wrap:balance;animation:bubin .3s .5s var(--ease) both}
  .bub::after{content:"";position:absolute;left:calc(50% - 9px);top:100%;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
  @keyframes bubin{from{opacity:0;transform:translateY(8px) scale(.94)}}
  .dstage .hp{position:absolute;left:0;right:0;margin-inline:auto;bottom:28px;height:min(56%,280px);aspect-ratio:220/246;transform-origin:50% 100%;animation:drop .55s .15s var(--ease) both}
  .dbody{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;margin-top:-24px;padding:var(--sp-6) var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff;animation:rise .4s .25s var(--ease) both;--rise:40px}
  .done h2{animation:rise .3s .45s var(--ease) both}
    /* the user's words: a taped note */
  .paper{position:relative;width:100%;margin-top:var(--sp-6);padding:var(--sp-5) var(--sp-4) var(--sp-3);border:1px solid #efe5d2;border-radius:6px;text-align:left;
    background:#fffdf7;box-shadow:0 8px 18px rgba(90,70,30,.08);
    transform:rotate(-1.2deg);animation:paperin .45s .58s var(--ease) both}
  @keyframes paperin{from{opacity:0;transform:translateY(16px) rotate(-5deg)}}
  .paper::before{content:"";position:absolute;left:calc(50% - 38px);top:-11px;width:76px;height:22px;border-radius:3px;background:rgba(246,196,83,.6);transform:rotate(-3deg)}
  .paper blockquote{font-size:var(--t-h3);font-weight:600;line-height:1.4;quotes:"‘" "’"}
  .paper blockquote::before{content:open-quote}.paper blockquote::after{content:close-quote}
  .paper figcaption{margin-top:var(--sp-1);font-size:var(--t-cap);font-weight:600;color:var(--label-3)}
  /* where you are: one status, not three tiles (one accent, one number) */
  .prog{width:100%;margin-top:var(--sp-6);animation:fade .25s .7s var(--ease) both}
  .prog .seg{display:flex;gap:6px}
  .prog .seg i{flex:1;height:8px;border-radius:var(--r-pill);background:var(--s100)}
  .prog .seg i.d{background:var(--s500)}
  .prog .seg i.now{background:var(--s500);transform-origin:left;animation:fill .4s .8s var(--ease) both}
  @keyframes fill{from{transform:scaleX(0)}}
  .done .line{display:block;margin-top:var(--sp-2);font-size:var(--t-sub);font-weight:600;color:var(--label-3)}
  .done .go{margin-top:auto;padding-top:var(--sp-8);width:100%}
  .done .btn{animation:fade .2s .9s var(--ease) both}

  /* ===== keepsake (§5): a warm paper sheet, the tin opens, your notes come out taped ===== */
  .sheet.kp{max-height:94%;padding-top:0;text-align:center;background:#fbf5e9;border-radius:24px 24px 0 0}
  .kstage{position:relative;height:236px;margin:0 calc(-1 * var(--sp-4));overflow:hidden;border-radius:24px 24px 0 0}
  .tin2{position:absolute;left:calc(50% - 88px);bottom:10px;width:176px;height:165px;overflow:visible}
  .tin2 .box{transform-box:view-box;transform-origin:80px 132px;animation:shake .42s var(--io) both}
  @keyframes shake{20%{transform:rotate(-3deg)}45%{transform:rotate(3deg)}70%{transform:rotate(-1.5deg)}}
  .tin2 .lid{transform-box:view-box;transform-origin:16px 60px;transform:translate(-4px,-10px) rotate(-26deg);animation:lidpop .45s .42s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes lidpop{from{transform:translateY(-6px)}}
  .tin2 .slip{animation:rise .45s var(--ease) both;--rise:34px}.tin2 .s1{animation-delay:.56s}.tin2 .s2{animation-delay:.64s}
  .kstage .hp{position:absolute;left:calc(50% + 62px);bottom:6px;width:86px;aspect-ratio:220/246;animation:rise .4s .7s var(--ease) both;--rise:14px}
  .kp h2{padding:0;margin-top:var(--sp-4);animation:rise .3s .6s var(--ease) both}
  .kp .sub{animation:fade .25s .66s var(--ease) both}
  .notes{list-style:none;padding:0;margin:var(--sp-5) 0 0;display:flex;flex-direction:column;gap:var(--sp-3);text-align:left}
  .notes li{position:relative;padding:var(--sp-3) var(--sp-4);border:1px solid #efe5d2;border-radius:6px;background:#fffdf7;box-shadow:0 6px 14px rgba(90,70,30,.07);
    transform:rotate(var(--r,-1deg));animation:deal .4s var(--ease) both}
  .notes li:nth-child(2){--r:1deg}.notes li:nth-child(3){--r:-.6deg}
  @keyframes deal{from{opacity:0;transform:translateY(22px) rotate(0)}}
  .notes li::before{content:"";position:absolute;left:var(--sp-4);top:-9px;width:48px;height:18px;border-radius:3px;background:var(--tape,rgba(246,196,83,.6));transform:rotate(-4deg)}

  /* ===== unit, section, course (§6): a full-screen scene, the medal above Happi ===== */
  .sheet.ms{top:0;max-height:none;padding:0;border-radius:0;display:flex;flex-direction:column;text-align:center;animation:enter .32s var(--ease)}

  .badge{position:absolute;left:calc(50% - 78px);bottom:179px;width:156px;height:156px;overflow:visible;animation:medal .6s .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes medal{from{opacity:0;transform:translateY(-40px) scale(.6) rotate(-12deg)}}
  .badge .float{animation:bob 3.2s 1s ease-in-out infinite}
  .halo{position:absolute;left:calc(50% - 78px);bottom:179px;width:156px;height:156px;overflow:visible}

  @keyframes bob{50%{transform:translateY(-5px)}}
  .badge .shine{transform:translateX(150px);animation:shine .7s 1s var(--ease) both}

  .badge .tails{animation:rise .3s .55s var(--ease) both;--rise:-10px}
  .badge .leaf{transform-box:fill-box;transform-origin:center;animation:appear .2s var(--ease) both;--from:.4}
  .hero{position:absolute;left:0;right:0;bottom:120px;height:300px;pointer-events:none}
  .mstage .hp{position:absolute;left:calc(50% - 64px);bottom:28px;width:128px;aspect-ratio:220/246;transform-origin:50% 100%;animation:drop .55s .2s var(--ease) both}
  .mbody{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;margin-top:-24px;padding:var(--sp-6) var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff;animation:rise .4s .25s var(--ease) both;--rise:40px}
  .ms small.eb{display:block;font-size:var(--t-cap);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);animation:rise .25s .6s var(--ease) both}
  .ms h2{padding:0;margin-top:2px;animation:rise .3s .62s var(--ease) both}
  .ms .line{margin-top:var(--sp-1);font-size:var(--t-sub);font-weight:500;color:var(--label-3);animation:fade .25s .76s var(--ease) both}
  .did{list-style:none;padding:0;margin:var(--sp-5) 0 0;display:flex;flex-direction:column;gap:var(--sp-2);text-align:left}
  .did li{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-2);border:2px solid var(--sep);border-radius:16px;font-weight:700;animation:rise .25s var(--ease) both;--rise:8px}
  .did li i{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--s100);color:var(--s500)}
  .did li em{flex:1;min-width:0;font-style:normal}
  .did li span{flex:none;padding:3px 10px;border-radius:var(--r-pill);background:var(--s100);color:var(--s700);font-size:var(--t-cap);font-weight:700}
  .ms .acts{padding-top:var(--sp-2)}
  @media (max-height:700px){.mstage{min-height:290px}.hero{bottom:100px;height:240px}.badge,.halo{width:120px;height:120px;left:calc(50% - 60px);bottom:148px}.mstage .hp{width:100px;left:calc(50% - 50px)}
    .dstage{min-height:260px}.done .go{padding-top:var(--sp-5)}}

  /* course complete: the next journey, docked over the path */
  .dock{position:absolute;left:var(--sp-4);right:var(--sp-4);bottom:calc(84px + env(safe-area-inset-bottom));z-index:3;overflow:hidden;border:2px solid var(--sep);border-radius:24px;background:var(--surface);box-shadow:var(--low);animation:rise .3s var(--ease);--rise:16px}
  .dock .a{padding:var(--sp-4) var(--sp-5) var(--sp-3)}
  .dock .b{padding:var(--sp-3) var(--sp-5) var(--sp-4);background:var(--soft)}
  .dock small{display:block;font-size:var(--t-cap);font-weight:700;color:var(--accent)}
  .dock b{display:block;font-size:var(--t-h3);font-weight:700;line-height:1.33}
  .dock p{margin-top:2px;font-size:var(--t-sub);font-weight:500;color:var(--label-2)}
  .dock .btn{margin-top:var(--sp-3);min-height:50px}
  .dock .x{position:absolute;top:var(--sp-2);right:var(--sp-2);width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--label-3)}

  /* ===== tab bar: Journeys is current ===== */
  nav.tabs{display:flex;padding:var(--sp-2) var(--sp-1) calc(var(--sp-2) + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);border-top:1px solid var(--sep);
    -webkit-backdrop-filter:blur(var(--sp-6)) saturate(1.4);backdrop-filter:blur(var(--sp-6)) saturate(1.4)}
  nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tap);padding:var(--sp-1) 0;font-size:var(--t-cap);font-weight:600;color:var(--label-3)}
  nav.tabs a[aria-current]{color:var(--accent)}
  nav.tabs svg{width:26px;height:26px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
    .done,#sheet:not(.out),.scrim:not(.out),.toast:not(.out){animation:fade .15s ease-out!important}.toast.out{animation:unfade .15s forwards!important}}

<script>
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const RM=matchMedia('(prefers-reduced-motion: reduce)');let STILL=RM.matches;RM.addEventListener?.('change',e=>STILL=e.matches);
const Q=new URLSearchParams(location.search);
if(Q.has('new'))try{localStorage.removeItem('happy.journeys')}catch{}
// haptics (spec §9): selection on node press; Soft for completions (the path payoff skips it within 2 s of another); Success only for the week's celebration
let lastHaptic=0;
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
const select=()=>vib(5);
const soft=()=>{lastHaptic=Date.now();vib(10)};
const success=()=>{lastHaptic=Date.now();vib([12,60,12])};
const spaced=f=>{const w=1000-(Date.now()-lastHaptic);w>0?setTimeout(f,w):f()}; // ≥1000 ms between haptics (§9)

const IC=(d,s=24,sw=2.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const P={
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  layers:'<path d="M12 4l9 5-9 5-9-5Z"/><path d="M3 14l9 5 9-5"/>',
  up:'<path d="M6 14l6-6 6 6"/>',down:'<path d="M6 10l6 6 6-6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
};

// ===== art: the same geometry as assets/journey/tools/gen-journey-svgs.js, coloured by CSS state =====
const G={ // 24-unit glyphs, currentColor
  sprout:'<path d="M12 21V12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M12 14C6.5 14 4 10.5 4 6c5 0 8 3 8 8z" fill="currentColor"/><path d="M12 11.5C12 6.5 15 3.5 20 3.5c0 5-3 8-8 8z" fill="currentColor"/>',
  loop:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></g>',
  flag:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4.5c4-2.5 7 2.5 14 0V14c-7 2.5-10-2.5-14 0" fill="currentColor"/></g>',
  star:'<path d="M12 2.8l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 16.1l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
};
const glyph=(g,cx=36,cy=29,s=1.35)=>`<g transform="translate(${cx-12*s} ${cy-12*s}) scale(${s})">${G[g]}</g>`;
const SHAPE={
  ellipse:(c,dy=0)=>`<ellipse class="${c}" cx="36" cy="${29+dy}" rx="35" ry="28" stroke-width="0"/>`,
  hexagon:(c,dy=0)=>`<path class="${c}" d="M36 ${4+dy}L64 ${17+dy}V${41+dy}L36 ${54+dy}L8 ${41+dy}V${17+dy}Z" stroke-width="7" stroke-linejoin="round"/>`,
  rosette:(c,dy=0)=>`<circle class="${c}" cx="36" cy="${29+dy}" r="24" stroke-width="0"/>`+Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<circle class="${c}" cx="${(36+22*Math.cos(a)).toFixed(2)}" cy="${(29+dy+22*Math.sin(a)).toFixed(2)}" r="7" stroke-width="0"/>`}).join(''),
};
const TIN_BODY='<rect class="r" x="11" y="30" width="50" height="28" rx="7" stroke-width="0"/><rect class="f" x="11" y="24" width="50" height="28" rx="7" stroke-width="0"/><rect class="b1" x="32" y="24" width="8" height="28"/>';
const TIN_LID=y=>`<rect class="r" x="7" y="${y+2}" width="58" height="14" rx="6" stroke-width="0"/><rect class="f" x="7" y="${y}" width="58" height="14" rx="6" stroke-width="0"/><rect class="b2" x="32" y="${y}" width="8" height="14"/>`;
const NOTE='<rect x="22" y="10" width="28" height="24" rx="3" fill="#fff" stroke="#d3e0cd" stroke-width="2"/><path d="M28 17h16M28 22h16M28 27h10" stroke="#abc0a2" stroke-width="2.4" stroke-linecap="round"/>';
const TIN_IN='<rect class="r" x="15" y="22" width="42" height="9" rx="3" stroke-width="0"/>';
const TIN=`<g class="closed">${TIN_BODY}${TIN_LID(14)}</g><g class="open"><g transform="translate(0 -9) rotate(-8 36 16)">${TIN_LID(14)}</g>${TIN_IN}<g transform="rotate(-6 36 30)">${NOTE}</g>${TIN_BODY}</g>`;
const NODE_ART={exercise:['ellipse','sprout'],practice:['ellipse','loop'],checkpoint:['hexagon','flag'],milestone:['rosette','star']};
const art=t=>`<svg class="pk" viewBox="0 0 72 64" aria-hidden="true">${t==='keepsake'?TIN:SHAPE[NODE_ART[t][0]]('r',6)+SHAPE[NODE_ART[t][0]]('f')+glyph(NODE_ART[t][1])}</svg>`;
// ===== reward art. Split palette: sage stays the only control colour; illustration also gets warm art tones =====
const S={50:'#f8fbf6',100:'#e5ede1',200:'#d3e0cd',300:'#abc0a2',400:'#7e9874',500:'#5f7f58',600:'#44633f',700:'#29452a'},LEAF='#A8C392';
const A={honey:'#F6C453',deep:'#D9A23A',gold:'#FFE7A6',paper:'#FFFDF7',edge:'#EFE5D2',blush:'#F4C9BE',sky:'#BFDCE5'};
const star4=(x,y,s,f)=>{const a=s*.18;return `<path d="M${x} ${y-s}Q${x+a} ${y-a} ${x+s} ${y}Q${x+a} ${y+a} ${x} ${y+s}Q${x-a} ${y+a} ${x-s} ${y}Q${x-a} ${y-a} ${x} ${y-s}Z" fill="${f}"/>`};
// sparkles over a stage: [left %, top %, size px, colour, delay s]
const sparks=list=>list.map(([x,y,s,c,d])=>`<svg class="spk" viewBox="-10 -10 20 20" style="left:${x}%;top:${y}%;--s:${s}px;--c:${c};--d:${d}s" aria-hidden="true">${star4(0,0,10,'currentColor')}</svg>`).join('');
// a stage behind the hero: sky (slice-scaled) + hills (stretched, fixed height) so Happi always stands on the mound
const SKY={day:['#D3E8E2','#F4F9F1'],dusk:['#F3C6AE','#FCEBDB'],night:['#1D352D','#3A5847'],paper:['#F7E6C4','#FBF5E9']};
const HILLS={day:[S[200],S[300],S[400]],dusk:['#E6CBB2',S[300],S[400]],night:['#2E4B3E',S[600],S[500]]};
let sid=0;
function scene(kind,{glow=true,cy=40,under=''}={}){
  const k=++sid,[a,b]=SKY[kind],night=kind==='night',sy=cy*3.2;
  const extra=night?Array.from({length:22},(_,i)=>{const x=(Math.sin(i*91.7)*.5+.5)*390,y=(Math.sin(i*37.3)*.5+.5)*230,r=1+(i%3)*.7;return `<circle class="star" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r}" fill="#FFF3C7" style="animation-delay:${(i%7)*.37}s"/>`}).join('')+`<path d="M62 54a22 22 0 1 0 22 30 18 18 0 1 1-22-30Z" fill="#FFF3C7"/>`
    :kind==='paper'?'':`<g class="cloud"><ellipse cx="64" cy="70" rx="34" ry="13" fill="#fff" fill-opacity=".85"/><ellipse cx="82" cy="60" rx="20" ry="14" fill="#fff" fill-opacity=".85"/></g><g class="cloud c2"><ellipse cx="322" cy="104" rx="30" ry="11" fill="#fff" fill-opacity=".75"/><ellipse cx="308" cy="96" rx="16" ry="11" fill="#fff" fill-opacity=".75"/></g>`;
  const hills=HILLS[kind]?(([h1,h2,h3])=>`<svg class="hills" viewBox="0 0 390 120" preserveAspectRatio="none">
    <path class="h1" d="M0 50C70 18 140 28 200 46S330 28 390 38V120H0Z" fill="${h1}"/>
    <path class="h2" d="M0 74C60 54 120 58 170 68S320 52 390 64V120H0Z" fill="${h2}"/>
    <path class="h3" d="M0 98C80 86 140 76 195 76S310 86 390 98V120H0Z" fill="${h3}"/></svg>`)(HILLS[kind]):'';
  return `<div class="scene" aria-hidden="true"><svg class="sky" viewBox="0 0 390 320" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sk${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
    <radialGradient id="gl${k}"><stop offset="0" stop-color="${night?'#FFF3C7':'#FFF6D8'}" stop-opacity="${night?.25:.95}"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></radialGradient></defs>
    <rect width="390" height="320" fill="url(#sk${k})"/>${glow?`<circle cx="195" cy="${sy}" r="130" fill="url(#gl${k})"/>`:''}${extra}</svg>${under}${hills}</div>`;
}
// medals: honey gold with a rim, an inner highlight and one shine sweep; sage ribbon and laurels
const rosetteBig=(f,cx,cy,r,sc)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`+Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;return `<circle cx="${(cx+(r-2)*Math.cos(a)).toFixed(2)}" cy="${(cy+(r-2)*Math.sin(a)).toFixed(2)}" r="${sc}" fill="${f}"/>`}).join('');
const tails=(a,b)=>`<g class="tails"><path d="M72 112L56 184l20-11 11 19 13-70z" fill="${a}"/><path d="M128 112l16 72-20-11-11 19-13-70z" fill="${b}"/><path d="M78 118l-11 50M122 118l11 50" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/></g>`;
const laurel=(side,cy)=>{const pt=(deg,r=72)=>{const th=deg*Math.PI/180,lx=100+r*Math.cos(th);return [side<0?lx:200-lx,cy+r*Math.sin(th)]};
  const [sx,sy]=pt(128),[ex,ey]=pt(212);
  return `<path d="M${sx.toFixed(1)} ${sy.toFixed(1)}A72 72 0 0 ${side<0?1:0} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${S[500]}" stroke-width="3" stroke-linecap="round" fill="none"/>`+
    [0,1,2,3,4].map(i=>{const deg=136+i*18,[x,y]=pt(deg,77);return `<g class="leaf" style="animation-delay:${(.7+i*.05).toFixed(2)}s"><ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="6" ry="12" fill="${i%2?LEAF:S[400]}" transform="rotate(${side<0?deg:-deg} ${x.toFixed(1)} ${y.toFixed(1)})"/></g>`}).join('')};
const gold=(id,r,cy=88)=>`${rosetteBig(A.deep,100,cy+6,r,10)}${rosetteBig(A.honey,100,cy,r,10)}<circle cx="100" cy="${cy}" r="${r-12}" fill="${A.deep}"/><circle cx="100" cy="${cy}" r="${r-15}" fill="${A.gold}"/>`;
const shine=(id,r,cy=88)=>`<path d="M${100-r+20} ${cy-14}A${r-16} ${r-16} 0 0 1 ${100+6} ${cy-r+16}" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" fill="none"/>
  <defs><clipPath id="${id}"><circle cx="100" cy="${cy}" r="${r+8}"/></clipPath></defs><g clip-path="url(#${id})"><g transform="rotate(20 100 ${cy})"><rect class="shine" x="40" y="${cy-90}" width="20" height="180" fill="#fff" fill-opacity=".55"/></g></g>`;
// rays and glow live in the medal's own coordinates, so they always come from its centre
const medalLight=(level,full)=>{const c=level==='course'?'#FFF3C7':level==='unit'?'#fff':A.honey,o=level==='course'?.08:level==='unit'?.2:.16;
  return `<defs><radialGradient id="mgl"><stop offset="0" stop-color="#FFF6D8" stop-opacity="${level==='course'?.35:.95}"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></radialGradient></defs>`+
  (full?`<g class="rays">${Array.from({length:12},(_,i)=>{const t=i*Math.PI/6,d=.13,p=a=>`${(100+420*Math.cos(t+a)).toFixed(1)} ${(88+420*Math.sin(t+a)).toFixed(1)}`;return `<path d="M100 88L${p(d)}L${p(-d)}Z" fill="${c}" fill-opacity="${o}"/>`}).join('')}</g>`:'')+
  `<circle cx="100" cy="88" r="120" fill="url(#mgl)"/>`};

// ===== a timeline of beats: one clock, interruptible (the first tap jumps every beat to its end) =====
let TL=null;
function timeline(beats){
  if(TL)TL.skip();
  const ids=[],left=new Set(beats.map((_,k)=>k));
  const run=k=>{if(!left.delete(k))return;beats[k][1]()};
  // skip jumps every beat to its end state: one-shot classes are stripped so nothing replays once .snap lifts
  const t={skip(){ids.forEach(clearTimeout);$('#app').classList.add('snap');[...left].sort((a,b)=>a-b).forEach(run);
      $$('#path .pop,#path .arrive,#path .jig').forEach(e=>e.classList.remove('pop','arrive','jig'));
      requestAnimationFrame(()=>$('#app').classList.remove('snap'));if(TL===t)TL=null},
    cancel(){ids.forEach(clearTimeout);left.clear();if(TL===t)TL=null}};
  TL=t;
  if(STILL){t.skip();$('#path').animate?.([{opacity:.5},{opacity:1}],{duration:200,easing:'ease-out'});return t}
  beats.forEach(([ms],k)=>ids.push(setTimeout(()=>{run(k);if(!left.size&&TL===t)TL=null},ms)));
  return t;
}
let byScroll=false;
const skipPath=()=>TL&&TL.skip();
['wheel','touchmove'].forEach(e=>$('#main').addEventListener(e,()=>{stok++;byScroll=true;skipPath();byScroll=false},{passive:true}));
// any tap or key anywhere ends the payoff first (a sheet it owes then opens under the scrim, before the tap lands)
['pointerdown','keydown'].forEach(e=>document.addEventListener(e,skipPath,{capture:true,passive:true}));

// node state changes on the live path (no re-render, so Happi never jumps)
function setState(i,s){const el=$(`.node[data-i="${i}"]`),n=LAY.nodes[i];if(!el)return;
  el.className=`node t-${n.type} s-${s}`;const b=box(n,s);el.style.top=b.top+'px';el.style.height=b.h+'px';el.setAttribute('aria-label',label(n,s))}
const replay=(el,c)=>{el.classList.remove(c);void el.getBoundingClientRect();el.classList.add(c)};
function leaveIndicator(){const now=STILL||$('#app').classList.contains('snap');$$('#path .ring,#path .tip').forEach(e=>{if(now)return e.remove();e.classList.add('leave');setTimeout(()=>e.remove(),150)})}
const follow=i=>{const a=document.activeElement;if(!a||a===document.body||a.matches('.node'))$(`.node[data-i="${i}"]`)?.focus({preventScroll:true})};
function arrive(i){const n=LAY.nodes[i];follow(i);$('#path').insertAdjacentHTML('beforeend',ringHTML(n)+tipHTML(n));$$('#path .ring,#path .tip').forEach(e=>!e.classList.contains('leave')&&e.classList.add('arrive'))}
function jiggle(i){const n=LAY.nodes[i],el=$(`.node[data-i="${i}"]`);if(n?.type!=='keepsake'||ST.jig[i+ST.course]||!el?.classList.contains('s-current'))return;ST.jig[i+ST.course]=1;save();replay(el,'jig')}

// beats 4b–8 of §4.3, from node a to node b, starting at t0 (450 on the normal path)
function advance(a,b,t0){
  const n=LAY.nodes[b];if(!n)return [];
  const ms=n.type==='milestone',out=[];
  out.push([t0,()=>{if(!byScroll&&n.y+HH()-$('#main').scrollTop>$('#main').clientHeight*.8)scrollToY(offsetFor(n),$('#app').classList.contains('snap')?0:300)}]);
  out.push([t0+200,()=>{setState(b,ms?'completed':'current');gaze(b);if(!ms){const el=$(`.node[data-i="${b}"]`);el&&replay(el,'pop')}}]);
  if(ms)out.push([t0+500,()=>{follow(b);milestoneSheet(b)}]);
  else{out.push([t0+320,()=>arrive(b)]);out.push([t0+720,()=>jiggle(b)])}
  return out;
}
// §4.3: the finished node completes, then the indicator travels on
function payoff(i,kept){
  const beats=kept?[[0,()=>setState(i,'completed')],[200,leaveIndicator]]
    :[[120,()=>{setState(i,'completed');const el=$(`.node[data-i="${i}"]`);el&&replay(el,'pop')}],[420,()=>{if(Date.now()-lastHaptic>=2000)soft();leaveIndicator()}]];
  timeline([...beats,...advance(i,i+1,kept?230:450)]);
}

// ===== §4: lesson completion. One screen, the user's words, one button =====
const words=n=>['no times','once','twice','three times','four times','five times'][n]||`${n} times`;
const timeNow=()=>new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
// Happi's headline varies by what you did (Duolingo's variety, CBT tone: effort, never a score)
const TITLES={exercise:['First step, taken.','That took courage.','You tried something new.'],practice:['Another rep, done.','It’s getting familiar.','Steady practice.'],checkpoint:['Look how far you’ve come.']};
const titleFor=n=>{const t=TITLES[n.type]||TITLES.exercise;return t[n.gi%t.length]};
function complete(i){
  const c=cur();if(i!==doneOf(c))return closeSheet();
  ST.done[c.id]=i+1;settle(c);save();
  clearTimeout(ct);$('#sheet').hidden=$('#scrim').hidden=true;$('#sheet').className='sheet';from=null;
  render(i);scrollToY(offsetFor(LAY.nodes[i]),0); // the path reopens with the finished node at 42% (§1.6)
  const n=LAY.nodes[i],u=unitOf(n),steps=LAY.nodes.filter(x=>x.ui===n.ui&&x.type!=='milestone'),k=steps.indexOf(n);
  // once per 7 days of use, Happi's line points outward (03 F15); otherwise the save line
  const out=Date.now()-(ST.out||0)>WEEK;if(out){ST.out=Date.now();save()}
  const el=document.createElement('div');el.className='done';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','dn-t');
  el.innerHTML=`<div class="dstage">${scene('day')}${sparks([[16,30,14,'#fff',.4],[80,22,18,A.honey,.48],[24,60,10,A.honey,.56],[78,58,12,'#fff',.62]])}
      ${out?'<p class="bub">Is there someone you could tell?</p>':''}<div class="hp" data-pose="${out?'proud':'neutral'}" aria-hidden="true"></div></div>
    <div class="dbody"><h2 class="ttl" id="dn-t" tabindex="-1">${esc(titleFor(n))}</h2>
    <figure class="paper"><blockquote>${esc(n.q)}</blockquote><figcaption>Saved today, ${timeNow()}</figcaption></figure>
    <div class="prog where" role="img" aria-label="Step ${k+1} of ${steps.length} in ${esc(u.title)}"><span class="seg" aria-hidden="true">${steps.map((x,j)=>`<i class="${j<k?'d':j===k?'now':''}"></i>`).join('')}</span><small class="line" aria-hidden="true">Step ${k+1} of ${steps.length} · ${esc(u.title)}</small></div>
    <div class="go"><button class="btn" id="dn-go" aria-disabled="true">Continue</button></div></div>`;
  $('#app').append(el);inert(true);hp();$('#dn-t').focus();
  // the button is live once it is fully visible (950 ms) or after a skip; a stray first tap never navigates
  let ready=false,felt=false;const feel=()=>{if(!felt){felt=true;spaced(soft)}};const tm=[setTimeout(feel,STILL?0:200),setTimeout(()=>arm(),STILL?0:950),...(out?[]:[cheerAt($('.dstage .hp'),STILL?0:700)])];
  function arm(){ready=true;$('#dn-go').removeAttribute('aria-disabled')}
  function skip(){tm.forEach(clearTimeout);feel();el.classList.add('skip');if(!out)cheer($('.dstage .hp'));if(!ready)arm()}
  el.addEventListener('click',ev=>{
    if(!ready)return skip();
    if(ev.target.closest('#dn-go')){if(el.classList.contains('leave'))return;el.onkeydown=null;const go=()=>{el.remove();inert(false);$(`.node[data-i="${i}"]`)?.focus({preventScroll:true});payoff(i)};
      if(STILL)return go();el.classList.add('leave');setTimeout(go,150)}});
  el.onkeydown=ev=>{if(ev.key==='Escape'){ev.preventDefault();ready?$('#dn-go').click():skip()}};
  if(STILL)skip();
}

// ===== §5: keepsake. Its contents are named before it opens =====
// demo dates: one practice a day, counting back from today (production stores each entry's date)
const dayOf=ago=>new Date(Date.now()-ago*864e5).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
const keptNotes=n=>LAY.nodes.filter(x=>x.ui===n.ui&&x.gi<n.gi&&PRACTICE(x.type)).slice(-3);
function keepsakeSheet(i,already){
  const n=LAY.nodes[i],u=unitOf(n),notes=keptNotes(n),cnt=LAY.nodes.filter(x=>x.ui===n.ui&&x.gi<n.gi&&PRACTICE(x.type)).length;
  openSheet(`<div class="kstage">${scene('paper',{cy:52})}${sparks([[22,24,14,A.honey,.5],[76,18,18,A.deep,.58],[30,62,10,A.deep,.66],[70,50,11,A.honey,.72]])}${TIN_OPEN()}<div class="hp" data-pose="proud" aria-hidden="true"></div></div>
    <h2 class="ttl" id="sh-t">Something to keep</h2>
    <p class="sub">You practised ${esc(u.skill)} ${words(cnt)}. Saved to your Keepsakes.</p>
    <ul class="notes">${notes.map((x,k)=>`<li style="animation-delay:${(.78+k*.1).toFixed(2)}s"><q>${esc(x.q)}</q><small>${dayOf(i-x.gi)}</small></li>`).join('')}</ul>
    <div class="acts"><button class="btn" data-kept="${i}" aria-disabled="true">Continue</button></div>`,'#sh-t','kp');
  $('#sh-t').tabIndex=-1;$('#sh-t').focus();hp();
  const sh=$('#sheet');let ready=false;
  let felt=!!already,said=!!already;const feel=()=>{if(!felt){felt=true;spaced(success)}};
  const tell=()=>{if(!said){said=true;say('Saved to your Keepsakes')}};
  const tm=already||STILL?[]:[setTimeout(feel,420),setTimeout(tell,1000),setTimeout(arm,1200)];
  function arm(){ready=true;$('[data-kept]')?.removeAttribute('aria-disabled')}
  sh.skip=()=>{tm.forEach(clearTimeout);feel();tell();sh.classList.add('skip');arm()};
  sh.isReady=()=>ready;
  if(already||STILL)sh.skip();
}
function keep(i){const c=cur(),first=status(i,doneOf(c))==='current';
  closeSheet(()=>{if(!first)return $(`.node[data-i="${i}"]`)?.focus();ST.done[c.id]=i+1;settle(c);save();payoff(i,true)})}

// ===== §6: unit, section and course ends. One calm sheet; the full celebration is shared, ≤1 per rolling 7 days =====
function milestoneSheet(i,review){
  const n=LAY.nodes[i],u=unitOf(n),c=cur(),last=i===LAY.nodes.length-1,level=last?'course':u.lastInSec?'section':'unit';
  const full=!review&&Date.now()-(ST.cele||0)>WEEK;if(full){ST.cele=Date.now();save()}
  // what you practised: one row per skill in this level's units, with its real session count
  const scope=LAY.units.filter(x=>level==='course'||(level==='section'?x.si===u.si:x.ui===u.ui));
  const skills=[...new Set(scope.map(x=>x.skill))].map(sk=>[sk,LAY.nodes.filter(x=>LAY.units[x.ui].skill===sk&&scope.includes(LAY.units[x.ui])&&PRACTICE(x.type)).length]);
  const T={unit:[`Unit ${u.uj+1} of ${c.sections[u.si].units.length}`,'Unit complete',`You practised ${u.skill} ${words(LAY.nodes.filter(x=>x.ui===n.ui&&PRACTICE(x.type)).length)}.`],
    section:[`Section ${u.si+1}`,'Section complete',`Skills you can use any day.`],
    course:[c.title,'Course complete','Every step here was yours.']}[level];
  // the bigger the end, the more the scene takes over: unit = day, section = dusk, course = night. The quiet variant keeps the scene, drops the rays and the jump
  const sky={unit:'day',section:'dusk',course:'night'}[level],sp=level==='course'?'#FFF3C7':level==='section'?'#fff':A.honey;
  const spk=full?[[14,18,16,sp,.7],[84,14,20,A.honey,.78],[10,46,11,'#fff',.86],[88,44,13,sp,.94],[24,70,9,A.honey,1],[76,72,10,'#fff',1.06]]:[[18,22,12,sp,.8],[82,30,12,sp,.9]];
  openSheet(`<div class="mstage">${scene(sky,{glow:false,under:`<svg class="halo" viewBox="0 0 200 200">${medalLight(level,full)}</svg>`})}<div class="hero">${sparks(spk)}</div><svg class="badge" viewBox="0 0 200 200" aria-hidden="true">${BADGE[level]()}</svg><div class="hp" data-pose="${full?'neutral':'proud'}" aria-hidden="true"></div></div>
    <div class="mbody"><small class="eb">${esc(T[0])}</small><h2 class="ttl" id="sh-t" tabindex="-1">${esc(T[1])}</h2><p class="line">${esc(T[2])}</p>
    ${level!=='section'?'':`<ul class="did">${skills.slice(0,3).map(([sk,c],k)=>`<li style="animation-delay:${(.96+k*.08).toFixed(2)}s"><i><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">${G.sprout}</svg></i><em>${esc(sk[0].toUpperCase()+sk.slice(1))}</em><span>${c} session${c===1?'':'s'}</span></li>`).join('')}</ul>`}
    <div class="acts"><button class="btn" data-ms="${i}" aria-disabled="true">Continue</button></div></div>`,'#sh-t','ms');
  $('#sh-t').focus();setTimeout(hp,STILL||review?0:200); // Happi drops in at 200
  const sh=$('#sheet');let ready=false;
  let felt=!!review;const feel=()=>{if(!felt){felt=true;spaced(full?success:soft)}};
  const tm=review||STILL?[]:[setTimeout(feel,600),setTimeout(arm,1300),...(full?[cheerAt($('.mstage .hp'),750)]:[])];
  function arm(){ready=true;$('[data-ms]')?.removeAttribute('aria-disabled')}
  sh.skip=()=>{tm.forEach(clearTimeout);feel();sh.classList.add('skip');if(full)cheer($('.mstage .hp'));arm()};sh.isReady=()=>ready;
  sh.review=!!review;
  if(review||STILL)sh.skip();
}
function msContinue(i){const review=$('#sheet').review;
  closeSheet(()=>{if(review)return $(`.node[data-i="${i}"]`)?.focus();
    if(LAY.nodes[i+1])timeline(advance(i,i+1,0));else{dock();$('.dock .btn')?.focus()}})}

function dock(){
  undock();const c=cur();if(!TOTAL(c)||doneOf(c)<TOTAL(c))return;
  const next=COURSES.find(x=>x.id!==c.id&&TOTAL(x)&&(ST.done[x.id]||0)<TOTAL(x));
  const d=document.createElement('section');d.className='dock';d.setAttribute('aria-label','Course complete');
  d.innerHTML=`<button class="x" data-dock aria-label="Close">${IC(P.x,20)}</button><div class="a"><small>Course complete</small><b>${esc(c.title)}</b><p>Every step here was yours.</p></div>
    <div class="b">${next?`<small>Next journey</small><b>${esc(next.title)}</b><button class="btn" data-next="${next.id}">Start journey</button>`:`<small>All caught up</small><button class="btn" data-explore>Explore journeys</button>`}</div>`;
  $('#app').append(d);
  $('#main').style.paddingBottom=(d.offsetHeight+84+24)+'px';
}
const undock=()=>{$('.dock')?.remove();$('#main').style.paddingBottom=''};

// ===== events =====
document.addEventListener('click',ev=>{const t=ev.target;
  const sh=$('#sheet');
  // keepsake and milestone sheets: the first tap only completes the beats
  if(sh.skip&&!sh.hidden&&!sh.isReady()&&sh.contains(t)){sh.skip();return}
  const nd=t.closest('.node');if(nd)return tapNode(+nd.dataset.i);
  if(t.closest('#banner'))return sectionsSheet();
  if(t.closest('#courses'))return coursesSheet();
  const go=t.closest('[data-go]');if(go){const i=+go.dataset.go;return status(i,doneOf(cur()))==='completed'?closeSheet():complete(i)}
  const op=t.closest('[data-open]');if(op)return keepsakeSheet(+op.dataset.open);
  const kp=t.closest('[data-kept]');if(kp)return keep(+kp.dataset.kept);
  const ms=t.closest('[data-ms]');if(ms)return msContinue(+ms.dataset.ms);
  if(t.closest('[data-trial]')){ST.pro=true;save();closeSheet(()=>{render();toast('Welcome to Happy Plus')});return}
  const sec=t.closest('[data-sec]');if(sec){const u=LAY.units.find(x=>x.si===+sec.dataset.sec);closeSheet();if(u)scrollToY(u.top);return}
  const co=t.closest('[data-course]');if(co){ST.course=co.dataset.course;save();closeSheet();render();$('#main').scrollTop=0;toCurrent(false);return}
  if(t.closest('[data-more]'))return coursesSheet(true);
  const ad=t.closest('[data-add]');if(ad){ST.enrolled.push(ad.dataset.add);ST.course=ad.dataset.add;save();closeSheet();render();$('#main').scrollTop=0;return}
  if(t.closest('[data-next]')){const id=t.closest('[data-next]').dataset.next;if(!ST.enrolled.includes(id))ST.enrolled.push(id);ST.course=id;save();undock();render();$('#main').scrollTop=0;toCurrent(false);return}
  if(t.closest('[data-explore]'))return coursesSheet(true);
  if(t.closest('[data-dock]')){undock();return $('#courses').focus()}
  if(t.closest('[data-close]')||t===$('#scrim'))return sh.classList.contains('ms')?null:sh.classList.contains('kp')?$('[data-kept]').click():closeSheet();
});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape'||$('.done'))return;
  const sh=$('#sheet');
  if(!sh.hidden){if(sh.skip&&!sh.isReady())return sh.skip();if(sh.classList.contains('ms'))return $('[data-ms]').click();if(sh.classList.contains('kp'))return $('[data-kept]').click();return closeSheet()}
  if($('.dock')){undock();$('#courses').focus()}});
$('#sheet').addEventListener('keydown',ev=>{if(ev.key!=='Tab')return;
  const f=$$('#sheet button:not(:disabled)'),i=f.indexOf(document.activeElement);
  if(ev.shiftKey&&i<=0){ev.preventDefault();f.at(-1).focus()}else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus()}});
let rz=0,lw=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if($('#path').clientWidth===lw)return;skipPath();const t=$('#main').scrollTop;render();lw=$('#path').clientWidth;$('#main').scrollTop=t},150)});
window.ResizeObserver&&new ResizeObserver(()=>{const h=$('#head').offsetHeight;if(h===lh)return;const d=h-lh;lh=h;
  document.documentElement.style.setProperty('--hh',h+'px');if(d)$('#main').scrollTop+=d;fab()}).observe($('#head'));

render();lw=$('#path').clientWidth;toCurrent(false);
// one arrival pulse when the path opens on the current node (the keepsake jiggle belongs to the payoff only)
if(!STILL)$$('#path .ring,#path .tip').forEach(e=>e.classList.add('arrive'));
</script>
</body>
