<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
  /* ===== tokens (same as the four exercises) ===== */
  :root{
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
    --r-s:12px;--r-m:16px;--r-pill:999px;
    --tap:44px;
    --t-cap:12px;--t-foot:13px;--t-sub:15px;--t-body:17px;--t-lead:20px;--t-h:24px;--t-title:28px;--t-num:34px;
    --dur:.28s;--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
    --font:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;--display:var(--font);
    --bg:#fff;--surface:#fff;--surface-2:#f7f7f7;--tint:#f2f8ef;--cloud-lo:#e4eee0;
    --label:#142414;--label-2:#4b4b4b;--label-3:#767676;
    --sep:#e5e5e5;--rim:#cfcfcf;
    --accent:#44633f;--on-accent:#fff;--ink:#5f7f58;--on-ink:#fff;--ink-rim:#29452a;
    --bw:2px;--rimw:4px;
    color-scheme:light; /* the app's Exercises screen is light only (white backgrounds) */
  }
  @media (prefers-contrast:more){:root{--sep:currentColor;--label-3:var(--label-2)}}

  /* ===== base ===== */
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{font-size:17px}
  body{font-family:var(--font);background:var(--bg);color:var(--label);min-height:100dvh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;line-height:1.35}
  #app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
  @media (min-width:600px){
    body{align-items:center;background:#d9d8d3}
    #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;box-shadow:0 0 0 10px #142414}
  }
  button,a{font:inherit;color:inherit;cursor:pointer}
  a{text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ===== header: title, completed count, coping cards, support, then the three views ===== */
  header{position:absolute;inset:0 0 auto;z-index:2;padding:calc(var(--sp-3) + env(safe-area-inset-top)) var(--sp-4) var(--sp-3)}
  header .top{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap)}
  header h2{font-size:var(--t-lead);font-weight:700;letter-spacing:-.01em}
  .acts{display:flex;align-items:center;gap:var(--sp-1)}
  .count{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--sp-3);margin-right:var(--sp-1);border-radius:var(--r-pill);background:var(--tint);color:var(--accent);font-size:var(--t-foot);font-weight:700}
  .ib{width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--accent)}
  .ib:active{background:var(--tint)}
  main{flex:1;min-height:0;padding:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;animation:enter var(--dur) var(--ease) both}
  main::-webkit-scrollbar{display:none}
  @keyframes enter{from{opacity:0}}
  h1{font-family:var(--display);font-size:var(--t-title);line-height:1.1;letter-spacing:-.01em;font-weight:800;text-wrap:balance}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-bottom:var(--rimw) solid var(--ink-rim);border-radius:var(--r-pill);padding:var(--sp-3) var(--sp-5);margin-top:var(--sp-3);
    font-size:var(--t-body);font-weight:700;background:var(--ink);color:var(--on-ink);transition:transform .12s var(--spring),border-bottom-width .12s var(--spring)}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn.ghost{background:none;color:var(--accent);border:var(--bw) solid var(--sep);border-bottom-width:var(--bw)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  @keyframes drop{from{transform:translateY(-14px);opacity:0}}
  @keyframes rise{from{transform:translateY(100%)}}
  @keyframes fade{from{opacity:0}}
  /* ===== sheets: support, coping cards, pro ===== */
  .scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.4);animation:fade .2s}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:82%;overflow-y:auto;padding:var(--sp-5) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom));background:var(--bg);border-radius:24px 24px 0 0;animation:rise .3s var(--ease)}
  .sheet h3{font-size:var(--t-h);font-weight:700;line-height:1.15;letter-spacing:-.01em;padding-right:var(--tap)}
  .sheet .x{position:absolute;top:var(--sp-3);right:var(--sp-3);width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface-2);color:var(--label-2)}
  .lede{margin:var(--sp-2) 0 var(--sp-4);color:var(--label-2);font-weight:500}
  .res{list-style:none;padding:0;border-bottom:1px solid var(--sep)}
  .res a{display:block;padding:var(--sp-3) 0;border-top:1px solid var(--sep)}
  .res b{display:block;font-size:var(--t-lead);font-weight:700;color:var(--accent)}
  .res small{display:block;font-size:var(--t-foot);font-weight:600;color:var(--label-3)}
  .fine{margin-top:var(--sp-3);font-size:var(--t-foot);color:var(--label-3)}
  .cards{list-style:none;padding:0;display:flex;flex-direction:column;gap:var(--sp-3)}
  .cards li{padding:var(--sp-4);border-radius:var(--r-m);background:var(--tint);font-weight:700;line-height:1.35}
  .cards small{display:block;margin-top:var(--sp-2);font-size:var(--t-foot);font-weight:600;color:var(--label-3)}
  .mark{flex:none}
  /* ===== tab bar: the app's five tabs, Home is current ===== */
  nav.tabs{display:flex;padding:var(--sp-2) var(--sp-1) calc(var(--sp-2) + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 82%,transparent);border-top:1px solid var(--sep);
    -webkit-backdrop-filter:blur(var(--sp-5)) saturate(1.4);backdrop-filter:blur(var(--sp-5)) saturate(1.4)}
  nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tap);padding:var(--sp-1) 0;font-size:var(--t-cap);font-weight:600;color:var(--label-3)}
  nav.tabs a[aria-current]{color:var(--accent)}
  nav.tabs svg{width:26px;height:26px}
  /* ===== day 0: what onboarding hands over (onboarding.html) ===== */
  .count .rg{width:18px;height:18px;transform:rotate(-90deg)}
  .count .rg circle{fill:none;stroke-width:3.5}
  .count .rg .trk{stroke:var(--cloud-lo)}
  .count .rg .val{stroke:var(--accent);stroke-linecap:round}
  .count .rg .val.fill{animation:fillr .6s cubic-bezier(.23,1,.32,1) .4s both}
  @keyframes fillr{from{stroke-dasharray:0 100}}
  /* deck: check-in (Happi answers), the one action, then the reflections you own */
  /* one palette for every mood: the picked face fills sage and lands with a squash; the card stays calm */
  .mood{padding:var(--sp-4);border-radius:20px;background:var(--surface-2)}
  .mood h2{font-size:var(--t-sub);font-weight:700;color:var(--label-2)}
  .mood h2 b{font-weight:800;color:var(--label)}
  .faces{display:flex;justify-content:space-between;margin:var(--sp-3) calc(-1*var(--sp-1)) 0}
  .faces button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:var(--tap);padding:var(--sp-2) 0;border:0;background:none;
    font-size:var(--t-cap);font-weight:600;color:var(--label-2);transition:opacity .2s}
  .faces svg{width:44px;height:44px;padding:6px;border-radius:50%;background:var(--surface);color:var(--label-2);transform-origin:50% 100%;transition:transform .35s var(--spring),background .2s,color .2s}
  .faces button:active svg{transform:scale(.9)}
  .mood.set .faces [aria-checked=false]{opacity:.55}
  .faces [aria-checked=true]{color:var(--label);font-weight:800}
  .faces [aria-checked=true] svg{background:var(--tint);color:var(--accent);transform:scale(1.14);animation:land .6s var(--spring)}
  @keyframes land{from{transform:scale(1.24,.9)}}
  .go{margin-top:var(--sp-5);gap:var(--sp-2)}
  .go small{font-size:var(--t-foot);font-weight:600;opacity:.75}
  .mine{margin-top:var(--sp-7)}
  .mine>header{display:flex;align-items:baseline;justify-content:space-between;position:static;padding:0;margin-bottom:var(--sp-3)}
  .mine h2{font-size:var(--t-lead);font-weight:800;letter-spacing:-.01em}
  .mine>header span{font-size:var(--t-foot);font-weight:600;color:var(--label-3)}
  .refl{padding:var(--sp-4);border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--sep)}
  .trap{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);background:var(--tint);color:var(--accent);font-size:var(--t-cap);font-weight:700}
  .was{margin-top:var(--sp-3);font-size:var(--t-sub);color:var(--label-3);quotes:"\201C" "\201D"}
  .was::before{content:open-quote}.was::after{content:close-quote}
  .turn{display:block;box-sizing:border-box;width:28px;height:28px;padding:6px 8px;margin:var(--sp-2) 0;border-radius:50%;background:var(--tint);color:var(--accent)}
  .now{font-family:var(--display);font-size:var(--t-lead);font-weight:700;line-height:1.3;letter-spacing:-.01em;text-wrap:pretty}
  .refl footer{margin-top:var(--sp-3);font-size:var(--t-foot);font-weight:500;color:var(--label-3)}
  .claim{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);padding:var(--sp-2) 0 0}
  .claim div{flex:1;min-width:0}
  .claim b{display:block;font-size:var(--t-sub);font-weight:700}
  .claim p{font-size:var(--t-foot);color:var(--label-3)}
  .claim .btn{flex:none;width:auto;margin:0;min-height:36px;padding:0 var(--sp-4);border-bottom-width:3px;font-size:var(--t-foot)}
  .later{min-height:var(--tap);padding:0 var(--sp-2);background:none;border:0;font-size:var(--t-foot);font-weight:500;color:var(--label-3)}
  .sheet.tall{max-height:94%}
  .sample{display:inline-block;margin-bottom:var(--sp-3);padding:2px 9px;border-radius:8px;border:1px dashed var(--rim);font-size:var(--t-cap);font-weight:600;color:var(--label-3)}
  .get{list-style:none;padding:0;margin:var(--sp-4) 0;display:flex;flex-direction:column;gap:var(--sp-3)}
  .get li{display:flex;gap:var(--sp-3);align-items:flex-start}
  .get li::before{content:"";flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--ink)}
  .get b,.tlx b{display:block;font-weight:700}
  .get small,.tlx small{display:block;font-size:var(--t-foot);font-weight:600;color:var(--label-2)}
  .tlx{list-style:none;padding:0 0 0 var(--sp-5);margin:var(--sp-4) 0;position:relative;display:flex;flex-direction:column;gap:var(--sp-4)}
  .tlx::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--sep)}
  .tlx li{position:relative}
  .tlx li::before{content:"";position:absolute;left:calc(-1*var(--sp-5));top:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:var(--bw) solid var(--ink);box-sizing:border-box}
  .tlx li:first-child::before{background:var(--ink)}
  .free{padding:var(--sp-3);border-radius:var(--r-s);background:var(--tint);font-weight:700;color:var(--accent);font-size:var(--t-sub)}
  .sso{display:flex;flex-direction:column;gap:var(--sp-2)}
  .sso button{min-height:52px;border-radius:var(--r-pill);border:var(--bw) solid var(--sep);background:var(--surface);font-weight:700}
  .sso button.dark{background:var(--label);color:#fff;border-color:var(--label)}
  .center{display:block;width:100%;text-align:center}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  /* ===== home ===== */
  /* scene header (BitePal, Finch): Happi in its world across the top ~half, a white deck rises over it.
     One light source, top right: every shape is a dark base with a lighter body shifted up-right, plus a highlight. */
  .scene{position:relative;height:clamp(340px,48vh,420px);overflow:hidden}
  .scene[data-time=night] header h2,.scene[data-time=night] .ib{color:#fff}
  .scene>svg{position:absolute;inset:0;width:100%;height:100%}
  .scene .drift{animation:drift 90s linear infinite}
  .scene .drift.far{animation-duration:150s;animation-delay:-70s}
  .scene .drift.near{animation-duration:60s;animation-delay:-20s}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(480px)}}
  .scene .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite alternate}
  .scene .crown{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate;--a:.8deg}
  @keyframes sway{from{transform:rotate(calc(-1*var(--a,3deg)))}to{transform:rotate(var(--a,3deg))}}
  .scene .birds{animation:fly 40s linear infinite}
  @keyframes fly{from{transform:translate(-60px,10px)}to{transform:translate(440px,-20px)}}
  .scene .flap{transform-box:fill-box;transform-origin:50% 100%;animation:flap .5s ease-in-out infinite alternate}
  @keyframes flap{to{transform:scaleY(.35)}}
  .scene .tw{animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.25}}
  .scene .fly{animation:ff 6s ease-in-out infinite alternate}
  @keyframes ff{50%{transform:translate(6px,-8px);opacity:.35}to{transform:translate(-4px,-14px)}}
  .scene .glow,.scene[data-time=night] .happi [data-glow]{filter:blur(4px);mix-blend-mode:screen}
  .scene[data-time=night] .happi [data-glow]{fill:#ffb84a}
  .scene .happi [data-shadow] ellipse{fill:#4f7d45;opacity:.3} /* grass-tinted contact shadow; the rig default is neutral grey */
  .scene .happi{position:absolute;left:50%;bottom:38px;height:64%;aspect-ratio:220/246;transform:translateX(-58%)}
  .say{position:absolute;right:var(--sp-4);top:27%;z-index:1;max-width:148px;padding:10px 14px 11px;border-radius:18px;background:#fff;
    border:2px solid rgba(20,36,20,.08);border-bottom-width:4px;
    font-family:var(--display);font-weight:700;font-size:var(--t-sub);line-height:1.25;letter-spacing:-.005em;color:var(--label);
    transform-origin:0 60%;animation:say .45s .9s cubic-bezier(.34,1.56,.64,1) both}
  .say::after{content:"";position:absolute;left:-7px;top:calc(50% - 6px);width:11px;height:11px;background:#fff;
    border:solid rgba(20,36,20,.08);border-width:0 0 2px 2px;border-radius:0 0 0 3px;transform:rotate(45deg)}
  @keyframes say{from{opacity:0;transform:scale(.8)}}
  .deck{position:relative;margin-top:-28px;padding:var(--sp-6) var(--sp-4) var(--sp-7);border-radius:28px 28px 0 0;background:var(--bg)}
  .help{margin-top:var(--sp-7);border-top:1px solid var(--sep)}
  .help button{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:52px;padding:0;background:none;border:0;font-size:var(--t-sub);font-weight:600;color:var(--label-2)}
  /* signed-in Account: Duolingo hero + BitePal grouped fill cards on a soft ground, Finch's delete card apart (Mobbin, Nov 2026) */
  .acctv{position:absolute;inset:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--surface-2);padding:0 var(--gutter) calc(var(--sp-5) + env(safe-area-inset-bottom));animation:rise .3s var(--ease)}
  .acctv::-webkit-scrollbar{display:none}
  .acctv .bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;min-height:56px;margin:0 calc(var(--gutter) * -1);padding:env(safe-area-inset-top) calc(var(--gutter) - var(--sp-2)) 0;background:var(--tint)}
  .acctv .hero{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);margin:0 calc(var(--gutter) * -1) var(--sp-5);padding:var(--sp-2) var(--gutter) var(--sp-5);background:var(--tint);text-align:center}
  .acctv .hero .happi{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--bg)}
  .acctv .hero .happi svg{width:100%;height:100%}
  .acctv .hero b{margin-top:var(--sp-2);font-size:var(--t-h);font-weight:700}
  .acctv .hero span{font-size:var(--t-foot);color:var(--label-2)}
  .acctv h3{margin:var(--sp-4) var(--sp-1) var(--sp-2);font-size:var(--t-foot);font-weight:var(--w-body);color:var(--label-2)}
  .acctv .card{padding:0 var(--pad-card);border-radius:24px;background:var(--bg)}
  .acctv .pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
  .acctv .tile{padding:var(--pad-card);border-radius:24px;background:var(--bg)}
  .acctv .tile small{display:block;font-size:var(--t-cap);color:var(--label-2)}
  .acctv .tile b{display:flex;align-items:center;gap:var(--sp-2);margin-top:2px;font-size:var(--t-num,28px);font-weight:700}
  .acctv .tile .rg{width:22px;height:22px;transform:rotate(-90deg)}
  .acctv .tile .rg circle{fill:none;stroke-width:3.5}
  .acctv .tile .rg .trk{stroke:var(--sep)}
  .acctv .tile .rg .val{stroke:var(--accent);stroke-linecap:round}
  .acctv .row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);width:100%;min-height:56px;padding:0;background:none;border:0;border-bottom:var(--bw) solid var(--sep);font-size:var(--t-body);font-weight:var(--w-body);color:var(--label);text-align:left}
  .acctv .row:focus-within{background:none;border-bottom-color:var(--sep)}
  .acctv .card .row:last-child{border-bottom:0}
  .acctv .row span{font-size:var(--t-sub);font-weight:500;color:var(--label-2)}
  .acctv .sw{display:block;width:51px;height:31px;flex:none;border-radius:16px;background:color-mix(in srgb,var(--label-3) 45%,transparent);position:relative;transition:background .2s}
  .acctv .sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--spring)}
  .acctv [aria-checked=true] .sw{background:var(--accent)}
  .acctv [aria-checked=true] .sw::after{transform:translateX(20px)}
  .acctv .card.apart{margin-top:var(--sp-4)}
  .acctv .del{color:var(--danger,#B3402E)}
  .btn.warn{background:var(--danger,#B3402E);color:#fff}
</style>
<link rel="stylesheet" href="happy-ui.css">
<script src="happi.js" defer></script>
</head>
<body>
<div id="app">
  <main id="main">
  <section class="scene" id="scene">
  <header>
    <div class="top">
      <h2>Home</h2>
      <div class="acts">
        <span class="count" id="count" hidden></span>
        <button class="ib" id="help" aria-label="Need to talk to someone?"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/></svg></button>
        <button class="ib" id="acct" aria-label="Account"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
      </div>
    </div>
  </header>
  </section>
  <div class="deck">
    <section class="mood" id="mood"></section>
    <a class="btn go" id="go" href="thought-catcher.html">Catch a thought <small>· 2 min</small></a>
    <div id="day0"></div>
    <p class="help"><button data-sheet="help"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/></svg>Need to talk to someone now?</button></p>
  </div>
  </main>
  <nav class="tabs" aria-label="Tabs">
    <a href="home.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>

<script>

day0();

  :{sky:['#bfe1e8','#e4f2ec','#fdf1d6'],sun:'#ffd77a',cloud:'#fff',cloudSh:'#dfecef',far:'#c7ddcd',far2:'#afcdb4',

  <rect width="390" height="400" fill="url(#sky)"/>

  <path d="M0 330Q90 310 190 316T390 308V400H0Z" fill="${P.front}"/>

    <h3>Account</h3>
    <div class="card"><button class="row" data-signout-ask>Sign out</button></div>
    <div class="card apart"><button class="row del" data-delete>Delete account</button></div>`;
  const hp=$('#acctv .happi');window.Happi&&Happi.at(hp,'content',4000);hp.querySelector('svg')?.setAttribute('viewBox','40 10 180 166'); // head crop, same rig as Home
  const v=$('#acctv'),first=v.hidden;v.hidden=false;if(first)v.scrollTop=0;$$('#main,nav.tabs').forEach(e=>e.inert=true);$(focus).focus()};
const closeAcct=()=>{$('#acctv').hidden=true;$$('#main,nav.tabs').forEach(e=>e.inert=false);$('#acct').focus()};
$('#acct').onclick=()=>get('happy.signedIn')?acct():openSheet('account');
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(!$('#acctv').hidden)closeAcct()}});
document.addEventListener('click',ev=>{
  const s=ev.target.closest('[data-sheet]');if(s)return openSheet(s.dataset.sheet);
  const md=ev.target.closest('[data-mood]');if(md){mood=md.dataset.mood;put('happy.mood',{day:today,v:mood});buzz();drawMood();$(`[data-mood=${mood}]`).focus();return answer(mood)}
  if(ev.target.closest('[data-close]'))return closeSheet();
  if(ev.target.closest('[data-later]')){put('happy.signupLater',Date.now()+7*864e5);return day0()}
  if(ev.target.closest('[data-trial]'))return openSheet('signin','purchase'); // after purchase: protect it with an account
  if(ev.target.closest('[data-pick]'))return $('#rm').innerHTML='<input type="time" id="tm" value="20:00" aria-label="Reminder time"><button data-set>Set reminder</button>';
  if(ev.target.closest('[data-set]')){const v=$('#tm').value;if(!v)return;const [h,m]=v.split(':').map(Number);return setReminder(`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`)}
  if(ev.target.closest('[data-acctback]'))return closeAcct();
  if(ev.target.closest('[data-reminders]'))return openSheet('remind','account');
  if(ev.target.closest('[data-signout-ask]'))return openSheet('out');
  if(ev.target.closest('[data-rtoggle]')){if(get('happy.reminder')){try{localStorage.removeItem('happy.reminder')}catch{};return acct('[data-rtoggle]')}return openSheet('remind','account')}
  if(ev.target.closest('[data-signout]')){put('happy.signedIn',false);closeSheet();closeAcct();return day0()}
  if(ev.target.closest('[data-delete]'))return openSheet('del');
  if(ev.target.closest('[data-del]')){try{[...KEYS,'happy.mood'].forEach(k=>localStorage.removeItem(k))}catch{};return location.replace('onboarding.html')}
  if(ev.target.closest('[data-remind]'))return setReminder(ev.target.closest('[data-remind]').dataset.remind);
  if(ev.target.closest('[data-signin]')){put('happy.signedIn',true);closeSheet();return day0()}
});
$('#sheet').addEventListener('keydown',ev=>{ // keep focus inside the dialog
  if(ev.key!=='Tab')return;
  const f=$$('#sheet button,#sheet a'),i=f.indexOf(document.activeElement);
  if(ev.shiftKey&&i<=0){ev.preventDefault();f.at(-1).focus()}
  else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus()}
});
// the paywall sheet opens over Home once, right after onboarding
if(ONB&&!CALM&&Q.has('welcome')&&!get('happy.paywallSeen')){put('happy.paywallSeen',true);setTimeout(()=>openSheet('paywall'),600)}
// after the 2nd saved practice: re-offer the reminder once if it was declined, else the signup sheet (one ask per moment)
if(ONB&&!CALM&&Q.has('second')&&!Q.has('welcome')){const offer=ONB.reminder==='not_now'&&!get('happy.reminder')&&!get('happy.reminderOffered');
  const ask=offer?['remind']:!get('happy.signedIn')?['signin','second']:null;
  if(offer)put('happy.reminderOffered',true);
  ask&&setTimeout(()=>openSheet(...ask),600)}
</script>
</body>
