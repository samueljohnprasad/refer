lesson:
  id: l27
  title: "Watching Your Thoughts"
  duration_minutes: 11
  target_accuracy: 0.80
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    - id: l27_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 45
      cards:
        - text: "Cognitive defusion = observing thoughts without fighting them. When 'I'll never sleep' arises, notice it like a cloud passing."
          visual_key: "thoughts_as_clouds"
        - text: "WHY: Fighting thoughts = more thoughts (white bear effect). Observing without judgment breaks the struggle."
          visual_key: "white_bear_paradox"
        - text: "Goal: STOP FIGHTING thoughts, not stop having them. Thoughts at 2am are normal. The STRUGGLE keeps you awake."
          visual_key: "struggle_vs_thought"
      note: "Introduce cognitive_defusion. Emphasize non-suppression (which worsens hyperarousal)."

    - id: l27_e2
      type: "true_false"
      phase: "introduce"
      concept: "cognitive_defusion"
      scaffold_level: 2
      difficulty: 0.15
      duration_seconds: 25
      statement: "The goal of cognitive defusion is to stop having racing thoughts at night."
      correct: false
      explanation: "False. The goal is to stop STRUGGLING with the thoughts. Racing thoughts at 2am are normal. The struggle — trying to suppress them, fighting them — is what keeps you awake."
      note: "Critical misconception. Prevent users from accidentally suppressing (which worsens hyperarousal)."

    - id: l27_e3
      type: "scenario"
      phase: "challenge"
      concept: "cognitive_defusion"
      scaffold_level: 5
      difficulty: 0.25
      duration_seconds: 50
      scenario: "At 2am: 'I'll never sleep. I'm broken. I'll ruin tomorrow.' You notice the thought and immediately fight it: 'No, stop thinking that. I will NOT catastrophize.' This makes the thoughts louder."
      question: "What's a cognitive defusion response?"
      options:
        - text: "'There's the catastrophizing thought. It's just a thought, not a prediction. I notice it and let it pass like a cloud.'"
          correct: true
          feedback: "Exactly. You're observing without fighting. Your brain calms because there's no battle."
        - text: "'Stop! I won't think that!'"
          correct: false
          feedback: "That's fighting the thought. Fighting creates more thoughts. Observe instead of resist."
        - text: "Try to think happy thoughts instead"
          correct: false
          feedback: "That's still struggling to control your thoughts. Just notice the catastrophizing thought, let it be, and move on."
      note: "Application. User practices mental stance shift."

    - id: l27_e4
      type: "guided_journal"
      phase: "peak"
      concept: "cognitive_defusion"
      scaffold_level: 5
      duration_seconds: 90
      prompt: "Write a racing thought you have at night. Then write a cognitive defusion response to it."
      sub_prompts:
        - "Racing thought: (e.g., 'I'll never sleep, I'm broken')"
        - "Cognitive defusion response: (e.g., 'There's the catastrophizing thought. It's just a thought, not a prediction.')"
        - "How does reframing it as 'just a thought' change how it feels?"
      min_words: 30
      max_words: 150
      is_scored: false
      note: "Hands-on practice. User creates personal defusion response."

    - id: l27_e5
      type: "multiple_choice"
      phase: "consolidate"
      concept: "cognitive_defusion"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "The 'clouds passing' metaphor means:"
      options:
        - text: "Observe your thoughts without judgment, let them pass naturally without fighting"
          correct: true
        - text: "Make your thoughts disappear immediately"
          correct: false
        - text: "Think about something else instead"
          correct: false
      feedback_correct: "Right. Observation, not suppression. Not fighting, not replacing."
      note: "Clarify defusion vs. suppression."

    - id: l27_e6
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this 'watching thoughts' approach feel possible for you?"
      scale: 5
      labels: ["No, too hard", "Seems difficult", "Maybe possible", "Probably yes", "Yes, I can try it"]
      note: "Feasibility and motivation check."

  completion_reward:
    xp: 16
    bonus_xp_if_accuracy_above_80: 5
    variable_reward_roll: true
  next_lesson_teaser: "Tomorrow: Rewriting the Disaster Story — when catastrophizing thoughts feel true, how to reality-check them."

