lesson:
  id: l28
  title: "Rewriting the Disaster Story"
  duration_minutes: 12
  target_accuracy: 0.78
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    - id: l28_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 50
      cards:
        - text: "Sleep catastrophizing: 'If I don't sleep, I'll ruin tomorrow and everything will collapse.'"
          visual_key: "catastrophic_spiral"
        - text: "Your brain is trying to prepare for danger. But this rehearsal = anxiety = wakefulness (the trap)."
          visual_key: "catastrophe_loop"
        - text: "Reality: You'll be tired but functional. You've had bad nights before and survived."
          visual_key: "realistic_outcome"
      note: "Introduce sleep_catastrophizing and reality-checking approach."

    - id: l28_e2
      type: "true_false"
      phase: "introduce"
      concept: "sleep_catastrophizing"
      scaffold_level: 2
      difficulty: 0.15
      duration_seconds: 25
      statement: "If you don't sleep tonight, you will definitely ruin everything tomorrow."
      correct: false
      explanation: "False. You'll be tired, maybe foggy, but still functional. Most people survive bad nights regularly. Your brain is catastrophizing to prepare for 'danger,' but the actual consequence is much milder."
      note: "Misconception: catastrophe is inevitable. Reality: mild functional decline."

    - id: l28_e3
      type: "scenario"
      phase: "challenge"
      concept: "sleep_catastrophizing"
      scaffold_level: 5
      difficulty: 0.28
      duration_seconds: 60
      scenario: "At 3am: 'It's 3am and I have a presentation at 9am. If I don't sleep I'll mess it up. My career is over.'"
      question: "How would you reality-check this catastrophe?"
      options:
        - text: "Evidence for: I'll be tired. Evidence against: I've done presentations tired before and they went okay. Realistic thought: 'I'll be tired but I'll get through it.'"
          correct: true
          feedback: "Exactly. You're using CBT-I thought records. Most catastrophes never materialize as imagined."
        - text: "The catastrophe is probably true"
          correct: false
          feedback: "Catastrophizing feels true because your brain is in threat mode. But reality-checking usually shows the outcome is much milder."
        - text: "Just accept the catastrophe and give up"
          correct: false
          feedback: "That reinforces the cycle. Instead, reality-check the thought. You'll likely be okay."
      note: "Application of thought records."

    - id: l28_e4
      type: "guided_journal"
      phase: "peak"
      concept: "sleep_catastrophizing"
      scaffold_level: 5
      duration_seconds: 120
      prompt: "CBT-I Thought Record: Use this template on your most common sleep catastrophe."
      sub_prompts:
        - "Catastrophic thought: (e.g., 'If I don't sleep, I'll ruin my presentation')"
        - "Evidence FOR this thought: (what scares you?)"
        - "Evidence AGAINST: (Have you survived tired nights? What actually happens?)"
        - "More realistic thought: (Usually milder than catastrophe, e.g., 'I'll be tired but functional')"
      min_words: 40
      max_words: 200
      is_scored: false
      note: "Hands-on thought record. User applies CBT-I on personal catastrophe."

    - id: l28_e5
      type: "multiple_choice"
      phase: "consolidate"
      concept: "sleep_catastrophizing"
      scaffold_level: 3
      difficulty: 0.18
      duration_seconds: 25
      prompt: "The most common sleep catastrophe is:"
      options:
        - text: "'If I don't sleep, I'll ruin tomorrow' (very common, rarely true)"
          correct: true
        - text: "'I'll never sleep again'"
          correct: false
        - text: "'Insomnia is permanent'"
          correct: false
      feedback_correct: "Yes. That's the one to reality-check first. Evidence usually shows you'll be tired but okay."
      note: "Primer for personal use."

    - id: l28_e6
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "After reality-checking catastrophes, how do you feel about bad sleep nights?"
      scale: 5
      labels: ["Still terrified", "Less worried", "Neutral", "Hopeful", "Much more confident"]
      note: "Efficacy measure."

  completion_reward:
    xp: 17
    bonus_xp_if_accuracy_above_78: 5
    variable_reward_roll: true
  next_lesson_teaser: "Tomorrow: Your Sleep Story — shifting from 'I'm an insomniac' to 'I'm resilient.'"

