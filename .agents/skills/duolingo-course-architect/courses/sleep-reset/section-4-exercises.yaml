# Section 4: Sleep Mindset — Exercise Mapping (l26-l31)
# Sleep anxiety, cognitive defusion, catastrophizing, identity, resilience

lesson:
  id: l26
  title: "The Sleep Effort Trap"
  duration_minutes: 10
  target_accuracy: 0.85
  emotional_arc: [warmup, introduce, challenge, peak, cooldown]

  exercises:
    - id: l26_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 45
      cards:
        - text: "Sleep effort paradox: The harder you try to sleep, the more awake you become."
          visual_key: "effort_paradox_paradox"
        - text: "WHY: Trying hard = threat signal. Your brain floods adrenaline, muscles tense. The pressure backfires."
          visual_key: "hyperarousal_loop"
        - text: "This is why stimulus control works: when you can't sleep, you GET UP. You stop trying. Your body calms."
          visual_key: "stimulus_control_reset"
      note: "Introduce sleep_effort_paradox and sleep_anxiety. Connect back to stimulus control."

    - id: l26_e2
      type: "multiple_choice"
      phase: "introduce"
      concept: "sleep_effort_paradox"
      scaffold_level: 2
      difficulty: 0.15
      duration_seconds: 20
      prompt: "What does your brain interpret when you lie in bed thinking 'I MUST sleep, it's 2am'?"
      options:
        - text: "A threat — adrenaline floods, muscles tense"
          correct: true
        - text: "A calm signal — 'it's time to rest'"
          correct: false
        - text: "Nothing — thoughts don't affect sleep"
          correct: false
      feedback_correct: "Right. Your brain enters fight-or-flight. The pressure to sleep actually keeps you awake."
      feedback_incorrect: "Actually, that thought is a threat signal. Your brain interprets 'I MUST sleep' as 'something is wrong.'"
      note: "Recognizes how effort creates hyperarousal."

    - id: l26_e3
      type: "scenario"
      phase: "challenge"
      concept: "sleep_effort_paradox"
      scaffold_level: 5
      difficulty: 0.28
      duration_seconds: 60
      scenario: "You have a big presentation tomorrow. At 11pm you're trying SO HARD to fall asleep. 'I need 8 hours, it's already 11pm, I only have 8 hours left...' You're more awake than ever."
      question: "What's happening?"
      options:
        - text: "Sleep effort paradox. Trying hard = threat = adrenaline = wakefulness. You're caught in a cycle."
          correct: true
          feedback: "Yes. The night you NEED sleep most is exactly when this happens. The solution: stop trying. Get up, do something calm until genuinely sleepy, then return. This is stimulus control."
        - text: "You're just anxious and need to try harder"
          correct: false
          feedback: "Trying harder makes it worse. You need to flip the approach: stop trying, get up, break the cycle."
        - text: "You have insomnia and something is broken"
          correct: false
          feedback: "Nothing is broken. This is a normal response to sleep pressure + threat perception. The cycle is learned; it can be unlearned with stimulus control."
      note: "Real-world high-stakes scenario. User recognizes effort trap in their own experience."

    - id: l26_e4
      type: "free_text"
      phase: "peak"
      duration_seconds: 60
      prompt: "Describe a night when you tried really hard to fall asleep. What was that like? Then: What could you have done instead (get up, 4-7-8 breathing, body scan, etc.)?"
      min_words: 30
      max_words: 150
      is_scored: false
      note: "Personal reflection. User recognizes their own effort trap and imagines alternative response."

    - id: l26_e5
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this 'effort paradox' explain some of your 2-3am awake nights?"
      scale: 5
      labels: ["Not at all", "Slightly", "Somewhat", "Very much", "Yes, exactly"]
      note: "Validation of user experience. Builds motivation for mindset shift."

  completion_reward:
    xp: 15
    bonus_xp_if_accuracy_above_85: 5
  next_lesson_teaser: "Tomorrow: Watching Your Thoughts — how to stop fighting racing thoughts and let them pass like clouds."

