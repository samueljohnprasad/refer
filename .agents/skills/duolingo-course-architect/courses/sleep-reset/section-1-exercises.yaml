lesson:
  id: l4
  title: "Early vs Late Sleep"
  duration_minutes: 9
  target_accuracy: 0.78
  emotional_arc: [warmup, introduce, challenge, peak, cooldown]

  exercises:
    - id: l4_e1
      type: "multiple_choice"
      phase: "warmup"
      concept: "sleep_cycles"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Sleep cycles get longer as the night goes on. First cycle is 70-100 min; later cycles are ___?"
      options:
        - text: "90-120 minutes"
          correct: true
        - text: "70-100 minutes (same)"
          correct: false
        - text: "60-80 minutes (shorter)"
          correct: false
      feedback_correct: "Right. Cycles lengthen. That's why late-night sleep feels different."
      note: "Recall from l2."

    - id: l4_e2
      type: "learn_cards"
      phase: "introduce"
      concept: "sleep_composition"
      scaffold_level: 1
      duration_seconds: 50
      cards:
        - text: "Early cycles: 50-70% N3 (deep sleep), 20% REM. Late cycles: 10% N3, 50-60% REM."
          visual_key: "cycle_composition_arc"
        - text: "First 4 hours of sleep = mostly deep. Last 4 hours = mostly dreams."
          visual_key: "8hr_sleep_split"
        - text: "This is why waking at 4am feels different from 7am — you're in a completely different sleep state."
          visual_key: "4am_vs_7am_states"
      note: "Introduce sleep_composition. WHAT the composition is + WHY it matters."

    - id: l4_e3
      type: "matching"
      phase: "challenge"
      concept: "sleep_composition"
      scaffold_level: 4
      difficulty: 0.22
      duration_seconds: 50
      prompt: "Match time of night to sleep stage composition:"
      pairs:
        - left: "11pm-1am (early cycles)"
          right: "Mostly deep sleep (N3), some light sleep"
        - left: "3am-5am (late cycles)"
          right: "Mostly dream sleep (REM), minimal deep sleep"
        - left: "5am-7am (final cycle)"
          right: "Almost pure REM (dreams), recovery mostly complete"
      note: "Structural mapping. User builds mental model of night progression."

    - id: l4_e4
      type: "guided_journal"
      phase: "peak"
      concept: "sleep_composition"
      scaffold_level: 5
      duration_seconds: 90
      prompt: "If you sleep 8 hours (11pm-7am), describe the two halves:"
      sub_prompts:
        - "First 4 hours (11pm-3am): Mostly ___ (deep sleep / dream sleep)"
        - "Last 4 hours (3am-7am): Mostly ___ (deep sleep / dream sleep)"
        - "Why do you think waking at 3am feels trapped, but waking at 7am feels like natural wake-up?"
      min_words: 25
      max_words: 150
      is_scored: false
      note: "Personal application. User explains sleep composition in their own pattern."

    - id: l4_e5
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this explain why your 3am waking feels SO different from your 7am waking?"
      scale: 5
      labels: ["Not really", "A bit", "Somewhat", "Very much", "Yes, exactly"]
      note: "Validation of user experience."

  completion_reward:
    xp: 15
    bonus_xp_if_accuracy_above_78: 4
  next_lesson_teaser: "Tomorrow: The Sleep Pressure System — adenosine builds up, your clock creates the window. Both matter."

