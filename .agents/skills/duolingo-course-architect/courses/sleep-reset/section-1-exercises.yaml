lesson:
  id: l3
  title: "Your Internal Clock"
  duration_minutes: 10
  target_accuracy: 0.80
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    - id: l3_e1
      type: "multiple_choice"
      phase: "warmup"
      concept: "sleep_architecture"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Which happens at the END of the day when you're ready for sleep?"
      options:
        - text: "Your circadian alertness zone DROPS sharply"
          correct: true
        - text: "Your circadian alertness zone PEAKS"
          correct: false
      feedback_correct: "Right. Peak alertness is around bedtime; then it drops fast, making sleep possible."
      note: "Recall warmup. Sets up circadian rhythm concept."

    - id: l3_e2
      type: "learn_cards"
      phase: "introduce"
      concept: "circadian_rhythm"
      scaffold_level: 1
      duration_seconds: 60
      cards:
        - text: "Your circadian rhythm is a 24-hour internal clock. It creates a 'wake maintenance zone' — peak alertness around bedtime."
          visual_key: "circadian_24hr_clock"
        - text: "Peak → sharp DROP. At 10pm you feel wired. By 11pm you crash. That's the clock working."
          visual_key: "peak_then_drop_curve"
        - text: "Consistent WAKE TIME (not bedtime) resets this clock best. If you wake at 7am every day, your clock learns this anchor."
          visual_key: "wake_time_anchor"
      note: "Introduce circadian_rhythm with peak-then-drop metaphor and wake-time importance."

    - id: l3_e3
      type: "scenario"
      phase: "challenge"
      concept: "circadian_rhythm"
      scaffold_level: 5
      difficulty: 0.25
      duration_seconds: 45
      scenario: "You sleep 7am Mon-Fri, 10am Sat-Sun. Your clock gets confused. You're groggy, sleep is patchy."
      question: "What's happening?"
      options:
        - text: "Your wake time shifts 3 hours — your 'anchor' is drifting. Your clock can't settle into a pattern."
          correct: true
          feedback: "Exactly. Your clock needs a consistent anchor. Even 2-3 hour shifts on weekends can disrupt the whole week."
        - text: "You just need more sleep"
          correct: false
          feedback: "Sleep amount isn't the issue. Your TIMING (wake time) is inconsistent, so your clock stays confused."
        - text: "Weekends should naturally reset your sleep"
          correct: false
          feedback: "Actually, weekend drift makes things worse. Consistency is what your clock needs."
      note: "Real-world scenario. User sees how clock consistency matters more than sleep duration."

    - id: l3_e4
      type: "guided_journal"
      phase: "peak"
      concept: "circadian_rhythm"
      scaffold_level: 5
      duration_seconds: 90
      prompt: "What time do you wake on weekdays vs weekends? How consistent is your wake time?"
      sub_prompts:
        - "Weekday wake time: ___"
        - "Weekend wake time: ___"
        - "How many hours of drift? ___"
        - "Could you make your wake time more consistent? How?"
      min_words: 20
      max_words: 150
      is_scored: false
      note: "Personal application. User assesses their own wake-time consistency."

    - id: l3_e5
      type: "multiple_choice"
      phase: "consolidate"
      concept: "circadian_rhythm"
      scaffold_level: 3
      difficulty: 0.18
      duration_seconds: 20
      prompt: "The best way to reset your circadian clock is:"
      options:
        - text: "Keep a consistent WAKE TIME every day (within 30 min, even on weekends)"
          correct: true
        - text: "Keep a consistent bedtime"
          correct: false
        - text: "Sleep as long as you want on weekends"
          correct: false
      feedback_correct: "Right. Wake time is the master anchor. Bedtime naturally follows when the clock is set correctly."
      note: "Priority: wake time > bedtime."

    - id: l3_e6
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this 'circadian clock' idea change how you think about your sleep schedule?"
      scale: 5
      labels: ["Not at all", "Slightly", "Somewhat", "Very much", "Yes, completely"]
      note: "Insight measure."

  completion_reward:
    xp: 16
    bonus_xp_if_accuracy_above_80: 5
  next_lesson_teaser: "Tomorrow: Early vs Late Sleep — why your 11pm sleep feels different from your 5am sleep."

