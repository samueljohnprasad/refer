lesson:
  id: l7
  title: "Alcohol: The Sleep Saboteur"
  duration_minutes: 10
  target_accuracy: 0.78
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    - id: l7_e1
      type: "multiple_choice"
      phase: "warmup"
      concept: "sleep_cycles"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Late-night sleep is mostly what stage?"
      options:
        - text: "REM (dream sleep)"
          correct: true
        - text: "N3 (deep sleep)"
          correct: false
      feedback_correct: "Right. Late cycles are REM-heavy. This is important for understanding alcohol's effect."
      note: "Recall. Sets up alcohol-REM disruption."

    - id: l7_e2
      type: "learn_cards"
      phase: "introduce"
      concept: "alcohol_sleep"
      scaffold_level: 1
      duration_seconds: 60
      cards:
        - text: "Alcohol helps ONSET (acts like sleeping pill) but destroys SECOND HALF (REM rebound, fragmentation)."
          visual_key: "alcohol_biphasic_effect"
        - text: "One drink at 6pm: Sleep onset at 9pm is easy, but 1-3am you wake fragmented, REM disrupted."
          visual_key: "alcohol_timeline_effects"
        - text: "Dose-dependent: One beer barely disrupts. Three drinks = major fragmentation. Even 'one glass of wine' disrupts for many."
          visual_key: "dose_dependent_effect"
      note: "Introduce alcohol_sleep. WHAT happens + WHEN it happens + DOSE matters."

    - id: l7_e3
      type: "scenario"
      phase: "challenge"
      concept: "alcohol_sleep"
      scaffold_level: 5
      difficulty: 0.25
      duration_seconds: 50
      scenario: "You have two glasses of wine at 7pm. You fall asleep easily at 10pm (alcohol helped). But at 2am you wake fragmented, sweating, heart racing, can't get back to sleep. You feel like you slept badly."
      question: "What happened?"
      options:
        - text: "Alcohol metabolite (acetaldehyde) causes REM rebound when BAC drops. Your late-cycle REM is disrupted and fragmented."
          correct: true
          feedback: "Yes. Alcohol helps onset but destroys second-half sleep. The crash at 2am is classic REM rebound."
        - text: "You're just sensitive to alcohol"
          correct: false
          feedback: "Not just sensitivity — this is a dose-dependent effect everyone experiences. More alcohol = more disruption."
        - text: "You should've waited longer before bed"
          correct: false
          feedback: "Timing doesn't fix it. The alcohol will metabolize 4-5 hrs post-dose, disrupting late sleep regardless."
      note: "Real-world scenario. User recognizes alcohol effect in their own experience."

    - id: l7_e4
      type: "guided_journal"
      phase: "peak"
      concept: "alcohol_sleep"
      scaffold_level: 5
      duration_seconds: 90
      prompt: "Do you drink alcohol? If so, map its effect on your sleep:"
      sub_prompts:
        - "When do you drink? How much? (e.g., 7pm, 2 glasses wine)"
        - "How's your sleep that night? Onset? Middle-of-night waking?"
        - "Have you noticed a pattern (fragmented, sweaty, can't get back to sleep at 1-3am)?"
      min_words: 15
      max_words: 130
      is_scored: false
      note: "Personal reflection. User observes their own alcohol-sleep pattern."

    - id: l7_e5
      type: "multiple_choice"
      phase: "consolidate"
      concept: "alcohol_sleep"
      scaffold_level: 3
      difficulty: 0.18
      duration_seconds: 20
      prompt: "The dose where alcohol stops disrupting sleep is:"
      options:
        - text: "Individual and varies; lower is better. Even one drink disrupts for sensitive people."
          correct: true
        - text: "Two drinks is always safe"
          correct: false
        - text: "Alcohol doesn't really disrupt sleep"
          correct: false
      feedback_correct: "Right. DOSE matters. There's no universal safe amount; lower is always better for sleep."
      note: "Individual variation. No safe blanket rule."

    - id: l7_e6
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this explain your fragmented, sweaty sleep after drinking alcohol?"
      scale: 5
      labels: ["Not at all", "Slightly", "Somewhat", "Very much", "Yes, exactly"]
      note: "Alcohol-sleep recognition."

  completion_reward:
    xp: 16
    bonus_xp_if_accuracy_above_78: 5
  next_lesson_teaser: "Tomorrow: Light, stress, and irregular wake times — three more ways your sleep gets disrupted."

