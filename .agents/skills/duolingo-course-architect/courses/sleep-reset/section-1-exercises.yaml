# Section 1: Sleep Science — Detailed Exercise Mapping
# Shows how Exercise Taxonomy applies to each lesson

lesson:
  id: l1
  title: "Welcome to Sleep School"
  duration_minutes: 5
  target_accuracy: 0.95
  emotional_arc: [warmup, introduce, cooldown]

  exercises:
    # WARM-UP (build confidence, 1 min)
    - id: l1_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 30
      scaffold_level: 1
      cards:
        - text: "Your sleep has 4 stages. Two are for deep repair (N3). Two are for dreams (REM)."
          visual_key: "sleep_stages_4boxes"
        - text: "Early night is mostly deep sleep. Late night is mostly dreams. Both matter."
          visual_key: "sleep_night_arc"
        - text: "This is why waking at 3am feels different from waking at 11pm — different brain states."
          visual_key: "timeline_sleep_stages"
      rules:
        - max_words_per_card: 40
        - max_cards: 3
        - auto_advance: false
      note: "Introductory passive education. User swipes at own pace. No right/wrong. Goal: familiarity + curiosity."

    # INTRODUCE (new concept, passive, 1.5 min)
    - id: l1_e2
      type: "multiple_choice"
      phase: "introduce"
      concept: "sleep_architecture"
      scaffold_level: 2
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Your brain has 4 sleep stages. Which description matches 'deep sleep' (N3)?"
      options:
        - text: "When your body repairs and grows — muscles, immune system, bone"
          correct: true
        - text: "When you dream and process emotions"
          correct: false
        - text: "When you're barely asleep, just drifting off"
          correct: false
      feedback_correct: "Exactly. N3 is deep sleep — that's when your body does its heavy restoration work."
      feedback_incorrect: "That's actually a different stage. N3 is deep sleep, when your body repairs itself — muscles, immune, bone."
      rules:
        - 3_options_for_easy: true
        - shuffle_options: true
        - show_explanation_always: true
      note: "Recognition task (easy). Introduces sleep_architecture with obvious distractors. Sets up why sleep stages matter."

    # CHALLENGE (test understanding, 2 min)
    - id: l1_e3
      type: "scenario"
      phase: "challenge"
      concept: "sleep_architecture"
      scaffold_level: 6
      difficulty: 0.20
      duration_seconds: 40
      scenario: "You wake at 3am. Your mind is racing — you're having vivid dreams or think you're in a dream. Earlier at 11pm you fell asleep deeply and didn't move."
      question: "What does this tell you?"
      options:
        - text: "At 11pm I was in deep sleep (N3). At 3am I'm in dream sleep (REM). Different brain states."
          correct: true
          feedback: "Yes! Early sleep is N3-heavy (deep). Late sleep is REM-heavy (dreams). That's why 3am waking feels like you're trapped in dream logic."
        - text: "I'm broken and will never sleep normally again"
          correct: false
          feedback: "Actually, this is completely normal. Your sleep is cycling exactly as it should. The 'trapped' feeling is because you're waking in REM (dream) mode, not deep sleep mode."
        - text: "I had a nightmare and that's why I'm awake"
          correct: false
          feedback: "Not necessarily. REM is *when* dreams happen, but dreams don't cause waking. More likely: something environmental (noise, temperature) woke you during your late-night REM cycle."
      rules:
        - realistic_scenario: true
        - plausible_distractors: true
        - feedback_explains_why: true
      note: "Application task. User applies newly-learned concept (early=N3, late=REM) to a personal relatable situation (3am waking). High relevance, low friction."

    # COOL-DOWN (reflection + next teaser, 1 min)
    - id: l1_e4
      type: "free_text"
      phase: "cooldown"
      concept: null
      scaffold_level: 5
      difficulty: 0.10
      duration_seconds: 45
      prompt: "Did this change how you understand your 3am or 5am waking?"
      min_words: 3
      max_words: 100
      placeholder: "E.g., 'I never knew my sleep cycles were this specific...'"
      is_scored: false
      note: "Personal reflection (no right/wrong). User consolidates understanding in own words. Prepares for l2."

    # MOOD CHECK (clinical data, end of lesson, 15 sec)
    - id: l1_e5
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "After learning about sleep stages, how do you feel?"
      scale: 5
      labels: ["Confused", "Uncertain", "Neutral", "Hopeful", "Empowered"]
      note_enabled: true
      comparison_note: null
      note: "Baseline mood measurement. Feeds into progress tracking and AI insights. Optional text note captures sentiment."

  completion_reward:
    xp: 12
    bonus_xp_if_accuracy_above_95: 3
    streak_increment: 1
  next_lesson_teaser: "Tomorrow: How your sleep cycles repeat all night — and why 3am waking is actually a normal pattern."

---

lesson:
  id: l2
  title: "The 90-Minute Cycle"
  duration_minutes: 9
  target_accuracy: 0.80
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    # WARM-UP (review l1, easy, 1.5 min)
    - id: l2_e1
      type: "multiple_choice"
      phase: "warmup"
      concept: "sleep_architecture"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Which stage happens mostly in early sleep?"
      options:
        - text: "N3 (deep sleep)"
          correct: true
        - text: "REM (dream sleep)"
          correct: false
        - text: "Both equally"
          correct: false
      feedback_correct: "Right. Remember: early night = N3 heavy, late night = REM heavy."
      feedback_incorrect: "Not quite. Early sleep is N3-heavy (deep). Late sleep is REM-heavy (dreams)."
      note: "Recall of l1 concept. Recognizes sleep_architecture. Builds confidence."

    # INTRODUCE (new concept: sleep cycles, 2 min)
    - id: l2_e2
      type: "learn_cards"
      phase: "introduce"
      concept: "sleep_cycles"
      scaffold_level: 1
      duration_seconds: 60
      cards:
        - text: "Your sleep doesn't stay in one stage all night. It cycles. First cycle: 70-100 minutes. Later cycles: 90-120 minutes."
          visual_key: "cycle_progression"
        - text: "Each cycle: light sleep → deep sleep → REM. Then repeat. Each repeat gets longer, with more REM."
          visual_key: "nrem_rem_cycle"
        - text: "By 5am-6am (after 4-5 cycles), you're mostly in REM (dreams). That's why late-night waking feels dream-like."
          visual_key: "timeline_rem_increasing"
      rules:
        - max_cards: 3
        - auto_advance: false
      note: "Introduce sleep_cycles with passive learning. User builds mental model: cycles get longer, REM increases."

    # CHALLENGE (understand cycle mechanism, 2 min)
    - id: l2_e3
      type: "ordering"
      phase: "challenge"
      concept: "sleep_cycles"
      scaffold_level: 4
      difficulty: 0.25
      duration_seconds: 50
      prompt: "Put these events in the order they happen during a typical night:"
      items:
        - "You're in deep sleep (N3), muscles repair"
        - "Your first REM cycle starts (dreams begin)"
        - "Later REM cycles get longer; N3 starts disappearing"
        - "You wake at 3-4am in REM; it feels dream-trapped"
      correct_order: [0, 1, 2, 3]
      partial_credit: true
      note: "Structural understanding. User sequences sleep cycle progression. Partial credit for adjacent correct pairs."

    # CHALLENGE (consolidate cycle understanding, 2 min)
    - id: l2_e4
      type: "true_false"
      phase: "challenge"
      concept: "sleep_cycles"
      scaffold_level: 3
      difficulty: 0.25
      duration_seconds: 30
      statement: "If you wake at 3am and can't fall back asleep, it's because you're broken or sick."
      correct: false
      explanation: "False. At 3am you're in a late-cycle REM sleep — dream mode. Waking then is completely normal if something disrupts you (sound, temperature, need to use bathroom). Your sleep isn't broken; you're just in a different brain state than at 11pm."
      note: "Misconception correction. Normalizes 3am waking as part of natural cycle, not pathology."

    # PEAK (apply cycles to personal situation, 2.5 min)
    - id: l2_e5
      type: "guided_journal"
      phase: "peak"
      concept: "sleep_cycles"
      scaffold_level: 5
      difficulty: 0.30
      duration_seconds: 90
      prompt: "Describe a time you woke at 3-5am. What time did you fall asleep? What time did you wake? Now you know: that's your sleep cycles happening exactly as they should."
      sub_prompts:
        - "I fell asleep around ___"
        - "I woke around ___"
        - "Now I understand that I was in [choose: early-cycle deep sleep, late-cycle REM/dreams]"
      min_words: 20
      max_words: 200
      mood_before: true
      mood_after: true
      tags: ["sleep_cycles", "3am_waking", "normalization"]
      note: "Personal application. User anchors cycle understanding to their own sleep pattern. Mood before/after captures shift from 'something is wrong' to 'this is normal.'"

    # CONSOLIDATE (mix review + new, 1.5 min)
    - id: l2_e6
      type: "multiple_choice"
      phase: "consolidate"
      concept: "sleep_cycles"
      scaffold_level: 3
      difficulty: 0.25
      duration_seconds: 25
      prompt: "A typical first sleep cycle lasts about ___ minutes. Later cycles last about ___ minutes."
      options:
        - text: "70-100 minutes first, 90-120 minutes later"
          correct: true
        - text: "Always 90 minutes"
          correct: false
        - text: "Variable, no pattern"
          correct: false
      feedback_correct: "Exactly. First cycle is shorter (70-100), later cycles lengthen (90-120). That's why a late-night waking at 3-4am might be after 2-3 full cycles."
      feedback_incorrect: "Close but not quite. First cycles are 70-100 min. Later cycles stretch to 90-120 min. This progression is why you might wake at different times on different nights."
      note: "Review of both l1 and l2. User consolidates cycle timing facts."

    # COOL-DOWN (reflection, 1 min)
    - id: l2_e7
      type: "slider_rating"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "How much sense does the 'sleep cycles explain 3am waking' idea make to you now?"
      min: 1
      max: 5
      labels: ["No sense yet", "A bit", "Makes some sense", "Makes a lot of sense", "Crystal clear!"]
      note: "Metacognitive check. User self-rates understanding. Data for adaptive difficulty."

    # COOL-DOWN (summary, 30 sec)
    - id: l2_e8
      type: "learn_cards"
      phase: "cooldown"
      concept: "sleep_cycles"
      scaffold_level: 1
      duration_seconds: 30
      cards:
        - text: "You just learned: sleep cycles get longer through the night. Early cycles = deep sleep. Late cycles = more dreams. Your 3am waking is biology, not brokenness."
          visual_key: "celebration_subtle"
      note: "Summary + celebration. Sets up l3 (circadian rhythm). Ends on success."

  completion_reward:
    xp: 18
    bonus_xp_if_accuracy_above_80: 5
    variable_reward_roll: true
  next_lesson_teaser: "Tomorrow: Your body has a 24-hour clock that controls WHEN you sleep. Find out why you crash at 11pm but feel wired at 10pm."

