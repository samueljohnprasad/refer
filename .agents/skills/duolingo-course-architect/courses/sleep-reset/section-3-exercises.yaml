section:
  id: s3_evening_architecture
  title: "Design Your Evening"
  outcome: "Build a flexible evening plan, test one practical change, and choose a fitting response when sleep does not arrive."
  exercise_inventory_count: 58
  selected_category_count: 17
  selection_rule: "Choose the smallest mechanic that proves the lesson objective; never add a type only for variety."

  selected_categories:
    - recall_warmup
    - intuition_check
    - curiosity_bet
    - concept_card
    - learn_cards
    - evening_comparison
    - same_but_different
    - lever_match
    - story_walkthrough
    - common_trap
    - lever_scenario
    - course_choice
    - private_check
    - teach_back_chain
    - if_then_plan
    - course_checkpoint
    - section_milestone

  safety_updates:
    - "Wind-down timing is a flexible range, not a rigid nightly test."
    - "Light guidance avoids universal effect sizes; brightness, spectrum, timing, duration, and distance all matter."
    - "Bedroom temperature and comfort are personalized; no universal temperature is scored as correct."
    - "Stimulus control uses sleepiness and frustration cues, not clock-watching."
    - "Sleep-window restriction is clinician-guided and is not prescribed in this self-guided section."
    - "Worry and journal content stays private and unscored."
    - "One good or bad night is never treated as proof that an evening change caused the result."

  units:
    - id: u3_1_wind_down
      title: "The Wind-Down Window"
      outcome: "Shape a flexible transition from daytime activity to sleep-supporting conditions."
      lessons:
        - id: l19
          title: "The 90-Minute Switch"
          outcome: "Build a realistic wind-down range with one repeatable transition cue."
          exercises:
            - {
                id: l19_e1,
                type: recall_warmup,
                purpose: "Retrieve body-downshift ideas from Section 2.",
                scoring: unscored,
              }
            - {
                id: l19_e2,
                type: evening_comparison,
                purpose: "Contrast an abrupt evening with a buffered transition.",
                scoring: unscored,
              }
            - {
                id: l19_e3,
                type: concept_card,
                purpose: "Correct the rigid ninety-minute rule misconception.",
                scoring: unscored,
              }
            - {
                id: l19_e4,
                type: lever_scenario,
                purpose: "Choose a workable range in changed schedules.",
                scoring: objective,
              }
            - {
                id: l19_e5,
                type: if_then_plan,
                purpose: "Create one private transition plan.",
                scoring: unscored,
              }

        - id: l20
          title: "Light Is Information"
          outcome: "Reduce the most changeable evening light exposure without treating color filters as a complete shield."
          exercises:
            - {
                id: l20_e1,
                type: curiosity_bet,
                purpose: "Commit to a brightness-versus-color prediction.",
                scoring: unscored,
              }
            - {
                id: l20_e2,
                type: concept_card,
                purpose: "Model the cautious light rule.",
                scoring: unscored,
              }
            - {
                id: l20_e3,
                type: same_but_different,
                purpose: "Distinguish brightness reduction from spectrum change.",
                scoring: unscored,
              }
            - {
                id: l20_e4,
                type: course_choice,
                purpose: "Apply the rule to necessary late screen use.",
                scoring: objective,
              }
            - {
                id: l20_e5,
                type: if_then_plan,
                purpose: "Choose one accessible dimming action.",
                scoring: unscored,
              }

        - id: l21
          title: "Your Sleep Environment Audit"
          outcome: "Identify the largest repeatable bedroom disturbance and choose one practical experiment."
          exercises:
            - {
                id: l21_e1,
                type: recall_warmup,
                purpose: "Retrieve light and flexible wind-down rules.",
                scoring: unscored,
              }
            - {
                id: l21_e2,
                type: learn_cards,
                purpose: "Model five adjustable environment dimensions.",
                scoring: unscored,
              }
            - {
                id: l21_e3,
                type: lever_match,
                purpose: "Match disturbances with practical responses.",
                scoring: objective,
              }
            - {
                id: l21_e4,
                type: private_check,
                purpose: "Audit the learner's room without storing disclosure.",
                scoring: unscored,
              }
            - {
                id: l21_e5,
                type: if_then_plan,
                purpose: "Plan one low-cost environment experiment.",
                scoring: unscored,
              }

    - id: u3_2_pre_sleep_practices
      title: "Clearing the Mind Before Bed"
      outcome: "Protect the bed-sleep association, move unfinished thinking outside bed, and evaluate one evening change."
      lessons:
        - id: l22
          title: "The Bed-Sleep Connection"
          outcome: "Apply stimulus control and recognize when sleep-window treatment needs trained support."
          exercises:
            - {
                id: l22_e1,
                type: intuition_check,
                purpose: "Surface the urge to stay in bed and force sleep.",
                scoring: unscored,
              }
            - {
                id: l22_e2,
                type: concept_card,
                purpose: "Teach bed as a cue for sleep rather than effort.",
                scoring: unscored,
              }
            - {
                id: l22_e3,
                type: story_walkthrough,
                purpose: "Model leaving and returning by sleepiness cues.",
                scoring: unscored,
              }
            - {
                id: l22_e4,
                type: lever_scenario,
                purpose: "Apply stimulus control with accessibility and safety variants.",
                scoring: objective,
              }
            - {
                id: l22_e5,
                type: if_then_plan,
                purpose: "Choose a safe quiet place and activity.",
                scoring: unscored,
              }

        - id: l23
          title: "The Worry Dump"
          outcome: "Move unfinished thoughts onto paper before bed without solving or scoring them."
          exercises:
            - {
                id: l23_e1,
                type: recall_warmup,
                purpose: "Retrieve the bed-sleep association rule.",
                scoring: unscored,
              }
            - {
                id: l23_e2,
                type: common_trap,
                purpose: "Contrast mental rehearsal in bed with externalizing earlier.",
                scoring: unscored,
              }
            - {
                id: l23_e3,
                type: learn_cards,
                purpose: "Model a short capture-close-return process.",
                scoring: unscored,
              }
            - {
                id: l23_e4,
                type: private_check,
                purpose: "Guide an offline worry dump without storing its content.",
                scoring: unscored,
              }
            - {
                id: l23_e5,
                type: course_choice,
                purpose: "Choose when and how to use the tool.",
                scoring: objective,
              }

        - id: l24
          title: "Pre-Sleep Journaling (Optional)"
          outcome: "Distinguish optional reflection from the core worry-dump tool and choose freely."
          exercises:
            - {
                id: l24_e1,
                type: same_but_different,
                purpose: "Separate clearing from optional reflection.",
                scoring: unscored,
              }
            - {
                id: l24_e2,
                type: learn_cards,
                purpose: "Model a brief gratitude-and-intention ritual.",
                scoring: unscored,
              }
            - {
                id: l24_e3,
                type: intuition_check,
                purpose: "Check personal fit without judgment.",
                scoring: unscored,
              }
            - {
                id: l24_e4,
                type: private_check,
                purpose: "Offer offline practice without storing journal text.",
                scoring: unscored,
              }
            - {
                id: l24_e5,
                type: course_choice,
                purpose: "Correct the belief that journaling is required for sleep.",
                scoring: objective,
              }

        - id: l25
          title: "Test One Change at a Time"
          outcome: "Choose one safe evening change and judge it from a pattern across several comparable nights."
          exercises:
            - {
                id: l25_e1,
                type: recall_warmup,
                purpose: "Retrieve the one-change rule from the environment audit.",
                scoring: unscored,
              }
            - {
                id: l25_e2,
                type: common_trap,
                purpose: "Expose why changing everything at once hides what helped.",
                scoring: unscored,
              }
            - {
                id: l25_e3,
                type: learn_cards,
                purpose: "Model choose, observe, compare, and decide.",
                scoring: unscored,
              }
            - {
                id: l25_e4,
                type: course_choice,
                purpose: "Reject a one-night causal conclusion in a changed context.",
                scoring: objective,
              }
            - {
                id: l25_e5,
                type: if_then_plan,
                purpose: "Choose one private, low-risk evening experiment.",
                scoring: unscored,
              }

        - id: l26
          title: "Evening Architecture Checkpoint"
          outcome: "Explain the evening system, build a flexible plan, and name one change to test."
          exercises:
            - {
                id: l26_e1,
                type: recall_warmup,
                purpose: "Retrieve the complete evening map.",
                scoring: unscored,
              }
            - {
                id: l26_e2,
                type: teach_back_chain,
                purpose: "Reconstruct the causal evening sequence.",
                scoring: objective,
              }
            - {
                id: l26_e3,
                type: course_checkpoint,
                purpose: "Transfer the rules across six changed situations.",
                scoring: objective,
              }
            - {
                id: l26_e4,
                type: if_then_plan,
                purpose: "Build the learner's private evening plan.",
                scoring: unscored,
              }
            - {
                id: l26_e5,
                type: section_milestone,
                purpose: "Award Evening Architect after demonstrated review.",
                scoring: unscored,
              }

  validation:
    objective_coverage: pass
    prerequisite_order: pass
    retrieval_coverage: pass
    session_budget: pass
    accessibility: pass
    safety: pass
    notes:
      - "Every lesson uses five exercises; each action serves a distinct objective."
      - "Personal disclosure never contributes to accuracy or mastery."
      - "Full content contracts live in section-3 JavaScript lesson modules."
