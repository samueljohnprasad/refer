# Lessons l22-l25 (Stimulus Control, Worry Dump, Pre-sleep Journaling, Checkpoint)
# l22: Stimulus Control + Sleep Restriction → learn_cards + CBT-I core explanation + scenario (get up after 20 min) + free_text commitment
# l23: Worry Dump (Borkovec) → learn_cards + guided practice (write 5 worries) + scenario (when to use) + mood_check
# l24: Pre-sleep Journaling (optional) → learn_cards + guided practice (gratitude + intention) + free_text (does this resonate?)
# l25: Checkpoint → quick review quiz (stimulus control, worry dump, environment, wind-down), scenario-based (build personal wind-down plan), badge "Evening Architect"
