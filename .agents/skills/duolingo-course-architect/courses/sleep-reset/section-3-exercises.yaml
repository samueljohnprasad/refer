lesson:
  id: l21
  title: "Your Sleep Environment Audit"
  duration_minutes: 11
  target_accuracy: 0.80
  emotional_arc: [warmup, introduce, challenge, peak, consolidate, cooldown]

  exercises:
    - id: l21_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 40
      cards:
        - text: "Sleep environment = temperature, light, sound, texture. Your brain uses these as signals."
          visual_key: "environment_4_factors"
        - text: "Cool (65-68°F) = 'go to sleep.' Dark = 'melatonin time.' Quiet = 'safe.' Soft = 'rest.'"
          visual_key: "optimal_sleep_env"
      note: "Intro to sleep_environment. Four levers."

    - id: l21_e2
      type: "matching"
      phase: "introduce"
      concept: "sleep_environment"
      scaffold_level: 2
      difficulty: 0.18
      duration_seconds: 45
      prompt: "Match each environmental factor to what it signals:"
      pairs:
        - left: "Cool temperature (65-68°F)"
          right: "'Go to sleep' — core temp drops"
        - left: "Darkness"
          right: "'Melatonin time' — circadian signal"
        - left: "Quiet or white noise"
          right: "'We're safe' — no threats"
        - left: "Soft textures"
          right: "'Rest mode' — comfort signal"
      note: "Recognize environment-to-signal mapping."

    - id: l21_e3
      type: "scenario"
      phase: "challenge"
      concept: "sleep_environment"
      scaffold_level: 5
      difficulty: 0.25
      duration_seconds: 50
      scenario: "Your bedroom is warm (72°F), has ambient light from the hallway, and you can hear traffic outside. You're struggling to fall asleep."
      question: "What environmental signals are you sending your brain?"
      options:
        - text: "'Stay alert' — warmth, light, and noise all signal 'this is not sleep time'"
          correct: true
          feedback: "Exactly. Your environment is saying 'stay awake.' You need to optimize: cool it down, darken it, and quiet it."
        - text: "'Time to sleep' — this environment is perfect"
          correct: false
          feedback: "Actually, this environment is sending 'stay alert' signals. Warmth, light, and noise all keep your nervous system on."
        - text: "Environment doesn't matter for sleep"
          correct: false
          feedback: "Environment matters a lot. It's one of the top levers for signaling sleep or wakefulness."
      note: "Application. User recognizes their own environmental barriers."

    - id: l21_e4
      type: "free_text"
      phase: "peak"
      duration_seconds: 90
      prompt: "Audit your bedroom on each dimension. Rate each (poor/okay/good), then identify 1-2 fixes you can make this week."
      sub_prompts:
        - "Temperature: How does your room feel? (Poor/Okay/Good)"
        - "Light: Is your room dark enough? (Poor/Okay/Good)"
        - "Sound: Is it quiet or do you hear noise/traffic? (Poor/Okay/Good)"
        - "Comfort: How comfortable is your mattress/pillows? (Poor/Okay/Good)"
        - "1-2 fixes you could implement: (e.g., blackout curtains, turn down heat, earplugs)"
      min_words: 30
      max_words: 200
      is_scored: false
      note: "Hands-on audit. User prioritizes environmental changes."

    - id: l21_e5
      type: "multiple_choice"
      phase: "consolidate"
      concept: "sleep_environment"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "Which is most important if you can only fix one thing?"
      options:
        - text: "Temperature (65-68°F cool is your body's sleep signal)"
          correct: true
        - text: "Light"
          correct: false
        - text: "Sound"
          correct: false
      feedback_correct: "Cool temperature is the strongest biological signal. Start there."
      note: "Priority guidance. Prevents user overwhelm."

    - id: l21_e6
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "After this audit, how hopeful do you feel about improving your sleep environment?"
      scale: 5
      labels: ["Not at all", "Slightly", "Moderate", "Hopeful", "Very hopeful"]
      note: "Motivation check."

  completion_reward:
    xp: 16
    bonus_xp_if_accuracy_above_80: 5
    variable_reward_roll: true
  next_lesson_teaser: "Tomorrow: The Bed-Sleep Connection — stimulus control and sleep restriction."

