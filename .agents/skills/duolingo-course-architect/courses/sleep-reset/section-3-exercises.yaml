# Section 3: Evening Architecture — Exercise Mapping (l19-l25)
# Wind-down, environment, stimulus control, worry dump

lesson:
  id: l19
  title: "The 90-Minute Switch"
  duration_minutes: 9
  target_accuracy: 0.88
  emotional_arc: [warmup, introduce, challenge, peak, cooldown]

  exercises:
    - id: l19_e1
      type: "learn_cards"
      phase: "warmup"
      duration_seconds: 45
      scaffold_level: 1
      cards:
        - text: "Wind-down window = 60-90 minutes before bed. Shift from day (tasks, bright light) to night (calm, dim)."
          visual_key: "wind_down_timeline"
        - text: "During this window, your circadian alert is dropping, adenosine is rising. Your body needs time to catch up."
          visual_key: "circadian_process_overlap"
        - text: "If you jump from emails at 10:45pm to bed at 11pm, your nervous system stays ON — too fast a transition."
          visual_key: "too_fast_transition"
      note: "Intro to wind_down_window. Why it matters + timing."

    - id: l19_e2
      type: "multiple_choice"
      phase: "introduce"
      concept: "wind_down_window"
      scaffold_level: 2
      difficulty: 0.15
      duration_seconds: 20
      prompt: "What is the main benefit of a 60-90 minute wind-down window?"
      options:
        - text: "Gives your nervous system time to shift from ON to OFF as circadian alert drops"
          correct: true
        - text: "Guarantees you'll fall asleep immediately"
          correct: false
        - text: "Reduces the amount of sleep you need"
          correct: false
      feedback_correct: "Exactly. You're giving your body time to downshift. It's not forced sleep; it's preparation."
      feedback_incorrect: "Not quite. Wind-down is about giving your body TIME to transition, not guaranteeing instant sleep."
      note: "Recognizes purpose of wind-down window."

    - id: l19_e3
      type: "scenario"
      phase: "challenge"
      concept: "wind_down_window"
      scaffold_level: 5
      difficulty: 0.22
      duration_seconds: 45
      scenario: "You work late, finish at 10:50pm, then immediately try to sleep at 11pm. You're still thinking about work, mind racing."
      question: "What would help?"
      options:
        - text: "A 60-90 minute wind-down window. Start around 9:30-10pm: finish work, dim lights, no screens."
          correct: true
          feedback: "Yes. Your nervous system needs time to shift. Jumping from work to bed doesn't give it that time."
        - text: "Just trying harder to fall asleep"
          correct: false
          feedback: "That would just increase effort-related hyperarousal (remember l26?). You need actual downtime."
        - text: "Sleeping longer the next night"
          correct: false
          feedback: "That doesn't help tonight. You need to give your nervous system a transition period NOW."
      note: "Application to personal schedule conflict. User plans their own wind-down."

    - id: l19_e4
      type: "free_text"
      phase: "peak"
      concept: "wind_down_window"
      duration_seconds: 60
      prompt: "What time does your work/stress usually end? When could you realistically start wind-down? (Remember: it's a RANGE like 9-10pm, not rigid.)"
      min_words: 10
      max_words: 100
      is_scored: false
      note: "Personal planning. User designs their wind-down timing. Emphasizes RANGE not rigid timing."

    - id: l19_e5
      type: "mood_check"
      phase: "cooldown"
      duration_seconds: 15
      prompt: "Does this wind-down window idea feel doable for your schedule?"
      scale: 5
      labels: ["Not at all", "Maybe", "Could work", "Likely", "Yes, definitely"]
      note: "Feasibility check. Informs user adherence expectation."

  completion_reward:
    xp: 14
    bonus_xp_if_accuracy_above_88: 4
  next_lesson_teaser: "Tomorrow: Light controls sleep. Learn why brightness matters more than blue light color."

