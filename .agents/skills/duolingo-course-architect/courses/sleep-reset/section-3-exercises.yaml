lesson:
  id: l20
  title: "Light Is Information"
  duration_minutes: 10
  target_accuracy: 0.82
  emotional_arc: [warmup, introduce, challenge, peak, cooldown]

  exercises:
    - id: l20_e1
      type: "multiple_choice"
      phase: "warmup"
      concept: "circadian_rhythm"
      scaffold_level: 3
      difficulty: 0.15
      duration_seconds: 20
      prompt: "What does brightness signal to your brain?"
      options:
        - text: "Daytime = stay alert, block melatonin"
          correct: true
        - text: "Nighttime = time to sleep"
          correct: false
      feedback_correct: "Right. Bright light = daytime signal."
      note: "Recall of circadian rhythm concept from S1."

    - id: l20_e2
      type: "learn_cards"
      phase: "introduce"
      concept: "light_and_sleep"
      scaffold_level: 1
      duration_seconds: 50
      cards:
        - text: "Blue light (~460nm) suppresses melatonin most efficiently. At 10pm, a bright screen says 'it's 10am' to your brain."
          visual_key: "blue_light_wavelength"
        - text: "BUT: Total brightness matters 100x more than color. Dimming to minimum reduces effect far more than orange glasses."
          visual_key: "brightness_vs_color_comparison"
        - text: "Strategy: Dim all lights first. Blue-light glasses are helpful but secondary."
          visual_key: "dim_lights_priority"
      note: "Introduce light_and_sleep. Corrects common misconception (blue light > brightness)."

    - id: l20_e3
      type: "true_false"
      phase: "challenge"
      concept: "light_and_sleep"
      scaffold_level: 3
      difficulty: 0.18
      duration_seconds: 25
      statement: "Blue-light glasses on a bright screen at 10pm are more effective at preserving melatonin than dimming the screen to minimum."
      correct: false
      explanation: "False. Dimming the screen to minimum reduces melatonin suppression to <1% of full brightness. Blue-light filters on a bright screen reduce it only 67%. Brightness >> color."
      note: "Evidence-based misconception correction. Builds trust."

    - id: l20_e4
      type: "scenario"
      phase: "peak"
      concept: "light_and_sleep"
      scaffold_level: 5
      duration_seconds: 45
      scenario: "At 9:30pm you're about to wind down. You want to check one email on your phone. What's the best approach?"
      options:
        - text: "Dim phone to minimum brightness (or turn on Night Shift), then use it. Much better than keeping it bright."
          correct: true
          feedback: "Exactly. If you must use a screen during wind-down, dimming is the key lever."
        - text: "Keep full brightness and use blue-light glasses"
          correct: false
          feedback: "Brightness is what matters most. Dim first; glasses are optional bonus."
        - text: "Avoid screens entirely"
          correct: false
          feedback: "Ideal, but not always realistic. If you use a screen, dimming is the lever that works."
      note: "Real-world trade-off. User applies light_and_sleep to practical scenario."

    - id: l20_e5
      type: "free_text"
      phase: "cooldown"
      duration_seconds: 45
      prompt: "What's one thing you could dim or turn off during your wind-down window? (Lights, screens, etc.)"
      min_words: 5
      max_words: 80
      is_scored: false
      note: "Actionable planning. User identifies personal light change."

  completion_reward:
    xp: 15
    bonus_xp_if_accuracy_above_82: 4
  next_lesson_teaser: "Tomorrow: Your sleep environment audit — temperature, darkness, sound, comfort."

