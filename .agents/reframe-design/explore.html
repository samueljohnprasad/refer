<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thought Reframing: three directions, core screen</title>
<link rel="stylesheet" href="../skills/mobile-app-ui-design/assets/device.css">
<style>
/* Core screen = "How believable does it feel?" (step 3 of 9). Same content in all three. */
.screen{font-family:var(--sf);display:flex;flex-direction:column;padding:var(--safe-top) 24px var(--safe-bottom)}
.nav{display:flex;justify-content:space-between;align-items:center;height:44px;margin:0 -8px}
.nav button{all:unset;width:44px;height:44px;display:grid;place-items:center}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav span{font-size:13px;font-weight:500}
.cta{all:unset;box-sizing:border-box;height:56px;border-radius:28px;display:grid;place-items:center;font-size:17px;font-weight:600;width:100%}

/* ===== A. Tide gauge: place/nature, light, serif, teal, illustration ===== */
#a{--ground:#E4ECEE;--ink:#0D2B33;--ink2:#47626A;--deep:#0F5A64;--mid:#2F8E98;--on-deep:#EAF4F5;
  background:var(--ground);color:var(--ink);padding-bottom:0}
#a .top{position:relative;z-index:2;flex:none}
#a .step{color:var(--ink2)}
#a h1{font:600 30px/1.1 var(--ny);letter-spacing:-.015em;margin:16px 0 14px}
#a .thought{font:italic 400 19px/1.35 var(--ny);color:var(--ink2);margin:0;max-width:300px}
#a .num{position:absolute;z-index:2;left:24px;top:318px;font:600 168px/0.8 var(--ny);letter-spacing:-.04em;color:var(--on-deep)}
#a .num small{font:500 22px var(--sf);letter-spacing:0;margin-left:8px;opacity:.8}
#a .sea{position:absolute;left:0;right:0;bottom:0;top:300px;z-index:1}
#a .sea svg{width:100%;height:100%;display:block}
#a .low{position:absolute;z-index:2;left:24px;right:24px;bottom:calc(var(--safe-bottom) + 8px)}
#a .cta{background:var(--on-deep);color:var(--deep)}
#a .scale{position:absolute;z-index:2;right:24px;top:318px;bottom:150px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font:500 12px var(--sf);color:var(--on-deep);font-variant-numeric:tabular-nums}
#a .scale i{display:block;height:1px;width:14px;background:currentColor;opacity:.6;margin-top:6px}
#a .scale i.m{width:24px;opacity:1}
#a .scale b{font-weight:600;color:var(--ink);background:var(--on-deep);border-radius:8px;padding:2px 8px}
#a .hint{position:absolute;z-index:2;left:24px;top:500px;font:500 15px/1.3 var(--sf);color:var(--on-deep);opacity:.85;max-width:210px}

/* ===== B. Orbit: place (planetarium), dark, expanded, amber, shape ===== */
#b{--ground:#0A0F1E;--ink:#EEF1F8;--ink2:#9AA3BA;--line:rgba(238,241,248,.16);--amber:#FFB524;--on-amber:#1A1200;
  background:var(--ground);color:var(--ink)}


  
#b .step{color:var(--ink2)}
#b h1{font:800 28px/1.08 var(--sf);font-stretch:130%;letter-spacing:-.02em;margin:16px 0 12px}
#b .thought{font:400 17px/1.4 var(--sf);color:var(--ink2);margin:0}
#b .dial{position:relative;flex:1;min-height:0;margin:8px -24px 0}
#b .dial svg{position:absolute;inset:0;width:100%;height:100%}
#b .num{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;font:800 112px/1 var(--sf);font-stretch:140%;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#b .num small{display:block;font:500 15px var(--sf);font-stretch:100%;letter-spacing:0;color:var(--ink2);margin-top:6px}
#b .cta{background:var(--amber);color:var(--on-amber)}

/* ===== C. Gel: media (stage-lighting gels), colour field, condensed, red-orange ===== */
#c{--ground:#FF4A2A;--ink:#150905;--paper:#FFF4EC;--gel-y:#FFC21A;--gel-r:#E5163A;
  background:var(--ground);color:var(--ink);overflow:hidden}
#c .gels{position:absolute;inset:0;z-index:0;pointer-events:none}
#c .gels i{position:absolute;border-radius:50%;mix-blend-mode:multiply}
#c .gels .y{width:360px;height:360px;right:-120px;top:-100px;background:var(--gel-y)}
#c .gels .r{width:300px;height:300px;right:70px;top:-150px;background:var(--gel-r)}
#c .top,#c .low,#c .mid{position:relative;z-index:1}
#c .step{color:var(--ink)}
#c h1{font:800 40px/.98 var(--sf);font-stretch:70%;letter-spacing:-.01em;margin:20px 0 12px;max-width:290px}
#c .thought{font:500 17px/1.35 var(--sf);margin:0;max-width:300px}
#c .mid{flex:1;display:flex;align-items:flex-end}
#c .num{font:900 300px/.74 var(--sf);font-stretch:60%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-left:-8px}
#c .num small{font:700 28px var(--sf);font-stretch:100%;letter-spacing:0;margin-left:8px}
#c .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:20px 0 20px}
#c .bar i{height:28px;border-radius:6px;border:2px solid var(--ink)}
#c .bar i.f{background:var(--ink)}
#c .cta{background:var(--ink);color:var(--ground)}
</style></head>
<body>

<!-- A -->
<section class="screen" id="a" data-name="a-tide" data-time="14:08">
  <div class="top">
    <div class="nav"><button aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="step">3 of 9</span><button aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h1>How believable does it feel?</h1>
    <p class="thought">“I always freeze when I present.”</p>
  </div>
  <div class="sea"><svg viewBox="0 0 402 574" preserveAspectRatio="none" aria-hidden="true">
    <path style="fill:var(--mid)" d="M0 40C60 20 110 52 170 36S300 16 402 38V574H0Z"/>
    <path style="fill:var(--deep)" d="M0 66C70 50 120 78 190 62S320 46 402 68V574H0Z"/>
  </svg></div>
  <div class="num" aria-label="8 out of 10">8<small>/10</small></div>
  <p class="hint">Tide is high. Drag to where it sits right now.</p>
  <div class="scale" aria-hidden="true"><span>10<i></i></span><span><b>8</b></span><span>5<i class="m"></i></span><span>0<i></i></span></div>
  <div class="low"><button class="cta">Continue</button></div>
</section>

<!-- B -->
<section class="screen" id="b" data-name="b-orbit" data-theme="dark" data-chrome="light" data-time="14:08">
  <div class="nav"><button aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="step">3 of 9</span><button aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <h1>How believable does it feel?</h1>
  <p class="thought">“I always freeze when I present.”</p>
  <div class="dial">
    <svg viewBox="0 0 402 440" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g fill="none" style="stroke:var(--line)" stroke-width="1">
        <circle cx="201" cy="230" r="70"/><circle cx="201" cy="230" r="118"/><circle cx="201" cy="230" r="166"/>
        <line x1="201" y1="38" x2="201" y2="62"/><line x1="201" y1="398" x2="201" y2="422"/>
      </g>
      <path d="M201 64A166 166 0 1 1 79 342" fill="none" style="stroke:var(--amber)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="79" cy="342" r="14" style="fill:var(--amber)"/>
      <circle cx="79" cy="342" r="5" style="fill:var(--ground)"/>
    </svg>
    <div class="num">8<small>out of 10</small></div>
  </div>
  <button class="cta">Continue</button>
</section>

<!-- C -->
<section class="screen" id="c" data-name="c-gel" data-time="14:08">
  <div class="gels" aria-hidden="true"><i class="y"></i><i class="r"></i></div>
  <div class="top">
    <div class="nav"><button aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="step">3 of 9</span><button aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h1>How believable does it feel?</h1>
    <p class="thought">“I always freeze when I present.”</p>
  </div>
  <div class="mid"><div class="num" aria-label="8 out of 10">8<small>/10</small></div></div>
  <div class="low">
    <div class="bar" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div>
    <button class="cta">Continue</button>
  </div>
</section>

<script src="../skills/mobile-app-ui-design/assets/device.js"></script>
</body></html>
