<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Welcome to Happy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  /* Happi says hello, goal pick, "does this sound like you", then one Thought Catcher chat ending on a saved card
     with the reminder asked inside it, right after the first value. No plan, pledge or permission step.
     Spec: _bmad-output/initiative-happy-product-direction/ux-onboarding-and-day-0/EXPERIENCE.md
     Motion: .agents/skills/rossark-motion-skill. Guide: the production Happi rig plus a thought cloud prop.
     One main beat per screen; on S2 it is the sky clearing as the reframe lands.
     Production handoff (what maps to which Expo file): .agents/onboarding-handoff.md */
  :root{
    --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
    --r-s:12px;--r-m:16px;--r-pill:999px;--tap:44px;
    --t-cap:12px;--t-foot:13px;--t-sub:15px;--t-body:17px;--t-lead:20px;--t-h:24px;--t-title:28px;--t-num:34px;
    --dur:.28s;--ease:cubic-bezier(.32,.72,0,1);
    --travel:cubic-bezier(.77,0,.175,1);--open:cubic-bezier(.23,1,.32,1);
    --font:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;
    --bg:#fff;--surface:#fff;--surface-2:#f7f7f7;--tint:#f2f8ef;--sun:#f5b942;--cloud-lo:#e4eee0;--cloud-hi:#a9bfa0;
    --label:#142414;--label-2:#4b4b4b;--label-3:#767676;
    --sep:#e5e5e5;--rim:#cfcfcf;
    --accent:#44633f;--on-accent:#fff;--ink:#5f7f58;--on-ink:#fff;
    --bw:2px;
    color-scheme:light;
  }
  @media (prefers-contrast:more){:root{--sep:currentColor;--label-3:var(--label-2)}}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{font-size:17px}
  body{font-family:var(--font);background:var(--bg);color:var(--label);min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;line-height:1.35}
  #app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
  @media (min-width:600px){
    body{align-items:center;background:#d9d8d3}
    #app{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;box-shadow:0 0 0 10px #142414}
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;gap:var(--sp-3);padding:calc(var(--sp-2) + env(safe-area-inset-top)) var(--sp-3) 0;min-height:52px}
  .icon-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;background:none;border:0;border-radius:var(--r-pill);color:var(--label)}
  .icon-btn:active{transform:scale(.92)}
  /* one track from the goal pick to Saved, nudged by every answer (Duolingo, BitePal, Ahead) */
  .bar{flex:1;position:relative;height:14px;border-radius:var(--r-pill);background:var(--sep);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:calc(var(--fill,0)*100%);min-width:14px;border-radius:inherit;background:var(--accent);transition:width .5s var(--open)}
  .bar i::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)} /* Duolingo's sheen */
  .spacer{width:var(--tap)}

  main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 var(--sp-4) var(--sp-5)}
  main::-webkit-scrollbar{display:none}
  footer{padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);
    -webkit-backdrop-filter:blur(var(--sp-5)) saturate(1.4);backdrop-filter:blur(var(--sp-5)) saturate(1.4)}
  footer:empty{display:none}
  h1{font-size:var(--t-title);line-height:1.1;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
  .lede{margin-top:var(--sp-2);font-size:var(--t-lead);font-weight:500;color:var(--label-2)}

  /* ===== S0: Happi says hello (Gentler Streak, Finch, Alan open with the character) ===== */
  .s0{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:var(--sp-7);animation:fade .3s var(--ease) both}
  .s0 .host{width:220px;margin-top:var(--sp-2)}
  .s0 h1{margin-top:var(--sp-5)}
  .s0 .scope0{margin-top:var(--sp-3);max-width:30ch;font-size:var(--t-foot);color:var(--label-2)}
  .btn+.link{margin-top:var(--sp-2)}

  /* ===== S1: goal pick ===== */
  .s1{padding-top:var(--sp-3);animation:fade .3s var(--ease) both}
  .s1 .sky{width:200px;margin:0 0 var(--sp-3) -6px}
  /* one list of rows, like Duolingo's and Finch's goal pickers; the head is the only colour */
  .goals{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-5)}
  /* white card, 2px rim and a 3px rim underneath (Duolingo, BitePal): tactile, and the tinted head tile is the colour */
  .goal{position:relative;display:flex;align-items:center;gap:var(--sp-3);min-height:76px;padding:var(--sp-2) var(--sp-6) var(--sp-2) var(--sp-2);text-align:left;border:2px solid var(--sep);border-radius:20px;background:var(--surface);box-shadow:0 3px 0 var(--sep);font-size:var(--t-body);font-weight:700;transition:transform .12s var(--open),background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);animation:drop .45s var(--open) both}
  .goal:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sep)}
  .goal.on{background:var(--tint);border-color:var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--accent)}
  .goal small{display:block;font-size:var(--t-sub);font-weight:500;color:var(--label-2);margin-top:2px}
  .goal .gi{flex:none;width:58px;height:58px;display:grid;place-items:center;padding:5px;border-radius:16px;background:var(--g,var(--surface-2))}
  .goal .gi svg{width:100%;height:100%;overflow:hidden}
  .link+.link{margin-top:0}
  .link{display:block;margin:var(--sp-5) auto 0;background:none;border:0;min-height:var(--tap);padding:0 var(--sp-3);font-size:var(--t-foot);font-weight:700;color:var(--label-3);text-decoration:underline;text-underline-offset:3px}

  /* ===== S2: the chat ===== */
  /* one cloud for the whole conversation, sticky at the top; its weather is the thought's weight */
  .stage{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:var(--sp-1) var(--sp-6) var(--sp-2) 0;
    background:var(--bg)}
  .stage::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 0%,transparent))}
  .stage .sky{width:132px;margin:0}
  .stage{transition:opacity .25s var(--open),transform .25s var(--open)}
  .stage.gone{display:none}
  /* the reaction beat (BitePal, Duolingo, Ahead): Happi large in the pose of what you picked, its line in a bubble above,
     then on "Show me" Happi travels to the chat's corner and the line becomes the chat's first message */
  .stage.hero{position:static;overflow-x:clip;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding:0 0 var(--sp-5)}
  .stage.hero::after,.stage.hero .speech{display:none}
  .stage.hero .host{width:228px;transform:translateX(14%)} /* the rig's viewBox carries the weather cloud on the right: this centres the panda under the tail */
  .stage.hero:has(.host[hidden]) .say::after{display:none} /* after a crisis match Happi stays gone, so the line has no one to point at */
  .stage .say{position:relative;max-width:300px;margin-bottom:var(--sp-4);padding:var(--sp-3) var(--sp-4);border:2px solid var(--sep);border-radius:20px;background:var(--surface);
    font-size:22px;line-height:1.25;text-align:center;animation:say .25s var(--open) .12s both}
  .stage .say::after{content:"";position:absolute;left:calc(50% - 6px);bottom:-8px;width:12px;height:12px;background:var(--surface);border:2px solid var(--sep);border-top:0;border-left:0;transform:rotate(45deg)}
  /* the worked example opens on its scene, drawn in the exercise-art style on the goal's tint (Finch, BitePal, How We Feel) */
  .scene{align-self:stretch;margin:var(--sp-1) 0 var(--sp-3);border-radius:24px;overflow:hidden;background:var(--g);box-shadow:0 3px 0 color-mix(in srgb,var(--g),var(--label) 12%);animation:rise .3s var(--open) both}
  .scene svg{display:block;width:100%;height:auto;padding:var(--sp-3) var(--sp-3) 0}
  .scene figcaption{padding:var(--sp-1) var(--sp-4) var(--sp-4);font-weight:700;line-height:1.3}
  .stage.aside{pointer-events:none;opacity:0;transform:scale(.96);transition-duration:.2s;transition-timing-function:ease-in} /* stepping aside: no face watches you write */
  .thread{display:flex;flex-direction:column}
  .bub{align-self:flex-start;max-width:88%;background:var(--tint);border-radius:4px var(--r-m) var(--r-m) var(--r-m);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);font-weight:500;line-height:1.4;color:var(--label);animation:say .22s var(--open) both}
  .msg+.me,.me+.msg,.keep+.msg{margin-top:var(--sp-3)}
  /* chat lines are the app talking, so they carry no face; Happi speaks in its own bubble on the stage */
  .msg{display:flex;align-items:flex-end;gap:var(--sp-2);align-self:flex-start;max-width:94%;margin-bottom:var(--sp-2)}
  .msg .bub,.msg .typing{margin:0;max-width:none}
  .bub em{font-style:normal;font-weight:700;color:var(--accent)}
  /* Happi speaks in sentences, no labels inside bubbles. One visual idea runs through the whole chat and
     into the saved card and My Log: hollow dot = the thought as it showed up, filled dot = the other view. */
  .bub .pt{position:relative;display:block;margin-top:var(--sp-2);padding-left:22px;font-size:var(--t-lead);font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .bub .pt::before{content:"";position:absolute;left:0;top:7px;width:11px;height:11px;border-radius:50%;box-sizing:border-box;background:var(--ink)}
  .bub q.pt{quotes:none} /* ::before is the dot, so open-quote would be lost; quotes are literal in the text */
  .bub q.pt::before{background:#fff;border:2px solid var(--ink)}
  .bub .why{display:block;margin-top:var(--sp-2);color:var(--label-2)}
  .blank{display:inline-block;min-width:96px;border-bottom:var(--bw) solid var(--ink);text-align:center;color:var(--accent)}
  .me{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--on-ink);border-radius:var(--r-m) var(--r-m) 4px var(--r-m);padding:var(--sp-3) var(--sp-4);
    margin-bottom:var(--sp-2);font-weight:500;line-height:1.35;overflow-wrap:anywhere;animation:send .2s var(--open) both;transform-origin:100% 100%}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:var(--sp-3) var(--sp-4);background:var(--tint);border-radius:4px var(--r-m) var(--r-m) var(--r-m);margin-bottom:var(--sp-2)}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--cloud-hi);animation:dot 1s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{30%{transform:translateY(-4px)}60%{transform:none}}
  @keyframes say{from{opacity:0;transform:translateY(8px) scale(.97)}}
  @keyframes send{from{opacity:0;transform:scale(.94)}}
  @keyframes drop{from{opacity:0;transform:translateY(-10px)}}
  @keyframes fade{from{opacity:0}}

  /* replies live in the footer, like a keyboard's suggestion strip */
  .qrs{display:flex;flex-direction:column;gap:var(--sp-2)}
  .qrs.wrap{flex-direction:row;flex-wrap:wrap}
  .qr{min-height:var(--tap);text-align:left;border:var(--bw) solid var(--sep);border-radius:var(--r-m) var(--r-m) 4px var(--r-m);background:var(--surface);padding:var(--sp-3) var(--sp-4);font-size:var(--t-body);font-weight:600;line-height:1.3;color:var(--label);transition:transform .12s var(--open),border-color var(--dur) var(--ease);animation:say .22s var(--open) both}
  .qrs.wrap .qr{border-radius:var(--r-pill);padding:0 var(--sp-4)}
  .qr:active{transform:scale(.97);border-color:var(--ink)}
  .qrl{font-size:var(--t-foot);font-weight:500;color:var(--label-3);margin-bottom:var(--sp-2)}
  /* composer: a filled field, not a ring; no focus styling (L11), the send button carries the colour */
  .row{display:flex;align-items:flex-end;gap:var(--sp-2);padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-4);background:var(--surface-2);border:1px solid transparent;
    border-radius:calc(var(--tap)/2 + var(--sp-1) + 1px);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .row textarea{flex:1;min-width:0;min-height:var(--tap);max-height:8rem;padding:var(--sp-3) 0;border:0;background:transparent;font:inherit;font-weight:500;line-height:1.35;resize:none;outline:none;color:var(--label);field-sizing:content}
  .row textarea::placeholder{color:var(--label-2)} /* label-3 is 4.24:1 on the grey field */
  .row button{flex:none;width:var(--tap);height:var(--tap);display:grid;place-items:center;border:0;border-radius:50%;background:var(--ink);color:var(--on-ink);transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .row button:disabled{background:transparent;color:var(--label-3);cursor:default}
  .cnt{font-size:var(--t-cap);font-weight:700;color:var(--label-3);text-align:right;margin-top:var(--sp-1);min-height:1em}
  .starters{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--sp-4)) var(--sp-2);padding:0 var(--sp-4)}
  .starters::-webkit-scrollbar{display:none}
  .starters .qr{flex:none;white-space:nowrap;min-height:var(--tap);border:0;border-radius:var(--r-pill);background:var(--surface-2);padding:0 14px;font-size:var(--t-sub);font-weight:500;color:var(--label-2)}
  .starters .qr:active{background:var(--tint);color:var(--accent)}
  .link.quiet{text-decoration:none;font-weight:500}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:var(--r-pill);padding:var(--sp-3) var(--sp-5);
    font-size:var(--t-body);font-weight:700;background:var(--ink);color:var(--on-ink);transition:transform .12s var(--open)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface-2);color:var(--label-2);border:0}

  /* ===== saved card: the payoff lands where the work happened ===== */
  /* a keepsake, not a receipt: white card on the tactile rim, a band in the goal's tint with a date (Calm, stoic),
     Happi's sticker on the corner when there is no scene art (Life Reset), the turn from old thought to new view, then neutral stat tiles */
  .keep{position:relative;scroll-margin-top:28px;align-self:stretch;margin:var(--sp-5) 0 var(--sp-2);border:2px solid var(--sep);border-radius:24px;background:var(--surface);
    box-shadow:0 3px 0 var(--sep);animation:rise .3s var(--open) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
  .keep .band{border-radius:22px 22px 0 0;background:var(--g,var(--tint))}
  .keep .band>svg{display:block;width:100%;height:auto;max-height:112px;padding:var(--sp-4) var(--sp-6) 0} /* the scene it practised on: an image-led keepsake (Calm, stoic) */
  .keep .top{display:flex;align-items:center;gap:6px;padding:var(--sp-3) 88px var(--sp-3) var(--sp-4);font-size:var(--t-foot);font-weight:700;color:var(--accent)}
  .keep:not(:has(.sticker)) .top{padding-right:var(--sp-4)}
  @media (max-width:360px){.keep .top{font-size:var(--t-cap)}}
  .keep .top time{margin-left:auto;font-size:var(--t-foot);font-weight:600;color:var(--label-2)} /* sentence-case date (Wysa, Bears Gratitude) */
  .sticker{position:absolute;top:-18px;right:14px;width:62px;height:62px;padding:5px;border:2px solid var(--sep);border-radius:50%;background:var(--surface);
    box-shadow:0 3px 0 var(--sep);transform:rotate(8deg);animation:stick .25s var(--open) .2s both}
  .sticker svg{width:100%;height:100%}
  @keyframes stick{from{opacity:0;transform:rotate(8deg) scale(.95) translateY(-6px)}}
  .chk{flex:none;width:18px;height:18px}
  .chk circle{fill:var(--accent)}
  .chk path{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s var(--open) .3s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .keep .body{padding:var(--sp-4)}
  .lab{display:block;font-size:var(--t-foot);font-weight:600;color:var(--label-2)} /* quiet sentence-case labels; tracked caps on every block read as template */
  .was{padding:var(--sp-3) var(--sp-4);border-radius:16px;background:var(--surface-2)}
  .was p{margin-top:var(--sp-1);font-size:var(--t-sub);font-weight:500;line-height:1.4;color:var(--label)}
  .was .sit{margin-bottom:var(--sp-2)}
  .turn{display:grid;place-items:center;width:32px;height:32px;margin:-6px auto;position:relative;z-index:1;border-radius:50%;background:var(--ink);color:var(--on-ink);
    box-shadow:0 0 0 4px var(--surface);animation:turn .25s var(--open) .4s both}
  @keyframes turn{from{opacity:0;transform:scale(.95)}}
  /* the new view in the picked-option colours, without the press rim: it is chosen, not tappable */
  .now{padding:var(--sp-4);border:2px solid var(--ink);border-radius:16px;background:var(--tint)}
  .now .lab{color:var(--accent)}
  .now p{margin-top:var(--sp-1);font-family:var(--display);font-size:var(--t-lead);font-weight:600;line-height:1.25;color:var(--label);text-wrap:pretty}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-2);margin-top:var(--sp-4)}
  @media (max-width:360px){.stats{grid-template-columns:1fr}} /* "Overgeneralizing" can't wrap */
  /* neutral chips: the new view stays the card's only coloured block (one accent) */
  .stat{padding:var(--sp-3);border-radius:16px;background:var(--surface-2);animation:say .25s var(--open) .5s both}
  .stat+.stat{animation-delay:.58s}
  .stat:last-child:nth-child(odd){grid-column:1/-1}
  .stat .lab+span{display:block;margin-top:2px;font-size:var(--t-sub);font-weight:700;line-height:1.25;color:var(--label)}
  /* the real message, previewed above the ask (Lloyds, WHOOP); reuses production NotificationPreview */
  .note{display:flex;align-items:flex-start;gap:10px;margin-top:var(--sp-2);padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);animation:drop .35s var(--open) .5s both}
  .note img{flex:none;width:28px;height:28px;border-radius:7px}
  .note b{display:block;font-size:var(--t-foot);font-weight:600}
  .note span{display:block;font-size:var(--t-foot);font-weight:500;color:var(--label-2);line-height:1.3}
  .note time{margin-left:auto;font-size:var(--t-cap);font-weight:500;color:var(--label-3)}
  .pick .ic svg.swing{animation:swing .28s var(--travel);transform-origin:50% 10%}
  @keyframes swing{30%{transform:rotate(-9deg)}70%{transform:rotate(4deg)}}
  #tm{width:100%;margin-top:var(--sp-2);min-height:52px;padding:0 var(--sp-4);border:2px solid var(--sep);border-radius:18px;background:var(--surface);font:inherit;font-weight:700}

  /* ===== premium pass: patterns lifted from Duolingo, BitePal, Me+, Breeze, Locket (Mobbin, Nov 2026) ===== */
  /* each screen sits on a soft wash of its own tint, fading to white (Breeze, BitePal) */
  #app{background:linear-gradient(180deg,var(--wash,#fff) 0,var(--bg) 58%)}
  /* chunky primary button: a darker rim under the pill; pressing sinks into it (Duolingo) */
  .btn{box-shadow:0 4px 0 var(--accent);margin-bottom:4px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent)}
  .btn:disabled{background:var(--sep);color:var(--label-3);box-shadow:0 4px 0 #d4d4d4;cursor:default;transform:none}
  .btn.ghost{box-shadow:none;margin-bottom:0}
  /* Happi asks every question from a bubble beside it (Duolingo); the bubble is the screen's h1 */
  .ask{display:flex;align-items:flex-start;gap:var(--sp-2);padding-top:var(--sp-3)}
  .ask .host{flex:none;width:92px}
  .ask .host :is([data-p=cloud],[data-p=sun],[data-d]){display:none}
  .ask h1{position:relative;flex:1;margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);border:2px solid var(--sep);border-radius:20px;background:var(--surface);font-size:22px;line-height:1.25;animation:say .25s var(--open) both}
  h1:focus{outline:none}
  .ask h1::before{content:"";position:absolute;left:-8px;top:28px;width:12px;height:12px;background:var(--surface);border:2px solid var(--sep);border-top:0;border-right:0;transform:rotate(45deg)}
  .ask .host[hidden]+h1::before{display:none}
  /* option rows: white card, rim, tinted illustration tile; a selected row fills with sage */
  .picks{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-5)}

// Happi's passing remarks in the chat (hello, "You named the thought.", "Saved. It’s yours.") fade on their own;
// question bubbles (.ask h1) are the screen's question and stay
const speak=t=>{const s=$('#main .speech');if(!s||H.crisis)return;s.textContent=t;s.classList.add('on');clearTimeout(H.spT);H.spT=setTimeout(()=>s.classList.remove('on'),STILL?6000:3600)};

// ================= S0: hello =================
function s0(){
  R=fresh();beat=0;enter('s0',{back:false,wash:'#eef5e9'});
  $('#main').innerHTML=`<div class="s0"><p class="speech on">Hi, I’m Happi.</p><div class="host" id="guide"></div>
    <h1>One thought at a time.</h1><p class="lede">Two minutes. No sign-up.</p><p class="scope0">Happy helps you practise CBT skills. It isn’t therapy and doesn’t replace professional care.</p></div>`;
  $('#foot').innerHTML=`<button class="btn" id="hi">Hi, Happi</button><button class="link" id="who">Who is Happi?</button><button class="link" id="have">I already have an account</button>`;
  mount($('#guide'));act('rest');sky(.2);
  if(!H.greeted){H.greeted=true;greet()} // hello once per visit, the brand pose from Home
  $('#hi').onclick=()=>{buzz();s1()};
  $('#have').onclick=e=>openSheet('signin',e.currentTarget);$('#who').onclick=e=>openSheet('who',e.currentTarget);
}

// ================= S1: goal pick =================
function s1(){
  R=fresh();beat=0;enter('s1',{bar:0});
  $('#main').innerHTML=`<div class="s1"><div class="ask"><div class="host" id="guide"></div><h1>What’s on your mind?</h1></div>
    <div class="goals" role="group" aria-label="Pick what is on your mind">${GOALS.map((g,i)=>
      `<button class="goal" data-g="${g.id}" style="--g:${g.tint};animation-delay:${80+i*50}ms"><span class="gi">${headSvg(g.id)}</span><span>${g.label}<small>${g.sub}</small></span></button>`).join('')}</div></div>`;
  $$('.goal .gi svg').forEach(posed);
  mount($('#guide'));act('rest');sky(.35);
  $('.goals').onclick=async ev=>{
    const b=ev.target.closest('.goal');if(!b||$('.goal.on'))return;
    b.classList.add('on');buzz();inch();goal=GOALS.find(g=>g.id===b.dataset.g);R.goal=goal.id;
    act(goal.id);sky(goal.f);await wait(420);if(b.isConnected)chat(); // S1's main beat: Happi leans into what you picked
  };
  land();
}

// ================= S2: the Thought Catcher chat =================
const thread=()=>$('.thread');
// footer replies take height from main; keep the latest line above them
let pin=true; // off once the saved card lands: from then on the card's top is what stays in view
new ResizeObserver(()=>{if(!pin)return;const m=$('#main');m.scrollTop=m.scrollHeight}).observe($('#foot'));
const scroll=()=>{const m=$('#main');m.scrollTo({top:m.scrollHeight,behavior:STILL?'auto':'smooth'})};
const progress=()=>{beat++;inch()}; // back before the second reply returns to the goal pick
async function say(html,cls=''){
  const row=document.createElement('div');row.className='msg';
  const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';t.setAttribute('aria-hidden','true');
  look(1.5,-2); // thinking while typing
  thread().append(row);
  if(!STILL){row.append(t);scroll();await wait(Math.min(900,380+html.replace(/<[^>]+>/g,'').length*7))}
  t.remove();
  const b=document.createElement('div');b.className='bub '+cls;b.innerHTML=html;row.append(b);scroll();look(-1.2,1.6);
  await wait(220);return b;
}
const me=(text,from)=>{const p=document.createElement('div');p.className='me';p.textContent=text;thread().append(p);
  if(from&&!STILL){const m=$('#main');m.scrollTop=m.scrollHeight;const n=p.getBoundingClientRect(); // land first, then fly from the tapped chip
    p.style.animation='none';p.animate([{transform:`translate(${from.left-n.left}px,${from.top-n.top}px)`,opacity:.7},{transform:'none',opacity:1}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)'})}
  else scroll();return p};
// replies render in the footer; resolve with the chosen value and echo it as your bubble
function choose(items,{wrap=false,label='',echo=true}={}){
  return new Promise(res=>{
    $('#foot').innerHTML=`${label?`<p class="qrl">${label}</p>`:''}<div class="qrs${wrap?' wrap':''}" role="group">${items.map((it,i)=>
      `<button class="qr" data-i="${i}" style="animation-delay:${i*40}ms">${esc(it.t)}</button>`).join('')}</div>`;
    $('#foot .qrs').onclick=async ev=>{const b=ev.target.closest('.qr');if(!b)return;buzz();const it=items[+b.dataset.i],from=b.getBoundingClientRect();
      $('#foot .qrs').onclick=null;
      if(!STILL)$$('#foot .qr').forEach(o=>o!==b&&o.animate([{opacity:1},{opacity:0}],{duration:120,fill:'forwards'}));
      await wait(120);$('#foot').innerHTML='';if(echo)me(it.t,from);progress();res(it.v??it.t)};
    $('#foot .qr').focus({preventScroll:true});look(0,2.8);
  });
}
// stepping aside also pauses the clock: opacity 0 still intersects, so the observer alone won't stop it
const aside=on=>{$('.stage')?.classList.toggle('aside',on||H.crisis);wake()}; // after a crisis match Happi stays gone (zone 2)
const typing=on=>{aside(on);const sos=on||H.crisis;$('#sos').hidden=!sos;$('#spacer').hidden=sos}; // after a crisis match, Get help stays for the rest of onboarding
// P6 English crisis phrases; a match keeps the text and opens help, it never blocks or grades
const CRISIS=/\b((kill|hurt|cut)(ing)? myself|kms|end (my life|it all)|wanna die|want(ed)? to die|wish i (was|were) dead|better off (dead|without me)|suicid\w*|self[- ]?harm\w*|overdos\w*|no reason to live|can'?t go on|can ?not go on|do(n'?t| not) want to be here)\b/i;
function type({ph,starters=[]}){
  typing(true);const skip=more?'Skip, show an example':'Skip for now';
  return new Promise(res=>{
    $('#foot').innerHTML=`${starters.length?`<div class="starters" role="group" aria-label="Ideas to start from">${starters.map((s,i)=>`<button class="qr" data-s="${i}">${esc(s)}</button>`).join('')}</div>`:''}
      <div class="row"><textarea id="ta" rows="1" maxlength="${MAX}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></textarea>
      <button id="send" aria-label="Send" disabled>${IC('<path d="M12 19V5M5 12l7-7 7 7"/>')}</button></div><p class="cnt" id="cnt" aria-live="polite"></p>
      <button class="link quiet" id="ex" style="margin-top:0">${skip}</button>`;
    const ta=$('#ta'),send=$('#send');
    const upd=()=>{const n=ta.value.length;send.disabled=!ta.value.trim();$('#cnt').textContent=n>=240?`${MAX-n} left`:''};
    ta.oninput=upd;ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}};
    $$('#foot [data-s]').forEach(b=>b.onclick=()=>{ta.value=starters[+b.dataset.s];upd();ta.focus();buzz()});
    send.onclick=()=>{const v=ta.value.trim();if(!v)return;
      if(!H.crisis&&CRISIS.test(v.replace(/[’‘]/g,"'"))){H.crisis=true;aside(true);openSheet('help',send);return}
      $('#foot').innerHTML='';typing(false);me(v);progress();res(v)};
    $('#ex').onclick=()=>{$('#foot').innerHTML='';typing(false);me(skip);progress();res(null)};
    ta.focus({preventScroll:true});look(0,2.8);
  });
}

// teach = situation, then the thought, then a reason the other view is plausible (no terminology quiz).
// Belief is rated before and after; no change is a fine answer. Copy adapted from ThoughtCatcherSummary getShiftCopy.
const CHECK=[{t:'Yes',v:'yes'},{t:'Not sure',v:'unsure'},{t:'No',v:'no'}];
const CHECK_REPLY={yes:'It feels true, and that’s real. But feeling sure isn’t the same as knowing.',
  unsure:'Not being sure is fine. Let’s look closer.',no:'So your mind added more than what happened.'};
const shiftCopy=(a,b)=>{const d=a-b;
  if(d<0)return 'You believe it a bit more right now. You still looked at it closely.';
  if(d===0)return 'Your belief stayed the same, and you still stopped to check it.';
  if(d>=2)return 'You believe it a lot less now.';
  return 'You believe it a little less. That’s room for another view.'};
const weigh=v=>.2+v*.15; // belief 0..4 is the cloud's weight
// "Is it actually true?" only when the thought has some weight; asking it right after "Not at all" contradicts the rating
async function reality(before){
  if(before===0){await say('Then you don’t believe it. Let’s look at it anyway.');return null}
  await say('Is it actually true?');
  const check=await choose(CHECK,{wrap:true});
  if(check==='yes')act('gentle');else nod();
  await say(CHECK_REPLY[check]);return check}
// after the reframe the user's honest answer is not graded by rain or a slump
async function rate(q,after=false){await say(q);const v=await choose(BELIEF.map((t,i)=>({t,v:i})),{wrap:true});
  sky(after?Math.min(weigh(v),.3):weigh(v));act(after?'listen':v>=3?'heavy':v===0?'gentle':'listen');return v}

// the hero folds into the chat: Happi travels to the corner (FLIP on the host), the bubble leaves with it
async function settle(){
  const el=$('.stage'),s=el.querySelector('.say'),h=$('#guide');
  if(!STILL){s.animate([{opacity:1},{opacity:0,transform:'scale(.96)'}],{duration:140,easing:'ease-in',fill:'forwards'});await wait(140)} // exits are quicker than entrances
  const a=h.getBoundingClientRect();
  s.remove();el.classList.remove('hero');
  const b=h.getBoundingClientRect();if(STILL||!b.width)return;
  h.style.transformOrigin='0 0';
  h.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width})`},{transform:'none'}],{duration:420,easing:'cubic-bezier(.77,0,.175,1)'});
}
async function scene(g){
  const f=document.createElement('figure');f.className='scene';f.style.setProperty('--g',g.tint);
  f.innerHTML=`${SCENE[g.id]}<figcaption>${esc(g.scene)}</figcaption>`;thread().append(f);scroll();
  if(!$('#foot').contains(document.activeElement)){f.tabIndex=-1;f.focus({preventScroll:true})} // focus lands on the scene, not the page, until the next reply
  await wait(600)}
async function teach(g){
  await scene(g);
  await say(`Then this thought shows up:<q class="pt">“${esc(g.thought)}”</q>`);
  const before=await rate(`If that happened to you, how much would you believe “${esc(bare(g.thought))}”?`);
  await reality(before);
  if(before>0){sky(.12,true);act('relieved',1600);stretch()}else{sky(.12);act('listen')} // relief only for a thought that had weight. The main beat: the sky clears as the reframe lands, Happi looks up at it
  await say(`Here’s another way to see it:<span class="pt">${esc(g.fair)}</span><span class="why">${esc(g.why)} This trap is called “${TRAPS[g.trap].toLowerCase()}.”</span>`);
  await wait(400);
  if(before===0){act('rest');return {g,before,after:0}} // nothing to lower; asking again reads as a quiz
  const after=await rate(`Look at “${esc(bare(g.thought))}” again. How much do you believe it now?`,true);
  await say(shiftCopy(before,after));act('rest'); // rate's reaction holds while Happi answers
  return {g,before,after};
}

// the same three moves on your own moment: what happened, the thought, one fairer view
async function personal(){
  sky(.6);act('listen');
  await say('What happened? Just what a camera would have seen.');
  const situation=await type({ph:'What happened, in a few words',starters:goal.ideas.sit});
  if(situation===null)return null;
  await say('What did your mind add? Write it the way it showed up.');
  const thought=await type({ph:'The thought, in a few words',starters:goal.ideas.th});
  if(thought===null)return null;
  speak('You named the thought.');nod();
  const before=await rate(`How much do you believe “${esc(bare(thought))}” right now?`);
  await reality(before);
  await say('What’s another way to see it? Fair and believable, not forced positive.');
  const fair=await type({ph:'Another way to see it',starters:STARTERS});
  if(fair===null)return null;
  if(before>0){sky(.15,true);act('relieved',1600);stretch()}else{sky(.15);act('listen')}
  if(before===0)return {source:'personal',situation,thought,fair,trap:'',why:'',before,after:0};
  const after=await rate(`Look at “${esc(bare(thought))}” again. How much do you believe it now?`,true);
  await say(shiftCopy(before,after));act('rest');
  return {source:'personal',situation,thought,fair,trap:'',why:'',before,after};
}
const fromExample=({g,before,after})=>({source:'example',art:g.id,situation:g.scene,thought:g.thought,fair:g.fair,trap:g.trap,why:g.why,before,after});

async function chat(){
  enter('chat',{bar:1});beat=0;
  $('#main').innerHTML=`<div class="stage hero"><h1 class="say">${esc(goal.mirror)}</h1><p class="speech" aria-live="polite"></p><div class="host" id="guide"></div></div><div class="thread" aria-live="polite"></div>`;
  // the weather keeps the topic's weight; at this size Happi meets you warm, never a magnified slump (03 F6)
  mount($('#guide'));act('gentle');stretch();
  $('#foot').innerHTML='<button class="btn" id="show">Show me</button>';land(); // the line is heard first, then the one button
  await new Promise(r=>$('#show').onclick=()=>{buzz();r()});
  $('#foot').innerHTML='';progress();await settle();
  // the line stays as the chat's first message for sighted history; screen readers already heard it as the heading
  const m=document.createElement('div');m.className='msg';m.setAttribute('aria-hidden','true');m.innerHTML=`<div class="bub">${esc(goal.mirror)}</div>`;thread().append(m); // a Continue button isn't a reply, so nothing is echoed (Duolingo)
  more=true;let last=await teach(goal),asked=false;
  Object.assign(R,fromExample(last));
  while(true){
    stage(2);if(!asked)await say('Want to try one of yours?');asked=false;
    const opts=[{t:'Try with something from today',v:'mine'},...(more?[{t:'Another example',v:'more'}]:[]),{t:'Save this one',v:'go'}];
    const c=await choose(opts);
    const another=async lead=>{more=false;const g2=GOALS[(GOALS.indexOf(goal)+1)%GOALS.length];if(lead)await say(lead);sky(g2.f);act(g2.id);
      last=await teach(g2);Object.assign(R,fromExample(last))};
    if(c==='more'){await another();continue}
    if(c==='mine'){
      const mine=await personal();
      if(mine){Object.assign(R,mine);break}
      Object.assign(R,fromExample(last)); // nothing typed is kept when you bail out
      if(more){await another('Here’s a different one.');continue} // "example instead" shows an example, not a skip
      asked=true;await say('No problem. Want to try one of yours, or move on?');continue} // never jump to the saved card on a bail-out
    break;
  }
  await saved();
}

// ================= saved card, then the reminder =================
const sentence=s=>{s=s.trim();s=s[0].toUpperCase()+s.slice(1);return /[.!?…”"]$/.test(s)?s:s+'.'};
async function saved(){
  const mine=R.source==='personal'; // the example's words are the app's, never claimed as the user's
  stage(3);$('#back').style.visibility=$('#bar').style.visibility='hidden'; // done: no step left to show (Duolingo drops the bar on completion)
act('pride');sky(.08);speak(mine?'Saved. It’s yours.':'You finished this one.');
  to('gx',-2.5,500);to('gy',2,500);H.hold=H.t+1500; // quiet pride, eyes on the card with you (03 F5)
  const card=document.createElement('section');card.className='keep';card.setAttribute('aria-label','Saved reflection'); // not .card: happy-ui.css flattens .card to grey
  const gid=mine?R.goal:R.art; // "Another example" may have switched goals: the band shows the example actually saved
  card.style.setProperty('--g',GOALS.find(g=>g.id===gid)?.tint||'');
  // belief is reported, never graded: same or higher reads as plainly as lower
  const belief=R.before===0?BELIEF[0]:R.after===R.before?`${BELIEF[R.before]}, still`:`${BELIEF[R.before]}, now ${BELIEF[R.after].toLowerCase()}`;
  const now=new Date(),ymd=[now.getFullYear(),now.getMonth()+1,now.getDate()].map(n=>String(n).padStart(2,'0')).join('-'); // local date, not UTC
  // one character per card (Bears Gratitude, Wysa): the sticker only when no scene art is shown, since scenes can hold Happi
  card.innerHTML=`${H.crisis||!(mine||!SCENE[gid])?'':`<span class="sticker" aria-hidden="true">${headSvg('card','pride')}</span>`}
    <div class="band">${mine?'':SCENE[gid]||''}<div class="top"><svg class="chk" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16"/><path d="M9 16.5l5 5L23.5 11"/></svg>${mine?'Saved to your journal':'Saved as practice'}<time datetime="${ymd}">${now.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</time></div></div>
    <div class="body">
      <div class="was">${mine?`<span class="lab">What happened</span><p class="sit">${esc(sentence(R.situation))}</p>`:''}<span class="lab">${mine?'You thought':'The thought'}</span><p>“${esc(unq(R.thought))}”</p></div>
      <div class="turn" aria-hidden="true">${IC('<path d="M12 5v14M6 13l6 6 6-6"/>').replace('width="22" height="22"','width="18" height="18"')}</div>
      <div class="now"><span class="lab">${mine?'You landed on':'Another view'}</span><p>${esc(R.fair)}</p></div>
      <div class="stats"><div class="stat"><span class="lab">How true it felt</span><span>${belief}</span></div><div class="stat"><span class="lab">Practice</span><span>1 completed · 1 of 3 this week</span></div>${R.trap?`<div class="stat"><span class="lab">Trap</span><span>${TRAPS[R.trap]}</span></div>`:''}</div>
    </div>`;
  card.querySelector('.sticker svg')&&posed(card.querySelector('.sticker svg'));
  // the keepsake lands with its top (art and sticker) in view; on small phones the chips sit below the fold, not the art
  pin=false;thread().append(card);const top=()=>card.scrollIntoView({block:'start',behavior:STILL?'auto':'smooth'});top();
  // one-shot, overlapping: card rises, sticker lands, check draws, the turn pops, the chips follow
  await wait(900);if(view!=='chat')return; // Happi's pride beat lands first; the card stays in the thread
  // EXPERIENCE.md: the reminder is asked here, right after the value it protects, never as its own step.
  // Happi steps aside for the ask (zone 6). Go to Home works whatever you answer.
  aside(true);
  $('.stage').classList.add('gone'); // the empty stage would sit over the ask and catch taps
  const r=document.createElement('div');r.className='remind';r.id='remind';r.setAttribute('aria-live','off');thread().append(r);remindAsk();top();
  $('#foot').innerHTML='<button class="btn" id="go">Go to Home</button>';$('#go').onclick=()=>{buzz();finish()};
}
// the ask shows the real notification first (Brilliant, Insight Timer), then one tap on a time; the native prompt only after that
const at=v=>v==='morning'?'8:00 AM':v==='evening'?'8:00 PM':v;
const rows=(items,label)=>`<div class="picks" role="group" aria-label="${label}">${items.map((it,i)=>
  `<button class="pick" data-k="${it.v}" style="animation-delay:${60+i*50}ms"><span class="ic" style="--g:${it.g}">${ART[it.ic]}</span>${it.t}${it.s?`<small>${it.s}</small>`:''}</button>`).join('')}</div>`;
function remindAsk(focus='q'){
  $('#remind').innerHTML=`<p class="rq" tabindex="-1">${focus==='pick'?'Pick a new time':'Want a nudge for your next one?'}</p>
    <div class="note" role="note" aria-label="Preview of the reminder"><img src="../assets/icons/icon-panda.png" alt="" width="28" height="28"><div><b>Happy</b><span>Ready to catch one more thought? 2 minutes.</span></div><time>now</time></div>
    ${rows(TIMES,'Reminder time')}`; // no "Not now": Go to Home is the skip, one exit instead of two
  (focus==='q'?$('#remind .rq'):$('#remind .pick')).focus({preventScroll:true});
  $('#remind .picks').onclick=ev=>{const b=ev.target.closest('.pick');if(!b)return;buzz();const v=b.dataset.k;
    if(v==='pick'){$('#remind .picks').outerHTML=`<div class="picks" role="group" aria-label="Pick a reminder time"><input type="time" id="tm" value="20:00" aria-label="Reminder time"><button class="pick" id="ok" style="justify-content:center">Set reminder</button></div>`;
      $('#tm').focus();$('#ok').onclick=()=>{if(!$('#tm').value)return;const [h,m]=$('#tm').value.split(':').map(Number);ask(`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`)};return}
    restart(b.querySelector('svg'),'swing');ask(at(v))};
}
// iOS asks for permission once; changing the time after Allow just reschedules
const ask=time=>{if(R.reminder&&R.reminder!=='not_now'&&R.reminder!=='denied'){R.reminder=time;return done(`Reminder set for ${time}`)}systemPrompt(time)};
// the row settles into one quiet line you can change; role=status so the result is heard
const done=(t,again=true)=>{$('#remind').innerHTML=`<div class="done"><span role="status">${esc(t)}</span>${again?'<button data-again>Change</button>':''}</div>`;
  $('[data-again]')?.addEventListener('click',()=>remindAsk('pick'));$('#go').focus({preventScroll:true})};
// sample of the native iOS prompt: it only appears after the user picked a time
function systemPrompt(time){
  if($('.ios'))return;const o=document.createElement('div');o.className='ios';
  o.innerHTML=`<div role="alertdialog" aria-labelledby="ios-t"><b id="ios-t">“Happy” Would Like to Send You Notifications</b><span>Notifications may include alerts, sounds, and icon badges.</span>
    <nav><button data-a="0">Don’t Allow</button><button data-a="1">Allow</button></nav><em>Sample of the iOS system prompt</em></div>`;
  $('#app').append(o);o.querySelector('[data-a="1"]').focus();
  o.onclick=ev=>{const b=ev.target.closest('[data-a]');if(!b)return;o.remove();
    if(b.dataset.a==='1'){R.reminder=time;done(`Reminder set for ${time}`)}
    else{R.reminder='denied';done('Reminders are off. You can turn them on in Settings.',false)}}; // no retry this session
}
function finish(){
  R.reminder??='not_now'; // left without picking a time
  if(R.reminder!=='not_now'&&R.reminder!=='denied')store('happy.reminder',R.reminder);
  store('happy.onboarding',{...R,crisis:!!H.crisis,trapLabel:R.trap?TRAPS[R.trap]:'',at:Date.now()}); // Home stays quiet after a crisis match
  location.href='home.html?empty&welcome';
}

// ================= back, sheets =================
$('#back').onclick=()=>{
  if(view==='chat'){if(beat<2)s1();else openSheet('leave',$('#back'));return}
  const prev={s1:s0}[view];if(!prev)return;
  prev();if(view==='s0')$('#hi').focus()};
const SHEETS={
  // plain, no Happi, no animation, resources first (03 F12, P6 Crisis path). ponytail: US line only, locale rows when localised
  help:()=>`<h3 id="sh-t">If you’re thinking about hurting yourself, you deserve support now.</h3><p>988 Suicide &amp; Crisis Lifeline · call or text 988</p><a class="btn" href="tel:988">Call 988</a><p class="scope" style="margin-top:var(--sp-3)">Happy isn’t an emergency service. If you might act on these thoughts, call now.</p><button class="btn ghost" data-close>Keep writing</button>`,
  who:()=>`<h3 id="sh-t">Who is Happi?</h3><p>Happi is a panda who likes slow mornings and noticing small things. Happi keeps you company while you practise the skills in Happy. Happi isn’t a therapist, a coach or a judge, and never grades how you feel. When you write, Happi looks at your words, not at you. When things get serious, Happi steps aside so real people can help. Happi doesn’t need anything from you. You’re welcome here any time.</p><p class="scope">Happy helps you practise CBT skills. It isn’t therapy and doesn’t replace professional care.</p><button class="btn" data-close>Got it</button>`,
  leave:()=>`<h3 id="sh-t">Leave this practice?</h3><p>Nothing is saved yet.</p><button class="btn" data-close>Keep going</button><button class="btn ghost" data-leave>Leave</button>`,
  signin:()=>`<h3 id="sh-t">Welcome back</h3><p>Sign in to pick up where you left off.</p><div class="sso">
    <button class="dark" data-in>Continue with Apple</button><button data-in>Continue with Google</button><button data-in>Continue with email</button></div>
    <p style="margin:var(--sp-3) 0 0;font-size:var(--t-foot)">Sample sign-in. No account is created.</p>`,
};
let from=null;
function openSheet(k,el=document.activeElement){from=el; // Safari doesn't focus a tapped button, so callers pass it
  $('#sheet').innerHTML=`<button class="x" data-close aria-label="Close">${IC('<path d="M6 6l12 12M18 6L6 18"/>')}</button>`+SHEETS[k]();$('#sheet').classList.toggle('help',k==='help');
  $('#scrim').hidden=$('#sheet').hidden=false;$('#sheet .x').focus()}
function closeSheet(){$('#scrim').hidden=$('#sheet').hidden=true;from&&from.focus()}
$('#scrim').onclick=closeSheet;
$('#sos').onclick=e=>openSheet('help',e.currentTarget);
$('#sheet').onclick=ev=>{
  if(ev.target.closest('[data-close]'))return closeSheet();
  if(ev.target.closest('[data-leave]')){closeSheet();s1();$('.goal').focus();return}
  if(ev.target.closest('[data-in]'))location.href='home.html';
};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
s0();
</script>
</body>
</html>
