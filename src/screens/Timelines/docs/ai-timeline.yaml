version: "2.0"

feature:
  name: "AI Reflection Timeline"
  codename: "Life Story Timeline"
  status: "Design"

vision: >
  Build an AI-powered reflection timeline that helps users understand
  the evolving story of their wellbeing over time.

  Instead of judging, scoring or diagnosing, the AI helps users
  discover patterns, recurring themes and meaningful relationships
  across journals, habits, meals, CBT exercises and future wellness
  signals.

  The AI acts as a reflective companion rather than an evaluator.

problem_statement:
  current_state:
    - Journal exists independently.
    - Habit tracker exists independently.
    - Meal tracker exists independently.
    - CBT exercises exist independently.
    - Users collect valuable data but cannot understand how different parts of their life connect.

  user_problem:
    - Users forget how they felt days or weeks ago.
    - Users cannot easily identify recurring stressors.
    - Users struggle to discover which routines appear alongside better days.
    - Users only see isolated events instead of a larger story.
    - Valuable personal insights remain hidden across many entries.

product_goal:
  primary_goal: >
    Transform fragmented wellness activities into meaningful,
    evidence-based reflections.

  secondary_goals:
    - Help users discover recurring patterns.
    - Connect multiple dimensions of wellbeing.
    - Encourage self-reflection.
    - Improve long-term engagement.
    - Help users remember meaningful moments.
    - Make AI feel like a thoughtful companion.

  explicitly_not_the_goal:
    - Diagnose mental health.
    - Replace therapists.
    - Predict depression.
    - Judge users.
    - Compare users.
    - Assign wellness scores.
    - Decide whether a day was good or bad.

core_principle:
  title: "Observe, Don't Judge"

  explanation: >
    AI should describe observations supported by recorded evidence.
    It should never evaluate the user's wellbeing or assign meaning
    that is not supported by their own data.

  avoid:
    - "You had a bad day."
    - "You are getting worse."
    - "You recovered."
    - "You failed your routine."
    - "Your mental health declined."

  prefer:
    - "Work appeared more frequently in today's journal."
    - "Morning routines were less consistent this week."
    - "Family appeared more often during the second half of the month."
    - "CBT exercises frequently followed stressful journal entries."
    - "Several calmer reflections appeared after consistent morning routines."

timeline_levels:
  daily:
    objective: >
      Help users understand today's recorded experiences.

    ai_role: >
      Summarize today's activities, identify themes,
      compare against recent history and surface one or two
      observations worth reflecting on.

    inputs:
      - Journal
      - Meals
      - Habits
      - CBT

    output_sections:
      - What Happened
      - Themes
      - Changes
      - Insight

  weekly:
    objective: >
      Discover recurring patterns across multiple days.

    inputs:
      - Daily AI summaries

    output_sections:
      - Reflection Summary
      - Frequently Observed Patterns
      - Frequently Mentioned Positive Experiences
      - Frequently Mentioned Challenges
      - Changes Observed Over Time
      - Insights
      - Evidence From Recorded Activities
      - Personalized Reflection
      - Next Week Reflection

  monthly:
    objective: >
      Tell the story of the month rather than summarize statistics.

    inputs:
      - Weekly AI summaries

    output_sections:
      - Month In One Sentence
      - Reflection Summary
      - Defining Themes
      - Frequently Observed Patterns
      - Changes Observed Over Time
      - Insights
      - Evidence From Recorded Activities
      - Personalized Reflection
      - Next Month Reflection

insights:
  description: >
    Insights are the signature feature of the AI Reflection Timeline.
    They connect multiple recorded activities to surface meaningful
    relationships that may not be obvious from individual entries.

  rules:
    - Must be supported by recorded evidence.
    - Prefer connecting two or more dimensions.
    - Never imply causation.
    - Never diagnose.
    - Never speculate.
    - Return zero insights if insufficient evidence exists.

  example:
    observation: >
      During weeks where your morning routine stayed
      consistent, your journal entries more often
      described calmer evenings.

    explanation: >
      This relationship appeared repeatedly across
      multiple recorded days. It represents an
      observed association rather than evidence
      that one caused the other.

comparison_strategy:
  compare_against:
    - Yesterday
    - Last 7 days
    - Previous week
    - Previous month
    - Last 30 days

  never_compare:
    - Other users
    - Population averages
    - Generic wellness benchmarks

important_design_decision:
  never_measure:
    - Good day
    - Bad day
    - Successful day
    - Failed day
    - Healthy person
    - Unhealthy person

  instead_measure:
    - Patterns
    - Changes
    - Themes
    - Relationships
    - Reflection
    - Consistency

behavior_vs_wellbeing:
  principle: >
    Behaviors alone do not indicate wellbeing.

  examples:
    - Completing every habit does not necessarily
      mean the user felt emotionally well.

    - Skipping every habit does not necessarily
      mean the user had a bad day.

    - Journaling about difficult emotions may
      represent meaningful reflection rather than
      poor wellbeing.

  purpose: >
    Discover personalized patterns unique to the
    individual user.

  examples:
    - Morning walks frequently appeared alongside calmer reflections.
    - Journaling before bed often preceded less stressful mornings.
    - CBT exercises commonly followed work-related journal entries.
    - Family appeared more frequently after quieter weekends.

daily_ai_prompt_objective:
  answer_questions:
    - What happened today?
    - What themes appeared?
    - What changed compared with recent days?
    - What is worth noticing today?

language_guidelines:
  preferred_words:
    - appears
    - seems
    - often
    - may
    - recently
    - pattern
    - relationship
    - observation
    - reflection
    - compared with

  avoid_words:
    - failed
    - recovering
    - healthier
    - unhealthy
    - improving
    - declining
    - success
    - worse
    - better
    - mentally stronger

tone:
  personality:
    - Curious
    - Calm
    - Compassionate
    - Neutral
    - Reflective

  never_be:
    - Judgmental
    - Diagnostic
    - Dramatic
    - Alarmist
    - Authoritative

evidence_philosophy:
  principle: >
    Every insight must be explainable using the user's
    own recorded activities.

  requirements:
    - Never invent relationships.
    - Never overstate weak evidence.
    - Prefer one strong insight over many weak ones.
    - Confidence reflects evidence strength, not certainty.

data_pipeline:
  daily:
    inputs:
      - Journal
      - Habits
      - Meals
      - CBT

    output:
      - Daily AI Summary

  weekly:
    inputs:
      - Daily AI Summaries

    output:
      - Weekly Reflection

  monthly:
    inputs:
      - Weekly Reflections

    output:
      - Monthly Reflection

storage_strategy:
  recommendation:
    - Generate once.
    - Store permanently.
    - Never regenerate historical summaries automatically.

  reasons:
    - Lower AI cost.
    - Consistent user experience.
    - Stable historical timeline.

edge_cases:
  insufficient_data:
    response: >
      Continue recording your experiences.
      As more information becomes available,
      reflections will become increasingly personalized.

  no_journal:
    behavior: >
      Generate reflections using habits,
      meals and CBT only.

  habits_only:
    behavior: >
      Describe routines without inferring emotions.

  cbt_only:
    behavior: >
      Mention completed exercises without
      interpreting therapeutic outcomes.

non_goals:
  - Therapy replacement
  - Mental health diagnosis
  - Medical advice
  - Predicting depression
  - Wellness scores
  - User ranking
  - Comparing users

success_metrics:
  product:
    - Increased journal retention
    - Increased weekly engagement
    - Increased timeline visits
    - Increased monthly retention

  qualitative:
    - Users discover meaningful patterns.
    - Users revisit previous reflections.
    - Users trust AI observations.
    - Users feel understood rather than judged.

north_star:
  statement: >
    Help users understand the story of their
    wellbeing through evidence-based reflection,
    not evaluation.

final_philosophy: >

  The AI Reflection Timeline is not a report card.

  It is a reflective companion.

  Every reflection should help users notice
  something meaningful about themselves,
  grounded in their own recorded experiences,
  without deciding whether they are doing
  well or poorly.
