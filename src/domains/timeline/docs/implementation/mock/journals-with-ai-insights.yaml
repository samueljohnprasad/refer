          into the office because everyone already seemed to know each other.
          My manager was welcoming, but I kept worrying that I wouldn't meet
          expectations. Overall it went better than I expected.

        ai_insights:
          reflection:
            user_summary: >
              Your first day at your new job brought understandable nervousness
              about fitting in and meeting expectations. Although you started
              the day feeling uncertain, positive interactions with your manager
              helped you finish the day feeling more reassured.

            key_takeaways:
              - Started a new job.
              - Felt anxious about first impressions.
              - Received a welcoming response from the manager.
              - Ended the day more optimistic than expected.

          structured_memory:
